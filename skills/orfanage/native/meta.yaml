# orfanage native 自包含实现元数据

id: orfanage_native
version: "1.2.0-v1.0"
software: orfanage
type: native
source_type: custom

summary: "Self-contained ORFanage runner：按参考模板合并/注释预测 ORF（GFF3 -> GTF），自动注入线程优化。"

agent_guidance:
  when_to_use: "AI Agent Function Calling 或独立 Python/Shell CLI 调用时优先使用本实现。"
  recommendation_priority: "High（非流程引擎场景的主执行目标）。"

inputs:
  query:
    type: file
    format: [gff3]
    required: true
    cli_arg: "--query"
    description: "预测的 GFF3（如 TransDecoder 输出的 *.transdecoder.gff3）"
  output:
    type: file
    required: false
    cli_arg: "--output"
    description: "输出 GTF（默认 orfanage.gtf）"
  reference:
    type: file
    format: [fasta]
    required: false
    cli_arg: "--reference"
    description: "参考序列 FASTA"
  templates:
    type: string
    required: true
    cli_arg: positional
    description: "一个或多个模板 FASTA（参考转录本/直系同源序列），空格分隔"
  lpi:
    type: integer
    required: false
    cli_arg: "--lpi"
    description: "长蛋白长度阈值（-1 表示禁用）"
  ilpi:
    type: integer
    required: false
    cli_arg: "--ilpi"
  mlpi:
    type: integer
    required: false
    cli_arg: "--mlpi"
  minlen:
    type: integer
    required: false
    cli_arg: "--minlen"
    description: "最小 ORF 长度"
  mode:
    type: string
    required: false
    cli_arg: "--mode"
  stats:
    type: string
    required: false
    cli_arg: "--stats"
  overhang:
    type: integer
    required: false
    cli_arg: "--overhang"
  cleanq:
    type: boolean
    default: false
    cli_arg: "--cleanq"
  cleant:
    type: boolean
    default: false
    cli_arg: "--cleant"
  rescue:
    type: boolean
    default: false
    cli_arg: "--rescue"
  use_id:
    type: boolean
    default: false
    cli_arg: "--use-id"
  non_aug:
    type: boolean
    default: false
    cli_arg: "--non-aug"
  keep_all_cds:
    type: boolean
    default: false
    cli_arg: "--keep-all-cds"
  keep_cds_if_not_found:
    type: boolean
    default: false
    cli_arg: "--keep-cds-if-not-found"
  spliced_overhang:
    type: boolean
    default: false
    cli_arg: "--spliced-overhang"
  threads:
    type: integer
    default: 4
    cli_arg: "--threads"
    description: "线程数（自动注入）"
  extra_args:
    type: string
    required: false
    description: "透传 orfanage 额外参数（高级用法，慎用）"

outputs:
  orfanage_gtf:
    type: file
    format: gtf
    path_pattern: "{output}"
    description: "ORFanage 合并/注释后的 GTF"

environment:
  conda: "environment.yml"
  dockerfile: "Dockerfile"
  apptainer_def: "Apptainer.def"

optimization:
  default_cpus: 4
  default_mem_mb: 8192
  env_vars:
    TMPDIR: "{tmpdir}"

execution:
  entrypoint: "python main.py"
  test_command: "bash test/run_test.sh"
  binary: "orfanage"

software_versions:
  orfanage: "1.2.0"
  source: "bioconda::orfanage=1.2.0（Debian apt 无 orfanage，native 容器走 micromamba）"
  note: "与 flrnaseq orfrange_archive 归档的 orfanage.yaml 一致。"
