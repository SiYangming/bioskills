# stringtie / nextflow / nf-core 说明模块
# ---------------------------------------------------------------------------
# source_type: official —— 仅保留说明、接口 Schema 与引用，不重写源码。
# nf-core 官方有两个子模块：modules/nf-core/stringtie/stringtie（组装）与
# modules/nf-core/stringtie/merge（合并），均 pin bioconda::stringtie=3.0.3。
# ---------------------------------------------------------------------------

id: stringtie_nextflow_nfcore
version: "master"
software: stringtie
type: nextflow_nfcore
source_type: official

summary: "Official nf-core process for stringtie (modules/nf-core/stringtie/{stringtie,merge}：样本组装 + 多样本合并)."

agent_guidance:
  when_to_use: "组装 Nextflow DSL2 流程、目标为 HPC/Cloud 时，直接 include 对应子模块。"
  recommendation_priority: "Medium（Nextflow 流程引擎场景使用；CLI/Agent 直调请走 native）。"

software_versions:
  module_version: "nf-core master（2026-09 抓取）"
  stringtie: "3.0.3"
  source: "bioconda::stringtie=3.0.3（modules/nf-core/stringtie/{stringtie,merge}/environment.yml）"
  note: "两个子模块 environment.yml 均 pin bioconda::stringtie=3.0.3，与 native 版本一致；
         container 由 community.wave.seqera.io 按该 env 生成；bump 模块后请同步刷新本文件。"

source_reference:
  repository: "https://github.com/nf-core/modules"
  modules_base: "modules/nf-core/stringtie"
  submodules:
    - "stringtie"
    - "merge"
  submodules_note: >
    2026-09 抓取 https://api.github.com/repos/nf-core/modules/contents/modules/nf-core/stringtie
    返回两个子目录：stringtie（单样本组装）与 merge（多样本合并）。
    列表以 https://github.com/nf-core/modules/tree/master/modules/nf-core/stringtie 在线目录为准。

inputs:
  meta:
    type: map
    description: "Groovy 样本元信息，如 [ id:'sample1' ]"
  bam:
    type: file
    format: bam
    required: true
    description: "输入 BAM（stringtie 子模块：比对后的 long-read BAM）"
  gtf:
    type: file
    format: gtf
    required: false
    description: "参考注释 GTF（merge 子模块：GTF 列表文件）"

outputs:
  gtf:
    type: file
    format: gtf
    description: "组装/合并后的转录本 GTF"
  versions:
    type: file
    pattern: "versions.yml"
    description: "nf-core 标准版本文件"

execution:
  mode: nextflow_include
  include_statement: "include { STRINGTIE } from './modules/nf-core/stringtie/stringtie/main'"
  include_pattern: "include { STRINGTIE } from './modules/nf-core/stringtie/stringtie/main'; include { STRINGTIE_MERGE } from './modules/nf-core/stringtie/merge/main'"
  container: "community.wave.seqera.io/library/stringtie:3.0.3--h29c0135_0"
  setup_hint: |
    在项目仓库根执行：
      nf modules install nf-core stringtie/stringtie
      nf modules install nf-core stringtie/merge
    本目录仅提供 include 参考与统一 Schema，不重写官方源码；
    若官方缺失 / 需定制，请使用 ../local/。
