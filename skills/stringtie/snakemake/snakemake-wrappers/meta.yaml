# stringtie / snakemake / snakemake-wrappers 说明模块
# ---------------------------------------------------------------------------
# source_type: official —— 仅保留说明、桥接脚本与接口 Schema，不重写源码。
# 注意：官方 snakemake-wrappers 目前【没有】bio/stringtie wrapper（抓取 404），
#       本目录仅登记桥接层；实际执行请使用 stringtie_snakemake_local（stringtie.smk）。
# ---------------------------------------------------------------------------

id: stringtie_snakemake_wrappers
version: "v3.13.0"
software: stringtie
type: snakemake_wrappers
source_type: official

summary: "Official Snakemake Wrappers 登记层 for stringtie（官方 bio/stringtie 缺失，submodules 为空；实际走 local）。"

agent_guidance:
  when_to_use: "组装 Snakemake 流程时；官方 bio/stringtie wrapper 缺失，请直接使用 stringtie_snakemake_local。"
  recommendation_priority: "Low（官方 wrapper 不存在；本实现仅说明层，实际路由到 snakemake_local）。"

software_versions:
  wrapper_tag: "v3.13.0"
  stringtie: "官方无 wrapper（bio/stringtie 404）"
  source: "—（snakemake-wrappers 仓库 bio/stringtie 目录不存在）"
  note: "2026-09 抓取 https://api.github.com/repos/snakemake/snakemake-wrappers/contents/bio/stringtie 返回 404；
         Snakemake 场景请使用 stringtie_snakemake_local（stringtie.smk，pin bioconda::stringtie=3.0.3）。"

source_reference:
  repository: "https://github.com/snakemake/snakemake-wrappers"
  wrapper_base: "bio/stringtie"
  tag: "v3.13.0"
  submodules: []
  submodules_note: >
    官方 bio/stringtie 目录不存在（2026-09 抓取 404），故 submodules 为空列表。
    若未来官方新增该 wrapper，请以 https://github.com/snakemake/snakemake-wrappers/tree/master/bio/stringtie
    在线目录为准刷新；当前 Snakemake 场景请使用 stringtie_snakemake_local。

inputs:
  input:
    type: file
    format: [bam]
    required: true
    description: "输入 BAM（assemble）或 GTF 列表文件（merge）"

outputs:
  output:
    type: file
    format: [gtf]
    description: "输出转录本 GTF"

params:
  extra:
    type: string
    default: ""
    description: "stringtie 子命令额外参数（如 --conservative -L -R）"

execution:
  mode: snakemake_rule
  wrapper_template: "v3.13.0/bio/stringtie/{subcommand}（官方缺失，占位）"
  rule_example: |
    # 官方 wrapper 缺失 —— 直接使用本仓库自维护 rule：
    #   include: "skills/stringtie/snakemake/local/stringtie.smk"
    rule stringtie_assemble:
        input:  "alignment/{sample}.sorted.bam"
        output: "assembled/{sample}.stringtie.gtf"
        params: gtf="ref/gencode.v49.annotation.gtf", min_transcript_len=200
        threads: 8
        conda: "envs/stringtie.yaml"   # bioconda::stringtie=3.0.3
