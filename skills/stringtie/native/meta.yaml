# stringtie native 自包含实现元数据
# ---------------------------------------------------------------------------
# source_type: custom —— 本地全量自维护，不依赖官方 wrapper 源码。
# 覆盖 assemble（单样本重构）/ merge（多样本合并）/ fix_gtf（坐标修复）三段链路，
# 迁移自 nanoseq 的 run_stringtie.sh。
# ---------------------------------------------------------------------------

id: stringtie_native
version: "3.0.3-v1.0"
software: stringtie
type: native
source_type: custom

summary: "Self-contained StringTie runner，覆盖 assemble / merge / fix_gtf 三段转录本组装链路（迁移自 nanoseq run_stringtie.sh），自动注入线程。"
software_versions:
  stringtie: "3.0.3"
  source: "bioconda::stringtie=3.0.3（micromamba 引导的 /opt/env；environment.yml 已 pin）"
  note: "stringtie 不在 Debian bookworm apt，容器走 bookworm-slim + micromamba + bioconda 路线；与 nf-core 模块 bioconda::stringtie=3.0.3 版本一致。"

agent_guidance:
  when_to_use: "AI Agent Function Calling 或独立 Python/Shell CLI 调用时优先使用本实现。"
  recommendation_priority: "High（非流程引擎场景的主执行目标）"

# ---- 统一输入接口（JSON Schema 导出依据）-------------------------------- #
inputs:
  subcommand:
    type: string
    required: true
    description: "stringtie 子命令：assemble|merge|fix_gtf"
  bam:
    type: file
    required: false
    cli_arg: positional
    description: "输入 BAM（assemble；merge 为 GTF 列表文件）"
  gtf:
    type: file
    required: false
    cli_arg: "-G"
    description: "参考注释 GTF（assemble/merge 使用）"
  output:
    type: file
    required: false
    cli_arg: "-o"
    description: "输出 GTF 路径"
  label:
    type: string
    required: false
    cli_arg: "-l"
    description: "转录本前缀标签（assemble 默认样本名 / merge 默认 MSTRG）"
  min_transcript_len:
    type: integer
    default: 200
    cli_arg: "-m"
    description: "最小转录本长度"
  long_reads:
    type: boolean
    default: true
    cli_arg: "-L"
    description: "长读模式（assemble）"
  rf_stranded:
    type: boolean
    default: true
    cli_arg: "-R"
    description: "RF 链特异性（assemble）"
  conservative:
    type: boolean
    default: true
    cli_arg: "--conservative"
    description: "保守模式：避免合并可能属于不同位点的转录本（assemble）"
  gtf_list:
    type: file
    required: false
    cli_arg: positional
    description: "merge 输入的 GTF 列表文件（每行一个 GTF 路径）"
  threads:
    type: integer
    default: 4
    cli_arg: "-p"
    description: "线程数（自动注入）"
  extra_args:
    type: string
    required: false
    description: "透传给 stringtie 的额外参数（高级用法，慎用）"

outputs:
  assembled_gtf:
    type: file
    format: gtf
    description: "assemble 输出的样本级转录本 GTF"
  merged_gtf:
    type: file
    format: gtf
    description: "merge 输出的非冗余合并 GTF"
  fixed_gtf:
    type: file
    format: gtf
    description: "fix_gtf 输出的坐标修复 GTF（$4<=$5）"

# ---- 本地环境配方与性能优化（custom 模块独有）--------------------------- #
environment:
  conda: "environment.yml"
  dockerfile: "Dockerfile"
  apptainer_def: "Apptainer.def"

optimization:
  default_cpus: 4
  default_mem_mb: 8192
  tmpdir: "/tmp"
  env_vars:
    TMPDIR: "{tmpdir}"
    PYTHONUNBUFFERED: "1"
  # 子命令级线程建议（高于用户显式 --threads 时仍以用户为准）
  per_subcommand_threads:
    assemble: 8        # 转录本重构为 CPU 密集，优先多线程
    merge: 4
    fix_gtf: 2
    default: 4

execution:
  entrypoint: "python main.py"
  test_command: "bash test/run_test.sh"
  binary: "stringtie"
