# gstama / snakemake / local —— 自维护 Snakemake rule
# ---------------------------------------------------------------------------
# 从 snakemake.smk/isoseq.smk/workflow/rules/gstama.smk 迁移，
# 去掉对 workflow/lib/helpers.py 与 docker_run 的全局依赖，路径/参数内联简化。
# ---------------------------------------------------------------------------

id: gstama_snakemake_local
version: "1.0.0"
software: gstama
type: snakemake_local
source_type: custom

summary: "Custom Snakemake rules for gstama（polyacleanup/collapse/filelist/merge 四条，从 isoseq.smk 迁移，自包含无 helper 依赖）。"

agent_guidance:
  when_to_use: "官方 bio/gstama 不存在（snakemake-wrappers 404），Snakemake 场景使用本目录迁移规则。"
  recommendation_priority: "Low（snakemake-wrappers 不可用；native 优先）。"
  enabled: true

software_versions:
  gstama: "1.0.3（流程原配）"
  source: "从 snakemake.smk/isoseq.smk（quay.io/biocontainers/gs-tama:1.0.3--hdfd78af_0）迁移"
  note: "rule 未固定 conda/container 时，由执行环境提供 tama_*.py（bioconda gs-tama=1.0.3）+ samtools（collapse 用）。"

inputs:
  fasta:
    type: file
    format: [fasta, fa]
    required: false
    description: "polyacleanup 的输入 FLNC FASTA / collapse 的参考 FASTA"
  bam:
    type: file
    format: [bam]
    required: false
    description: "collapse 的输入比对 BAM"
  filelist:
    type: file
    format: [tsv]
    required: false
    description: "merge 的输入 filelist TSV"

outputs:
  cleaned_fasta:
    type: file
    format: fasta.gz
    description: "polyacleanup 输出（<prefix>_gstama.fa.gz）"
  collapsed_bed:
    type: file
    format: bed
    description: "collapse 输出的去冗余转录本（*_collapsed.bed）"
  filelist_tsv:
    type: file
    format: tsv
    description: "filelist 输出的 TSV"
  merged_bed:
    type: file
    format: bed
    description: "merge 输出的合并转录本注释"

execution:
  mode: snakemake_rule
  rule_files:
    - "gstama_polyacleanup.smk"
    - "gstama_collapse.smk"
    - "gstama_filelist.smk"
    - "gstama_merge.smk"
  wrapper_template: ""
  rule_example: |
    include: "skills/gstama/snakemake/local/gstama_polyacleanup.smk"
    include: "skills/gstama/snakemake/local/gstama_collapse.smk"
    include: "skills/gstama/snakemake/local/gstama_filelist.smk"
    include: "skills/gstama/snakemake/local/gstama_merge.smk"
    rule all:
        input: "results/gstama_merge/merged.bed"
