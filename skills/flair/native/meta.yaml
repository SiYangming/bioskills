# flair native 自包含实现元数据
# ---------------------------------------------------------------------------
# source_type: custom —— 本地全量自维护，不依赖官方 wrapper 源码。
# flair conda 包提供三个可执行：flair（collapse 主命令）/ bam2Bed12 / identify_gene_isoform，
# 本实现把 nanoseq 的 run_flair_consensus.sh 三段链路（BAM→Bed12→注释→collapse）拆为三个子命令。
# ---------------------------------------------------------------------------

id: flair_native
version: "3.0.0b1-v1.0"
software: flair
type: native
source_type: custom

summary: "Self-contained FLAIR runner，覆盖 bam2bed12 / annotate / collapse 三段 isoform 分析链路（迁移自 nanoseq run_flair_consensus.sh），自动注入线程。"
software_versions:
  flair: "3.0.0b1"
  source: "bioconda::flair=3.0.0b1（micromamba 引导的 /opt/env；environment.yml 已 pin）"
  note: "flair 不在 Debian bookworm apt，容器走 bookworm-slim + micromamba + bioconda 路线；
         包内三个可执行 flair/bam2Bed12/identify_gene_isoform 均可用；collapse 依赖 minimap2（env 一并 pin）。"

agent_guidance:
  when_to_use: "AI Agent Function Calling 或独立 Python/Shell CLI 调用时优先使用本实现。"
  recommendation_priority: "High（非流程引擎场景的主执行目标）"

# ---- 统一输入接口（JSON Schema 导出依据）-------------------------------- #
inputs:
  subcommand:
    type: string
    required: true
    description: "flair 子命令：bam2bed12|annotate|collapse"
  input:
    type: file
    required: false
    cli_arg: positional
    description: "主输入文件（bam2bed12 的 sorted BAM / annotate 的 bed12 / collapse 的 annotated bed）"
  output:
    type: file
    required: false
    cli_arg: positional
    description: "输出文件（annotate 的 annotated bed；collapse 的输出前缀 prefix）"
  gtf:
    type: file
    required: false
    cli_arg: "-f"
    description: "参考注释 GTF（annotate/collapse 使用）"
  genome:
    type: file
    required: false
    cli_arg: "-g"
    description: "参考基因组 FASTA（collapse 使用）"
  reads:
    type: file
    required: false
    cli_arg: "-r"
    description: "原始 reads FASTQ/FASTA（collapse 使用）"
  prefix:
    type: string
    required: false
    description: "collapse 输出前缀（默认 <sample>，生成 <prefix>.flair.collapse.fasta 等）"
  min_support:
    type: integer
    default: 3
    cli_arg: "-s"
    description: "最小 read 支持数（collapse）"
  end_window:
    type: integer
    default: 100
    cli_arg: "-w"
    description: "3'/5' 端窗口大小（collapse）"
  intpriming_threshold:
    type: integer
    default: 30
    cli_arg: "--intprimingthreshold"
    description: "内部加尾修剪阈值（collapse，配合 --remove_internal_priming）"
  trust_ends:
    type: boolean
    default: true
    cli_arg: "--trust_ends"
    description: "信任 read 末端（collapse）"
  remove_internal_priming:
    type: boolean
    default: true
    cli_arg: "--remove_internal_priming"
    description: "去除内部加尾（collapse）"
  stringent:
    type: boolean
    default: true
    cli_arg: "--stringent"
    description: "严格模式（collapse）"
  check_splice:
    type: boolean
    default: true
    cli_arg: "--check_splice"
    description: "检查剪接位点（collapse）"
  mm2_args:
    type: string
    default: "-I8g,--MD"
    cli_arg: "--mm2_args"
    description: "minimap2 参数（collapse，逗号分隔无空格）"
  quiet:
    type: boolean
    default: true
    cli_arg: "--quiet"
    description: "安静模式（collapse）"
  threads:
    type: integer
    default: 4
    cli_arg: "-t"
    description: "线程数（自动注入）"
  extra_args:
    type: string
    required: false
    description: "透传给 flair 子命令的额外参数（高级用法，慎用）"

outputs:
  bed12:
    type: file
    format: bed12
    description: "bam2bed12 产生的 BED12 文件"
  annotated_bed:
    type: file
    format: bed
    description: "annotate 产生的带基因注释 BED 文件"
  collapse_fasta:
    type: file
    format: fasta
    description: "collapse 产生的一致性转录本 FASTA（<prefix>.flair.collapse.fasta）"
  counts:
    type: file
    format: txt
    description: "collapse 产生的 isoform 计数文件"

# ---- 本地环境配方与性能优化（custom 模块独有）--------------------------- #
environment:
  conda: "environment.yml"
  dockerfile: "Dockerfile"
  apptainer_def: "Apptainer.def"

optimization:
  default_cpus: 4
  default_mem_mb: 8192
  tmpdir: "/tmp"
  env_vars:
    TMPDIR: "{tmpdir}"
    PYTHONUNBUFFERED: "1"
  # 子命令级线程建议（高于用户显式 --threads 时仍以用户为准）
  per_subcommand_threads:
    collapse: 8        # collapse 聚类+minimap2 为 CPU 密集，优先多线程
    bam2bed12: 4
    annotate: 4
    default: 4

execution:
  entrypoint: "python main.py"
  test_command: "bash test/run_test.sh"
  binary: "flair"
