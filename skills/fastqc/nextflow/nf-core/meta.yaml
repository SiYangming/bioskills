# fastqc nf-core/modules 官方实现说明 + 本地 Schema 副本
# ---------------------------------------------------------------------------
# source_type: official —— 仅保留说明、Schema + 引用；真正执行需在项目内安装官方模块。
# 本目录不重写 nf-core 源码；统一挂载在 skills 供 Agent 路由。
# ---------------------------------------------------------------------------

id: fastqc_nextflow_nfcore
version: "2.1.0"
software: fastqc
type: nextflow_nfcore
source_type: official

summary: "nf-core/modules 官方 fastqc 模块（单 process：FASTQ → html/zip 报告）."

agent_guidance:
  when_to_use: "Nextflow 流程中需要标准 FASTQ QC 时优先使用；缺失或要自定义 -k/-c 等参数时降级 fastqc_nextflow_local / fastqc_native。"
  recommendation_priority: "Medium（Nextflow 流程引擎场景；CLI/Agent 直调请走 native）。"
  setup: |
    在项目仓库根执行：
      nf modules install nf-core fastqc
    本目录仅提供 include 参考与统一 Schema，不重写官方源码。

# 版本对齐：本实现 meta.version 记录 nf-core/modules fastqc 家族版本；
# fastqc 上游二进制版本以 environment.yml 中 bioconda pin 为准。
software_versions:
  module_version: "2.1.0"
  fastqc: "0.12.1"
  source: "bioconda::fastqc=0.12.1（modules/nf-core/fastqc/environment.yml）"
  note: "上游 nf-core 仍停在 fastqc=0.12.1；若未来 bioconda 推 0.12.2/0.13，需刷新 modules/nf-core/fastqc/environment.yml 并同步本文件。"

source_reference:
  repository: "https://github.com/nf-core/modules"
  modules_base: "modules/nf-core/fastqc"
  submodules:
    # fastqc 是单模块；此处保留 1 条 “fastqc” 作为统一 submodules 字段以兼容扫描/文档。
    - "fastqc"
  submodules_note: >
    参考目录 https://github.com/nf-core/modules/tree/master/modules/nf-core/fastqc。
    nf-core fastqc 仅提供单个 process，不分子命令。若 nf-core 未来出现 fastqc 子命令拆分（例如 split / kmer 子模块），以官方在线目录为准刷新本列表。

inputs:
  - name: meta
    type: map
    description: "Groovy map with sample id, read group info etc."
  - name: reads
    type: file/list(file)
    required: true
    description: "Input FASTQ file(s) (single or paired end)"

outputs:
  - name: meta
    type: map
  - name: html
    type: file
    pattern: "*fastqc.html"
    description: "FastQC HTML report"
  - name: zip
    type: file
    pattern: "*fastqc.zip"
    description: "FastQC zip archive"
  - name: versions
    type: file
    pattern: "versions.yml"
    description: "nf-core 标准版本文件"

execution:
  mode: nextflow_include
  include_ref: |
    include { FASTQC } from './modules/nf-core/fastqc/main addParams( options: [:] )'
  invoke_ref: |
    FASTQC ( [ meta, reads ] )
  entrypoint: "nextflow_include"
  include_statement: "include { FASTQC } from './modules/nf-core/fastqc/main'"
  include_pattern: "include { FASTQC } from './modules/nf-core/fastqc/main'"
  container: "community.wave.seqera.io/library/fastqc:0.12.1--e83f43ef67f90b0a"
  setup_hint: |
    项目内安装：
      nf modules install nf-core fastqc
    缺失参数/特殊子命令时：复制 skills/fastqc/nextflow/local/ 到项目的 modules/local/fastqc/ 并启用。

optimization:
  default_cpus: 4
  default_mem_mb: 8192
  time_min: 60
