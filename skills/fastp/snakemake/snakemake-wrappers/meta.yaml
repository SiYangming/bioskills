# fastp / snakemake / snakemake-wrappers 说明模块
# ---------------------------------------------------------------------------
# source_type: official —— 仅保留说明、桥接脚本与接口 Schema，不重写源码。
# 官方 snakemake-wrappers 的 bio/fastp 存在（单 wrapper，无子目录）。
# ---------------------------------------------------------------------------

id: fastp_snakemake_wrappers
version: "v3.13.0"
software: fastp
type: snakemake_wrappers
source_type: official

summary: "Official Snakemake Wrappers 登记层 for fastp（bio/fastp 单 wrapper，无子目录）。"

agent_guidance:
  when_to_use: "组装 Snakemake 流程、复用中央 wrapper 缓存时，使用 wrapper: \"v3.13.0/bio/fastp\" 句柄。"
  recommendation_priority: "Medium（Snakemake 流程引擎场景；CLI/Agent 直调请走 native）。"

# 版本对齐：官方 bio/fastp/environment.yaml 的 conda pin。
software_versions:
  wrapper_tag: "v3.13.0"
  fastp: "1.3.6"
  source: "bioconda fastp=1.3.6（bio/fastp/environment.yaml；无 snakemake-wrapper-utils 依赖）"
  note: "2026-09-01 抓取 bio/fastp/environment.yaml pin fastp=1.3.6，与 nf-core 一致（比 native 0.24.0 新）；切 wrapper tag 后务必核对。"

source_reference:
  repository: "https://github.com/snakemake/snakemake-wrappers"
  wrapper_base: "bio/fastp"
  tag: "v3.13.0"
  submodules:
    - "fastp"
  submodules_note: >
    2026-09-01 抓取 https://api.github.com/repos/snakemake/snakemake-wrappers/contents/bio/fastp
    得到：environment.linux-64.pin.txt / environment.yaml / meta.yaml / test / wrapper.py
    （无子目录，wrapper 本体即 fastp）。
    列表以官方在线目录为准，更新时重新抓取并刷新本字段。

inputs:
  reads:
    type: file
    format: [fastq.gz, fastq]
    required: true
    description: "输入 reads（SE 单文件；PE 为列表 [R1, R2]）"

outputs:
  reads:
    type: file
    format: [fastq.gz, fastq]
    description: "清洗后 reads（SE 或 [R1, R2]）"
  html:
    type: file
    format: html
    description: "fastp HTML 质控报告"
  json:
    type: file
    format: json
    description: "fastp JSON 质控报告"

params:
  extra:
    type: string
    default: ""
    description: "fastp 额外参数（如 --detect_adapter_for_pe --qualified_quality_phred 20）"

execution:
  mode: snakemake_rule
  wrapper_template: "v3.13.0/bio/fastp"
  rule_example: |
    rule fastp:
        input:
            reads=["reads/{sample}_R1.fastq.gz", "reads/{sample}_R2.fastq.gz"]
        output:
            reads=["results/{sample}_R1.clean.fastq.gz", "results/{sample}_R2.clean.fastq.gz"],
            html="results/{sample}_fastp.html",
            json="results/{sample}_fastp.json"
        params:
            extra="--detect_adapter_for_pe"
        threads: 8
        wrapper:
            "v3.13.0/bio/fastp"
