# pbccs / snakemake / snakemake-wrappers 说明模块
# ---------------------------------------------------------------------------
# source_type: official —— 仅保留说明、桥接脚本与接口 Schema，不重写源码。
# 注意：官方 snakemake-wrappers 目前【没有】bio/pbccs wrapper（抓取 404），
#       本目录仅登记桥接层；实际执行请使用 pbccs_snakemake_local（pbccs.smk）。
# ---------------------------------------------------------------------------

id: pbccs_snakemake_wrappers
version: "v3.13.0"
software: pbccs
type: snakemake_wrappers
source_type: official

summary: "Official Snakemake Wrappers 登记层 for pbccs（官方 bio/pbccs 缺失，submodules 为空；实际走 local）。"

agent_guidance:
  when_to_use: "组装 Snakemake 流程时；官方 bio/pbccs wrapper 缺失，请直接使用 pbccs_snakemake_local。"
  recommendation_priority: "Low（官方 wrapper 不存在；本实现仅说明层，实际路由到 snakemake_local）。"

# 版本对齐：官方 bio/pbccs 不存在，无法从 environment.yaml 取 conda pin。
software_versions:
  wrapper_tag: "v3.13.0"
  pbccs: "官方无 wrapper（bio/pbccs 404）"
  source: "—（snakemake-wrappers 仓库 bio/pbccs 目录不存在）"
  note: "2026-08 抓取 https://api.github.com/repos/snakemake/snakemake-wrappers/contents/bio/pbccs 返回 404；
         Snakemake 场景请使用 pbccs_snakemake_local（pbccs.smk，pin bioconda::pbccs=6.4.0）。"

source_reference:
  repository: "https://github.com/snakemake/snakemake-wrappers"
  wrapper_base: "bio/pbccs"
  tag: "v3.13.0"
  submodules: []
  submodules_note: >
    官方 bio/pbccs 目录不存在（2026-08 抓取 404），故 submodules 为空列表。
    若未来官方新增该 wrapper，请以 https://github.com/snakemake/snakemake-wrappers/tree/master/bio/pbccs
    在线目录为准刷新；当前 Snakemake 场景请使用 pbccs_snakemake_local。

inputs:
  input:
    type: file
    format: [bam]
    required: true
    description: "输入 subreads BAM"

outputs:
  output:
    type: file
    format: [bam]
    description: "输出 HiFi/CCS BAM"

params:
  extra:
    type: string
    default: ""
    description: "ccs 子命令额外参数（如 --min-rq 0.95 --min-passes 5）"

execution:
  mode: snakemake_rule
  wrapper_template: "v3.13.0/bio/pbccs/{subcommand}（官方缺失，占位）"
  rule_example: |
    # 官方 wrapper 缺失 —— 直接使用本仓库自维护 rule：
    #   include: "skills/pbccs/snakemake/local/pbccs.smk"
    rule pbccs:
        input:  "subreads/{sample}.subreads.bam"
        output: "ccs/{sample}.chunk{n}.bam"
        params: chunk_num=1, chunk_total=4, min_rq=0.9, min_passes=3
        threads: 8
        conda: "envs/pbccs.yaml"   # bioconda::pbccs=6.4.0
