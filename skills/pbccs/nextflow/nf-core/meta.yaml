# pbccs / nextflow / nf-core 说明模块
# ---------------------------------------------------------------------------
# source_type: official —— 仅保留说明、接口 Schema 与引用，不重写源码。
# 本目录为说明 + Schema；真正执行需在项目内安装官方 nf-core 子模块。
# ---------------------------------------------------------------------------

id: pbccs_nextflow_nfcore
version: "1.0.0"
software: pbccs
type: nextflow_nfcore
source_type: official

summary: "Official nf-core process for pbccs (modules/nf-core/pbccs 单模块：subreads BAM -> HiFi BAM)."

agent_guidance:
  when_to_use: "组装 Nextflow DSL2 流程、目标为 HPC/Cloud 时，直接 include 对应子模块。"
  recommendation_priority: "Medium（Nextflow 流程引擎场景使用；CLI/Agent 直调请走 native）。"

# 版本对齐：本实现 meta.version 记录 nf-core/modules pbccs 家族版本；
# pbccs 上游二进制版本以子模块 environment.yml 中的 conda pin 为准。
software_versions:
  module_version: "1.0.0"
  pbccs: "6.4.0"
  source: "bioconda::pbccs=6.4.0（modules/nf-core/pbccs/environment.yml）"
  note: "nf-core pbccs 为单模块（不分子命令），environment.yml pin 为 bioconda::pbccs=6.4.0；
         container 由 community.wave.seqera.io 按该 env 生成；bump 模块后请同步刷新本文件。"

source_reference:
  repository: "https://github.com/nf-core/modules"
  modules_base: "modules/nf-core/pbccs"
  submodules:
    - "pbccs"
  submodules_note: >
    nf-core pbccs 是单模块（目录下仅 environment.yml / main.nf / meta.yml / tests，无子目录），
    此处保留 1 条 "pbccs" 作为统一 submodules 字段以兼容扫描/文档。
    列表以 https://github.com/nf-core/modules/tree/master/modules/nf-core/pbccs 在线目录为准。

inputs:
  meta:
    type: map
    description: "Groovy 样本元信息，如 [ id:'sample1' ]"
  bam:
    type: file
    format: bam
    required: true
    description: "Raw subreads bam（*.subreads.bam）"
  pbi:
    type: file
    format: pbi
    required: false
    description: "PacBio BAM Index（*.pbi）"
  chunk_num:
    type: integer
    required: false
    description: "BAM part to process（当前分块编号）"
  chunk_on:
    type: integer
    required: false
    description: "Total number of bam parts to process（总分块数）"

outputs:
  bam:
    type: file
    format: bam
    description: "CCS sequences in bam format"
  pbi:
    type: file
    format: pbi
    description: "PacBio Index of CCS sequences"
  report_txt:
    type: file
    format: txt
    description: "Summary of CCS in txt format"
  report_json:
    type: file
    format: json
    description: "Summary of CCS in json format"
  metrics:
    type: file
    format: json.gz
    description: "Metrics about zmws"
  versions:
    type: file
    pattern: "versions.yml"
    description: "nf-core 标准版本文件"

execution:
  mode: nextflow_include
  include_statement: "include { PBCCS } from './modules/nf-core/pbccs/main'"
  include_pattern: "include { PBCCS } from './modules/nf-core/pbccs/main'"
  container: "community.wave.seqera.io/library/pbccs:6.4.0--h9ee0642_0"
  setup_hint: |
    在项目仓库根执行：
      nf modules install nf-core pbccs
    本目录仅提供 include 参考与统一 Schema，不重写官方源码；
    若官方缺失 / 需定制，请使用 ../local/。
