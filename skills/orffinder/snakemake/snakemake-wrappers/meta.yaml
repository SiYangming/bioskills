# orffinder / snakemake / snakemake-wrappers 说明模块
# ---------------------------------------------------------------------------
# source_type: official —— 仅保留说明、桥接脚本与接口 Schema，不重写源码。
# 注意：官方 snakemake-wrappers 目前【没有】bio/orffinder wrapper（抓取 404），
#       本目录仅登记桥接层；实际执行请使用 orffinder_snakemake_local（orffinder.smk）。
# ---------------------------------------------------------------------------

id: orffinder_snakemake_wrappers
version: "v3.13.0"
software: orffinder
type: snakemake_wrappers
source_type: official

summary: "Official Snakemake Wrappers 登记层 for orffinder（官方 bio/orffinder 缺失，submodules 为空；实际走 local）。"

agent_guidance:
  when_to_use: "组装 Snakemake 流程时；官方 bio/orffinder wrapper 缺失，请直接使用 orffinder_snakemake_local。"
  recommendation_priority: "Low（官方 wrapper 不存在；本实现仅说明层，实际路由到 snakemake_local）。"

# 版本对齐：官方 bio/orffinder 不存在，无法从 environment.yaml 取 conda pin。
software_versions:
  wrapper_tag: "v3.13.0"
  orffinder: "官方无 wrapper（bio/orffinder 404）"
  source: "—（snakemake-wrappers 仓库 bio/orffinder 目录不存在）"
  note: "2026-09-01 抓取 https://api.github.com/repos/snakemake/snakemake-wrappers/contents/bio/orffinder 返回 404；
         Snakemake 场景请使用 orffinder_snakemake_local（orffinder.smk，pin orffinder=0.4.3）。"

source_reference:
  repository: "https://github.com/snakemake/snakemake-wrappers"
  wrapper_base: "bio/orffinder"
  tag: "v3.13.0"
  submodules: []
  submodules_note: >
    官方 bio/orffinder 目录不存在（2026-09-01 抓取 404），故 submodules 为空列表。
    若未来官方新增该 wrapper，请以 https://github.com/snakemake/snakemake-wrappers/tree/master/bio/orffinder
    在线目录为准刷新；当前 Snakemake 场景请使用 orffinder_snakemake_local。

inputs:
  input:
    type: file
    format: fasta
    required: true
    description: "输入核酸 FASTA"

outputs:
  output:
    type: file
    format: [fa, asn1, ft]
    description: "ORF 预测结果（后缀依 outfmt 而定）"

params:
  extra:
    type: string
    default: ""
    description: "ORFfinder 额外参数（如 -s 2 -ml 30）"

execution:
  mode: snakemake_rule
  wrapper_template: "v3.13.0/bio/orffinder/{subcommand}（官方缺失，占位）"
  rule_example: |
    # 官方 wrapper 缺失 —— 直接使用本仓库自维护 rule：
    #   include: "skills/orffinder/snakemake/local/orffinder.smk"
    rule orffinder:
        input:
            "long_read/{sample}.fasta"
        output:
            "orffinder/{sample}.asn1"    # outfmt=2 默认后缀
        params:
            outfmt=2, extra="-s 2 -ml 30"
        conda: "envs/orffinder.yaml"     # orffinder=0.4.3
