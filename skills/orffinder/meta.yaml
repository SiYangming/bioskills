# orffinder 软件级总览元数据
# ---------------------------------------------------------------------------
# 汇总本软件在技能库中的所有可用实现类型与推荐优先级。
# 上层 Agent 通过本文件快速判断：该软件是否已收录、应优先走哪条实现路径。
# 实现路径结构：
#   skills/<software>/
#   ├── native/
#   ├── nextflow/nf-core/    # 官方 nf-core/modules（source_type: official）
#   │       local/            # 自定义 Nextflow 模块（source_type: custom）
#   └── snakemake/snakemake-wrappers/  # 官方 snakemake-wrappers（official）
#           local/              # 自定义 Snakemake 实现（source_type: custom）
# 命令逻辑迁移自 snakemake.smk/flrnaseq.smk/workflow/scripts/orffinder.py
# 与 workflow/rules/orffinder.smk、envs/orffinder.yaml、config/config.yaml 的 orffinder 段。
# ---------------------------------------------------------------------------

software: orffinder
canonical: orffinder
category: orf_prediction
description: >
  ORFfinder 是 NCBI 的开放阅读框（ORF）查找工具（本地版），在核酸序列中搜索所有
  开放阅读框并给出蛋白翻译；支持遗传密码表（-g 1-31）、起始密码子策略（-s 0/1/2）、
  最小 ORF 长度（-ml）与链方向（-strand），输出 FASTA / CDS / Text ASN.1 / Feature table。

homepage: https://www.ncbi.nlm.nih.gov/orffinder/
license: "Public Domain（NCBI / U.S. Government Work；二进制来自 NCBI FTP）"

# 各实现支持的 orffinder 版本可能不同 —— 上游官方仓库的升级节奏通常快于 native 的锁定版本。
# 版本差异在各实现的 meta.yaml 中同步记录；此处汇总便于做跨实现兼容性判断。
software_versions:
  - id: orffinder_native
    orffinder: "0.4.3"
    note: "CONDA 路线：debian:bookworm-slim + apt 运行时 + micromamba 引导 bioconda env（orffinder=0.4.3，quay.io/preskaa/orffinder:0.4.3 同版本）；二进制 ORFfinder 来自 NCBI。"
  - id: orffinder_nextflow_nfcore
    module_version: "官方无模块（modules/nf-core/orffinder 404）"
    orffinder: "—"
    source: "—（nf-core/modules 仓库 modules/nf-core/orffinder 目录不存在）"
    note: "2026-09-01 抓取 https://api.github.com/repos/nf-core/modules/contents/modules/nf-core/orffinder 返回 404；Nextflow 场景请使用 orffinder_nextflow_local。"
  - id: orffinder_snakemake_wrappers
    wrapper_tag: "v3.13.0"
    orffinder: "官方无 wrapper（bio/orffinder 404）"
    source: "—（snakemake-wrappers 仓库 bio/orffinder 目录不存在）"
    note: "2026-09-01 抓取 https://api.github.com/repos/snakemake/snakemake-wrappers/contents/bio/orffinder 返回 404；Snakemake 场景请使用 orffinder_snakemake_local。"
  - id: orffinder_nextflow_local
    orffinder: "未固定（用户按 main.nf 中 conda/container 自行声明）"
  - id: orffinder_snakemake_local
    orffinder: "0.4.3（建议；规则迁移自 flrnaseq.smk/workflow/rules/orffinder.smk，conda 指向 orffinder=0.4.3）"

# 可用实现清单（按推荐优先级排序）
implementations:
  - id: orffinder_native
    path: native
    source_type: custom
    type: native
    version: "0.4.3-v1.0"
    priority: high
    when_to_use: >
      非流程引擎场景（AI Agent Function Calling / 独立 CLI / Shell 调用）的首选目标。

  - id: orffinder_nextflow_nfcore
    path: nextflow/nf-core
    source_type: official
    type: nextflow_nfcore
    version: "master"
    priority: medium
    when_to_use: 组装 Nextflow DSL2 流程、目标为 HPC/Cloud 时。
    note: "官方 nf-core/modules 暂无 modules/nf-core/orffinder（2026-09-01 抓取 404），本实现仅登记说明层，实际请降级 orffinder_nextflow_local。"

  - id: orffinder_nextflow_local
    path: nextflow/local
    source_type: custom
    type: nextflow_local
    version: ""
    priority: low
    when_to_use: nf-core 子模块缺失（当前正是如此），需要本地定制 Nextflow process。

  - id: orffinder_snakemake_wrappers
    path: snakemake/snakemake-wrappers
    source_type: official
    type: snakemake_wrappers
    version: "v3.13.0"
    priority: medium
    when_to_use: 组装 Snakemake 流程、复用中央 wrapper 缓存时。
    note: "官方 snakemake-wrappers 暂无 bio/orffinder wrapper（2026-09-01 抓取 404），本实现仅登记桥接层，实际请降级 orffinder_snakemake_local。"

  - id: orffinder_snakemake_local
    path: snakemake/local
    source_type: custom
    type: snakemake_local
    version: "0.1.0"
    priority: low
    when_to_use: snakemake-wrappers 缺失（当前正是如此），使用自维护 orffinder.smk（迁移自 flrnaseq.smk 的真实规则）。

# 默认推荐路径（Agent 路由用）
default_implementation: orffinder_native
