# orffinder native 自包含实现元数据
# ---------------------------------------------------------------------------
# source_type: custom —— 本地全量自维护，不依赖官方 wrapper 源码。
# 二进制：ORFfinder（NCBI，conda 包 orffinder=0.4.3 / quay.io/preskaa/orffinder:0.4.3）。
# 命令逻辑迁移自 snakemake.smk/flrnaseq.smk/workflow/scripts/orffinder.py
# （-in <fasta> -out <file> -outfmt <int> + extra）。
# ---------------------------------------------------------------------------

id: orffinder_native
version: "0.4.3-v1.0"
software: orffinder
type: native
source_type: custom

summary: "Self-contained ORFfinder runner（NCBI ORF 查找），覆盖 -g/-s/-ml/-strand/-outfmt 参数，自动处理 .gz 输入与临时目录。"

agent_guidance:
  when_to_use: "AI Agent Function Calling 或独立 Python/Shell CLI 调用时优先使用本实现。"
  recommendation_priority: "High（非流程引擎场景的主执行目标）"

# 本实现实际运行的上游二进制版本 + 构建来源
software_versions:
  orffinder: "0.4.3"
  binary: "ORFfinder"
  source: "bioconda orffinder=0.4.3（micromamba 引导的 /opt/env；同 flrnaseq envs/orffinder.yaml 与 quay.io/preskaa/orffinder:0.4.3）"
  note: "orffinder 不在 Debian bookworm apt，容器走 bookworm-slim + micromamba + bioconda 路线；二进制 ORFfinder 来自 NCBI（conda 包由社区打包）。"

# ---- 统一输入接口（JSON Schema 导出依据）-------------------------------- #
inputs:
  subcommand:
    type: string
    required: true
    description: "orffinder 子命令：run（唯一核心命令）"
  input:
    type: file
    required: true
    cli_arg: "-in"
    description: "输入核酸 FASTA（支持 .gz 时由驱动自动解压到 tmpdir）"
  output:
    type: file
    required: false
    cli_arg: "-out"
    description: "输出文件（默认 <input_stem><suffix>，suffix 依 outfmt 而定）"
  outfmt:
    type: integer
    default: 2
    cli_arg: "-outfmt"
    description: "输出格式：0=ORFs FASTA, 1=CDS FASTA, 2=Text ASN.1, 3=Feature table（flrnaseq 默认 2）"
  genetic_code:
    type: integer
    required: false
    cli_arg: "-g"
    description: "遗传密码（1-31，NCBI 代码编号）"
  start_codon:
    type: integer
    required: false
    cli_arg: "-s"
    description: "起始密码子策略：0=仅 ATG, 1=ATG 与替代起始, 2=任意有义密码子（flrnaseq 默认 -s 2）"
  min_length:
    type: integer
    required: false
    cli_arg: "-ml"
    description: "最小 ORF 长度（nt；flrnaseq 默认 -ml 30）"
  strand:
    type: string
    required: false
    cli_arg: "-strand"
    description: "链方向：both | plus | minus"
  ignore_nested:
    type: boolean
    default: false
    cli_arg: "-n"
    description: "忽略完全嵌套在更大 ORF 内的 ORF（true/false）"
  extra_args:
    type: string
    required: false
    description: "透传给 ORFfinder 的额外参数（高级用法，慎用）"

outputs:
  result:
    type: file
    format: [fa, asn1, ft]
    description: "ORF 预测结果（后缀依 outfmt：0=_orf.fa, 1=_cds.fa, 2=.asn1, 3=.ft）"

# ---- 本地环境配方与性能优化（custom 模块独有）--------------------------- #
environment:
  conda: "environment.yml"
  dockerfile: "Dockerfile"
  apptainer_def: "Apptainer.def"

optimization:
  default_cpus: 4
  default_mem_mb: 4096
  tmpdir: "/tmp"
  env_vars:
    TMPDIR: "{tmpdir}"
    PYTHONUNBUFFERED: "1"
  per_subcommand_threads:
    run: 4        # ORFfinder 单线程；线程数仅作调度参考
    default: 4

execution:
  entrypoint: "python main.py"
  test_command: "bash test/run_test.sh"
  binary: "ORFfinder"
