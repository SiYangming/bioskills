# orffinder / nextflow / local 占位 meta.yaml
# ---------------------------------------------------------------------------
# 当需要自维护的 Nextflow process（nf-core 缺失或定制场景）时：
#   1) 把 id/version/source_reference/inputs/outputs 补全
#   2) 在同级目录编写 <PROCESS>.nf 文件
# 注意：官方 nf-core 无 orffinder 模块（404），本目录是 Nextflow 场景的落点。
