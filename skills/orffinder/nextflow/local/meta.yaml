id: orffinder_nextflow_local
version: "0.0.0-placeholder"
software: orffinder
type: nextflow_local
source_type: custom

summary: "Placeholder for custom orffinder Nextflow modules (populate when needed; nf-core 官方缺失，Nextflow 场景主路径)."

agent_guidance:
  when_to_use: "nf-core 子模块缺失（当前正是如此），需要本地定制 ORFfinder process 时使用。"
  recommendation_priority: "Low→Medium（官方缺失时 Nextflow 场景的落点）。"
  enabled: false  # 占位：未补 main.nf / inputs/outputs 前，Agent 不得路由到此实现。

software_versions:
  status: placeholder
  note: "本地 Nextflow 自维护模块尚未填充版本信息；实际启用时建议显式 pin orffinder=0.4.3（quay.io/preskaa/orffinder:0.4.3）或继承 native 容器。"

inputs: {}
outputs: {}
execution:
  mode: nextflow_include
  include_statement: ""
