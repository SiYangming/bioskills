orfanage_dir: "{output_dir}/02_ORFANAGE"

orfanage:
  version: "1.2.0"
  docker_image: "quay.io/biocontainers/orfanage:1.2.0--heaafb18_2"
  orfanage_bin: "orfanage"
  #### Parameters for ORFanage
  # Use extra_params to provide combined flags or override defaults
  # --query STRING            Path to GTF query file with transcripts to which CDSs are to be ported
  # --output STRING           Basename for all output files generated by this software
  # --reference STRING        Path to reference genome FASTA; required when using cleanq, cleant, rescue
  # --cleanq                  Ensure all transcripts have valid start and stop codons; requires --reference
  # --cleant                  Ensure ORFs in reference annotations start with valid start codon and end with first stop; requires --reference
  # --rescue                  Attempt rescuing broken ORFs in reference annotations; requires --reference
  # --lpi INT                 Percent identity by length between original and reference transcripts; -1 disables
  # --ilpi INT                Percent identity by length of bases in frame of the reference transcript; -1 disables
  # --mlpi INT                Percent identity by length of bases in both query and reference; -1 disables
  # --minlen INT              Minimum ORF length to consider
  # --mode STRING             Which CDS to report: ALL, LONGEST, LONGEST_MATCH, BEST, START_MATCH
  # --stats STRING            Output a separate stats file for each query/template pair
  # --threads INT             Number of threads to run in parallel
  # --use_id                  Only bundle transcripts that share the same gene_id
  # --non_aug                 Allow non-AUG start codons in reference and query overlap
  # --keep_all_cds            Keep any CDS already present in query; mutually exclusive with --keep_cds_if_not_found
  # --keep_cds_if_not_found   Search new ORFs; if none found, keep original CDS; mutually exclusive with --keep_all_cds
  # --overhang INT            Evaluate up/downstream sequence up to N bases
  # --spliced_overhang        Extend sequence up to --overhang but stop at splice donor/acceptor
  extra_params: ""

containers:
  orfanage: "docker://{orfanage[docker_image]}"
