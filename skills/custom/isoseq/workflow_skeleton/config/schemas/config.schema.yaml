# custom/isoseq — config schema（重建版）
# ---------------------------------------------------------------------------
# 从 snakemake.smk/isoseq.smk/config/schemas/config.schema.yaml 重建。
# 原文件随 isoseq.smk 一并删除，本版按恢复的 config.yaml 结构重新编写，
# 供 Snakemake validate 使用：
#   validate(config, schema="config/schemas/config.schema.yaml")
# ---------------------------------------------------------------------------
$schema: "https://json-schema.org/draft-07/schema"
description: "custom/isoseq Snakemake 流程配置 schema"

properties:
  samplesheet:
    type: string
    description: "样本表路径（CSV/TSV）"
  exec_mode:
    type: string
    enum: [native, conda, docker]
    default: native
    description: "执行模式（迁移后规则仅支持本地二进制直调，docker 为参考）"

  pbccs:
    type: object
    properties:
      min_rq:        { type: number,  default: 0.9 }
      min_passes:    { type: integer, default: 3 }
      min_snr:       { type: number,  default: 2.5 }
      min_length:    { type: integer, default: 10 }
      max_length:    { type: integer, default: 50000 }
      top_passes:    { type: integer, default: 60 }
      chunk_total:   { type: integer, default: 10 }
      ccs_bin:       { type: string,  default: "ccs" }
      docker_image:  { type: string,  description: "参考容器镜像" }

  lima:
    type: object
    properties:
      primers:       { type: string }
      lima_bin:      { type: string, default: "lima" }
      extra_args:    { type: string, default: "--isoseq --peek-guess" }
      docker_image:  { type: string }

  isoseq3:
    type: object
    properties:
      primers:       { type: string }
      isoseq3_bin:   { type: string, default: "isoseq3" }
      extra_args:    { type: string, default: "--require-polya" }
      docker_image:  { type: string }

  bamtools:
    type: object
    properties:
      bamtools_bin:  { type: string, default: "bamtools" }
      format:        { type: string, default: "fasta" }
      docker_image:  { type: string }

  gstama:
    type: object
    properties:
      gstama_bin:           { type: string, default: "tama_flnc_polya_cleanup.py" }
      gstama_collapse_bin:  { type: string, default: "tama_collapse.py" }
      gstama_merge_bin:     { type: string, default: "tama_merge.py" }
      fasta:                { type: string, description: "参考基因组 FASTA" }
      collapse_dir:         { type: string, default: "results/gstama_collapse" }
      collapse_args:        { type: string }
      filelist_cap:         { type: string, enum: [capped, no_cap], default: "no_cap" }
      filelist_order:       { type: string, default: "1" }
      merge_args:           { type: string }

  minimap2:
    type: object
    properties:
      minimap2_bin:  { type: string, default: "minimap2" }
      samtools_bin:  { type: string, default: "samtools" }
      args:          { type: string, default: "-x splice -uf -k14" }
      fasta:         { type: string }
      docker_image:  { type: string }

  ultra:
    type: object
    properties:
      ultra_bin:       { type: string, default: "uLTRA" }
      minimap2_bin:    { type: string, default: "minimap2" }
      samtools_bin:    { type: string, default: "samtools" }
      namfinder_bin:   { type: string, default: "namfinder" }
      fasta:           { type: string }
      gtf:             { type: string }
      index_args:      { type: string, default: "--disable_infer" }
      align_args:      { type: string, default: "" }
      species_genome:  { type: object, description: "{species: genome.fa}" }
      species_gtf:     { type: object, description: "{species: genes.sorted.gtf}" }
      docker_image:    { type: string }

  gnu_sort:
    type: object
    properties:
      sort_bin:   { type: string, default: "sort" }
      args:       { type: string, default: "" }
      overrides:  { type: object }

  gunzip:
    type: object
    properties:
      gzip_bin:   { type: string, default: "gzip" }

  output_dir:     { type: string, default: "results" }
  pbccs_dir:      { type: string }
  lima_dir:       { type: string }
  isoseq_dir:     { type: string }
  bamtools_dir:   { type: string }
  gstama_dir:     { type: string }
  minimap2_dir:   { type: string }
  ultra_dir:      { type: string }
  gstama_collapse_dir: { type: string }
  gstama_filelist_dir: { type: string }
  gstama_merge_dir:    { type: string }
  resources_dir:       { type: string }
  logs_dir:            { type: string }

required:
  - samplesheet
