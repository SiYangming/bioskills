# bamtools / nextflow / nf-core 说明模块
# ---------------------------------------------------------------------------
# source_type: official —— 仅保留说明、接口 Schema 与引用，不重写源码。
# 本目录为说明 + Schema；真正执行需在项目内安装官方 nf-core 子模块。
# ---------------------------------------------------------------------------

id: bamtools_nextflow_nfcore
version: "master@ad1de30"
software: bamtools
type: nextflow_nfcore
source_type: official

summary: "Official nf-core process family for bamtools (modules/nf-core/bamtools/* 全子模块清单 + 使用参考)."

agent_guidance:
  when_to_use: "组装 Nextflow DSL2 流程、目标为 HPC/Cloud 时，直接 include 对应子模块。"
  recommendation_priority: "Medium（Nextflow 流程引擎场景使用；CLI/Agent 直调请走 native）。"

# 版本对齐：本实现 meta.version 记录 nf-core/modules bamtools 目录 master sha；
# bamtools 上游二进制版本以各子模块 environment.yml 中的 conda pin 为准。
software_versions:
  module_version: "master@ad1de302063fd1b7d3e9e3d936759b460abfa5c7（modules/nf-core/bamtools/convert）"
  bamtools: "2.5.2"
  source: "bioconda::bamtools=2.5.2（modules/nf-core/bamtools/*/environment.yml）"
  note: "nf-core 将 bamtools 拆分为 convert / split / stats 三个独立 process；若固定 nf modules install 的 release tag，请以对应目录 environment.yml 为准。"

source_reference:
  repository: "https://github.com/nf-core/modules"
  modules_base: "modules/nf-core/bamtools"
  submodules:
    - "convert"
    - "split"
    - "stats"
  submodules_note: >
    子模块列表以 https://github.com/nf-core/modules/tree/master/modules/nf-core/bamtools
    在线目录为准（2026-08 抓取）；若 nf-core 官方未提供某个子命令，请降级使用 bamtools_nextflow_local。

inputs:
  meta:
    type: map
    description: "Groovy 样本元信息，如 [ id:'sample1', single_end:false ]"
  bam:
    type: file
    format: [bam]
    required: true
    description: "输入 BAM 文件（bamtools/convert 与 bamtools/split、bamtools/stats 的输入）"

outputs:
  out:
    type: file
    format: [bed, fasta, fastq, json, pileup, sam, yaml, bam]
    description: "输出文件（依子模块而定：convert 为 <fmt> 文本；split 为多个 BAM；stats 为文本统计）"
  versions:
    type: file
    pattern: "versions.yml"
    description: "nf-core 标准版本文件"

execution:
  mode: nextflow_include
  include_statement: "include { BAMTOOLS_CONVERT } from './modules/nf-core/bamtools/convert'"
  include_pattern: "include { BAMTOOLS_<SUB> } from './modules/nf-core/bamtools/<sub>'"
  container: "quay.io/biocontainers/bamtools:2.5.2--hdcf5f25_2"
  setup_hint: |
    在项目仓库根执行：
      nf modules install nf-core bamtools convert
      nf modules install nf-core bamtools split stats
    本目录仅提供 include 参考与统一 Schema，不重写官方源码。
