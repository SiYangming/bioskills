# bamtools 软件级总览元数据
# ---------------------------------------------------------------------------
# 汇总本软件在技能库中的所有可用实现类型与推荐优先级。
# 上层 Agent 通过本文件快速判断：该软件是否已收录、应优先走哪条实现路径。
# 实现路径结构：
#   skills/<software>/
#   ├── native/
#   ├── nextflow/nf-core/    # 官方 nf-core/modules（source_type: official）
#   │       local/            # 自定义 Nextflow 模块（source_type: custom）
#   └── snakemake/snakemake-wrappers/  # 官方 snakemake-wrappers（official）
#           local/              # 自定义 Snakemake 实现（source_type: custom）
# ---------------------------------------------------------------------------

software: bamtools
canonical: bamtools
category: alignment_utils
description: >
  BamTools 是操作 BAM 文件的高通量测序工具集，提供格式转换（convert）、
  统计（stats/count）、过滤（filter）、索引（index）、排序（sort）等核心能力。
  Iso-Seq 流程中常用于把 refine 后的 BAM 转换为 FASTA/FASTQ，供下游 TAMA 等使用。

homepage: https://github.com/pezmaster31/bamtools
license: MIT

# ---------------------------------------------------------------------------
# 【必填】版本差异声明：native / nf-core / snakemake-wrappers 的上游二进制版本可能不同
# （Debian apt 的 bamtools=2.5.2+dfsg-4 vs bioconda 侧的 2.5.2 / 2.5.3）。
# 此字段让 Agent 在跨引擎迁移时一眼看到风险点。
# ---------------------------------------------------------------------------
software_versions:
  native:
    bamtools: "2.5.2"
    build_route: "apt（debian:bookworm-slim，bamtools=2.5.2+dfsg-4）"
    source: "https://packages.debian.org/bookworm/bamtools"
    note: "bookworm 官方 apt 提供 2.5.2+dfsg-4；bioconda 侧最新已到 2.5.3（见 snakemake-wrappers），2.5.x 内部 API 兼容。"
  nextflow_nfcore:
    bamtools: "2.5.2"
    module_version: "master@ad1de30（modules/nf-core/bamtools/convert）"
    source: "bioconda::bamtools=2.5.2（modules/nf-core/bamtools/*/environment.yml）"
    note: "nf-core 将 bamtools 拆为 convert / split / stats 三个子模块；升级 modules 时请同步刷新。"
  nextflow_local:
    bamtools: "（继承 native 容器或显式 pin；未启用则写占位）"
  snakemake_wrappers:
    bamtools: "2.5.3"
    wrapper_tag: "v3.13.0"
    source: "bioconda bamtools=2.5.3（bio/bamtools/*/environment.yaml）"
    note: "bio/bamtools 仅有 filter / filter_json / split / stats 四个 wrapper，无 convert；convert 请走 native 或 nf-core。"
  snakemake_local:
    bamtools: "（继承 native 容器或显式 pin；未启用则写占位）"

# 可用实现清单（按推荐优先级排序）
implementations:
  - id: bamtools_native
    path: native
    source_type: custom
    type: native
    version: "2.5.2-v1.0"
    priority: high
    when_to_use: >
      非流程引擎场景（AI Agent Function Calling / 独立 CLI / Shell 调用）的首选目标，
      覆盖 convert/count/stats/header/index/sort 子命令。

  - id: bamtools_nextflow_nfcore
    path: nextflow/nf-core
    source_type: official
    type: nextflow_nfcore
    version: "master@ad1de30"
    priority: medium
    when_to_use: 组装 Nextflow DSL2 流程、目标为 HPC/Cloud 时。

  - id: bamtools_nextflow_local
    path: nextflow/local
    source_type: custom
    type: nextflow_local
    version: ""
    priority: low
    when_to_use: nf-core 子模块缺失或需要本地定制的 Nextflow 模块。

  - id: bamtools_snakemake_wrappers
    path: snakemake/snakemake-wrappers
    source_type: official
    type: snakemake_wrappers
    version: "v3.13.0"
    priority: medium
    when_to_use: 组装 Snakemake 流程、复用中央 wrapper 缓存时。

  - id: bamtools_snakemake_local
    path: snakemake/local
    source_type: custom
    type: snakemake_local
    version: "1.0.0"
    priority: low
    when_to_use: snakemake-wrappers 缺失（如 bamtools convert）或需要本地定制的 Snakemake rule。

# 默认推荐路径（Agent 路由用）
default_implementation: bamtools_native
