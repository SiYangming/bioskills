# samtools / official_nfcore 说明模块
# ---------------------------------------------------------------------------
# source_type: official —— 仅保留说明、接口 Schema 与引用，不重写源码。
# nf-core/modules 中 samtools 拆分为多个子模块（view/sort/index/...）。
# ---------------------------------------------------------------------------

id: samtools_official_nfcore
version: "2.2.0"
software: samtools
type: nfcore_module
source_type: official

summary: "Official nf-core process family for samtools (view/sort/index/stats/...)."

agent_guidance:
  when_to_use: "组装 Nextflow DSL2 流程、目标为 HPC/Cloud 时，直接 include 对应子模块。"
  recommendation_priority: "Medium（流程引擎场景使用；CLI/Agent 直调请走 native）。"

source_reference:
  repository: "https://github.com/nf-core/modules"
  submodules:
    - "modules/nf-core/samtools/view"
    - "modules/nf-core/samtools/sort"
    - "modules/nf-core/samtools/index"
    - "modules/nf-core/samtools/flagstat"
    - "modules/nf-core/samtools/idxstats"
    - "modules/nf-core/samtools/stats"
    - "modules/nf-core/samtools/mpileup"
    - "modules/nf-core/samtools/merge"
    - "modules/nf-core/samtools/faidx"
    - "modules/nf-core/samtools/quickcheck"
    - "modules/nf-core/samtools/dict"
    - "modules/nf-core/samtools/convert"

# 统一抽象接口（以 view 子模块为代表性签名）
inputs:
  meta:
    type: map
    description: "Groovy 样本元信息，如 [ id:'sample1', single_end:false ]"
  input:
    type: file
    format: [sam, bam, cram]
    description: "输入 SAM/BAM/CRAM"

outputs:
  output:
    type: file
    format: [sam, bam, cram]
    description: "输出文件（依子模块而定）"
  report:
    type: file
    format: [txt, html, json]
    description: "统计/报告文件（flagstat/stats 等）"

execution:
  mode: nextflow_include
  include_statement: "include { SAMTOOLS_VIEW } from './modules/nf-core/samtools/view'"
  container: "community.wave.seqera.io/library/samtools:1.21--aes08f8c8e6e4b4b"
