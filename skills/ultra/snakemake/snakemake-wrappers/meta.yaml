# ultra / snakemake / snakemake-wrappers 说明模块
# ---------------------------------------------------------------------------
# source_type: official —— 仅保留说明、桥接脚本与接口 Schema，不重写源码。
# ⚠️ 官方 snakemake-wrappers 的 bio/ultra 目录不存在（GitHub API 404，2026-08 核对），
#    因此本目录是“已登记但官方缺失”的占位：wrapper 句柄不可解析，必须降级 ../local/。
# ---------------------------------------------------------------------------

id: ultra_snakemake_wrappers
version: "v3.13.0"
software: ultra
type: snakemake_wrappers
source_type: official

summary: "Official Snakemake Wrappers for uLTRA（bio/ultra 官方缺失 → 降级 ../local 的登记位）。"

agent_guidance:
  when_to_use: "Snakemake 流程中优先考虑官方 wrapper；但 bio/ultra 官方不存在，应直接使用 ultra_snakemake_local（ultra.smk）。"
  recommendation_priority: "Low（官方缺失；Snakemake 场景请走 ultra_snakemake_local）。"

software_versions:
  wrapper_tag: "v3.13.0"
  ultra: "无官方 wrapper（bio/ultra 404）"
  source: "https://api.github.com/repos/snakemake/snakemake-wrappers/contents/bio/ultra → 404（2026-08）"
  note: "snakemake-wrappers 官方 bio/ 目录无 ultra；若未来官方新增，请刷新 submodules 并核对 ultra_bioinformatics 版本。当前必须降级 ultra_snakemake_local。"

source_reference:
  repository: "https://github.com/snakemake/snakemake-wrappers"
  wrapper_base: "bio/ultra"
  tag: "v3.13.0"
  submodules: []
  submodules_note: >
    https://api.github.com/repos/snakemake/snakemake-wrappers/contents/bio/ultra 返回 404
    （2026-08 核对），官方无任何 ultra wrapper 子目录；执行层一律走 ../local/ultra.smk。
    若未来官方新增，以在线目录为准刷新本列表。

inputs:
  fasta:
    type: file
    format: [fasta, fa]
    description: "参考基因组 FASTA（index 用）"
  gtf:
    type: file
    format: gtf
    description: "参考注释 GTF（index/sort 用）"
  reads:
    type: file
    format: [fa, fasta, fastq]
    description: "输入 reads（align 用）"

outputs:
  pickle_db:
    type: file
    format: [pickle, db]
    description: "index 产物"
  bam:
    type: file
    format: bam
    description: "align 产物"

execution:
  mode: snakemake_rule
  wrapper_template: "v3.13.0/bio/ultra/{subcommand}（官方不存在，勿直接引用）"
  rule_example: |
    # 官方 wrapper 缺失：直接在 Snakefile 中
    include: "skills/ultra/snakemake/local/ultra.smk"
    # 或
    use rule ultra_index, ultra_align from rule_ultra as ultra_index, ultra_align
