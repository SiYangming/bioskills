# sra-tools / nextflow / nf-core 说明模块
# ---------------------------------------------------------------------------
# source_type: official —— 仅保留说明、接口 Schema 与引用，不重写源码。
# 注意：nf-core 官方模块目录名为【sratools】（无连字符），与 canonical 名
#       sra-tools 不同；子模块为 fasterqdump + prefetch，均 pin bioconda::sra-tools=3.2.1。
# ---------------------------------------------------------------------------

id: sra-tools_nextflow_nfcore
version: "master"
software: sra-tools
type: nextflow_nfcore
source_type: official

summary: "Official nf-core process for SRA Toolkit (modules/nf-core/sratools/{fasterqdump,prefetch}：SRA->FASTQ 快速转换 + SRA 下载)."

agent_guidance:
  when_to_use: "组装 Nextflow DSL2 流程、目标为 HPC/Cloud 时，直接 include 对应子模块（注意安装名是 sratools 而非 sra-tools）。"
  recommendation_priority: "Medium（Nextflow 流程引擎场景使用；CLI/Agent 直调请走 native）。"

software_versions:
  module_version: "nf-core master（2026-09 抓取）"
  sra_tools: "3.2.1"
  source: "bioconda::sra-tools=3.2.1 + pigz=2.8（modules/nf-core/sratools/{fasterqdump,prefetch}/environment.yml）"
  note: "两个子模块 environment.yml 均 pin bioconda::sra-tools=3.2.1 + conda-forge::pigz=2.8；
         container 由 community.wave.seqera.io 按该 env 生成；bump 模块后请同步刷新本文件。"

source_reference:
  repository: "https://github.com/nf-core/modules"
  modules_base: "modules/nf-core/sratools"
  submodules:
    - "fasterqdump"
    - "prefetch"
  submodules_note: >
    2026-09 抓取 https://api.github.com/repos/nf-core/modules/contents/modules/nf-core/sratools
    返回两个子目录：fasterqdump（SRA->FASTQ 快速转换）与 prefetch（SRA 下载）。
    注意 nf-core 目录名是 sratools（无连字符），安装命令用 nf-core modules install nf-core sratools/<sub>。
    列表以 https://github.com/nf-core/modules/tree/master/modules/nf-core/sratools 在线目录为准。

inputs:
  meta:
    type: map
    description: "Groovy 样本元信息，如 [ id:'SRR12345678' ]"
  sra:
    type: file
    format: sra
    required: false
    description: "输入 .sra 文件（fasterqdump 子模块）"
  accession:
    type: string
    required: false
    description: "SRA accession（prefetch 子模块）"

outputs:
  fastq:
    type: file
    format: fastq
    description: "转换得到的 FASTQ（fasterqdump；--split-3 时为 *_1/_2）"
  sra:
    type: file
    format: sra
    description: "下载的 SRA 文件（prefetch）"
  versions:
    type: file
    pattern: "versions.yml"
    description: "nf-core 标准版本文件"

execution:
  mode: nextflow_include
  include_statement: "include { SRATOOLS_FASTERQDUMP } from './modules/nf-core/sratools/fasterqdump/main'"
  include_pattern: "include { SRATOOLS_<SUB> } from './modules/nf-core/sratools/<sub>/main'"
  container: "community.wave.seqera.io/library/sra-tools:3.2.1--h9ee0642_0"
  setup_hint: |
    在项目仓库根执行（注意模块名是 sratools）：
      nf modules install nf-core sratools/fasterqdump
      nf modules install nf-core sratools/prefetch
    本目录仅提供 include 参考与统一 Schema，不重写官方源码；
    若官方缺失（如需要 fastq-dump 子模块） / 需定制，请使用 ../local/。
