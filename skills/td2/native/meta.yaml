# td2 native 自包含实现元数据
# ---------------------------------------------------------------------------
# source_type: custom —— 本地全量自维护，不依赖官方 wrapper 源码。
# 二进制：TD2.LongOrfs / TD2.Predict（bioconda::td2=1.0.6）。
# 命令逻辑迁移自 snakemake.smk/flrnaseq.smk/workflow/scripts/td2_longorfs.py
# 与 td2_predict.py（-t <fasta> -O <dir> + --gene-trans-map / retain 参数）。
# ---------------------------------------------------------------------------

id: td2_native
version: "1.0.6-v1.0"
software: td2
type: native
source_type: custom

summary: "Self-contained TD2 runner，覆盖 LongOrfs（候选 ORF 提取）与 Predict（CDS 预测）两步，自动注入线程与临时目录优化。"

agent_guidance:
  when_to_use: "AI Agent Function Calling 或独立 Python/Shell CLI 调用时优先使用本实现。"
  recommendation_priority: "High（非流程引擎场景的主执行目标）"

# 本实现实际运行的上游二进制版本 + 构建来源
software_versions:
  td2: "1.0.6"
  binary: "TD2.LongOrfs / TD2.Predict"
  source: "bioconda::td2=1.0.6（micromamba 引导的 /opt/env；environment.yml 已 pin；同 flrnaseq envs/td2.yaml）"
  note: "td2 不在 Debian bookworm apt，容器走 bookworm-slim + micromamba + bioconda 路线；注意 nf-core master 当前 pin 1.1.0（比本实现 1.0.6 新）。"

# ---- 统一输入接口（JSON Schema 导出依据）-------------------------------- #
inputs:
  subcommand:
    type: string
    required: true
    description: "td2 子命令：longorfs | predict"
  input:
    type: file
    required: true
    cli_arg: "-t"
    description: "输入转录本 FASTA（支持 .gz 时由驱动自动解压到 tmpdir）"
  output_dir:
    type: string
    required: false
    cli_arg: "-O"
    description: "输出目录（longorfs：TD2 直接写该目录；predict：指向 LongOrfs 产物目录）"
  gene_trans_map:
    type: file
    required: false
    cli_arg: "--gene-trans-map"
    description: "gene-to-transcript 映射文件（LongOrfs；可选）"
  min_length:
    type: integer
    default: 90
    cli_arg: "-m"
    description: "长转录本最小蛋白长度 aa（flrnaseq 默认 -m 90）"
  abs_min_length:
    type: integer
    default: 90
    cli_arg: "-M"
    description: "短转录本最小蛋白长度 aa（flrnaseq 默认 -M 90）"
  genetic_code:
    type: integer
    default: 1
    cli_arg: "-G"
    description: "遗传密码（NCBI 整数代码，默认 1=universal）"
  strand_specific:
    type: boolean
    default: false
    cli_arg: "-S"
    description: "仅分析正义链（strand-specific）"
  alt_start:
    type: boolean
    default: false
    cli_arg: "--alt-start"
    description: "包含替代起始密码子"
  all_stopless:
    type: boolean
    default: false
    cli_arg: "--all-stopless"
    description: "报告无终止密码子序列（不要求起始密码子）"
  complete_orfs_only:
    type: boolean
    default: false
    cli_arg: "--complete-orfs-only"
    description: "丢弃不含终止与起始密码子的 ORF"
  retain_mmseqs_hits:
    type: file
    required: false
    cli_arg: "--retain-mmseqs-hits"
    description: "mmseqs 输出（.m8 格式）证据保留"
  retain_blastp_hits:
    type: file
    required: false
    cli_arg: "--retain-blastp-hits"
    description: "blastp -outfmt 6 结果证据保留"
  retain_hmmer_hits:
    type: file
    required: false
    cli_arg: "--retain-hmmer-hits"
    description: "hmmscan Pfam domain table 证据保留"
  psauron_all_frame:
    type: boolean
    default: false
    cli_arg: "--psauron-all-frame"
    description: "要求 ORF 在跨读框中 PSAURON 得分最高（flrnaseq predict 默认开启）"
  all_good:
    type: boolean
    default: false
    cli_arg: "--all-good"
    description: "报告所有通过 PSAURON 与/或长度过滤的 ORF"
  threads:
    type: integer
    default: 4
    cli_arg: "--threads"
    description: "线程数（自动注入）"
  extra_args:
    type: string
    required: false
    description: "透传给 TD2 的额外参数（高级用法，慎用）"

outputs:
  pep:
    type: file
    format: fasta
    description: "预测蛋白序列（<prefix>.TD2.pep）"
  cds:
    type: file
    format: fasta
    description: "预测 CDS 核酸序列（<prefix>.TD2.cds）"
  gff3:
    type: file
    format: gff3
    description: "CDS 注释（<prefix>.TD2.gff3）"
  bed:
    type: file
    format: bed
    description: "CDS 区间（<prefix>.TD2.bed）"
  longest_orfs:
    type: file
    format: fasta
    description: "LongOrfs 候选（<outdir>/longest_orfs.pep/cds/gff3）"

# ---- 本地环境配方与性能优化（custom 模块独有）--------------------------- #
environment:
  conda: "environment.yml"
  dockerfile: "Dockerfile"
  apptainer_def: "Apptainer.def"

optimization:
  default_cpus: 4
  default_mem_mb: 8192
  tmpdir: "/tmp"
  env_vars:
    TMPDIR: "{tmpdir}"
    PYTHONUNBUFFERED: "1"
  # 子命令级线程建议（高于用户显式 --threads 时仍以用户为准）
  per_subcommand_threads:
    longorfs: 8        # TD2.LongOrfs 支持 --threads（默认 8），CPU 密集
    predict: 8
    default: 4

execution:
  entrypoint: "python main.py"
  test_command: "bash test/run_test.sh"
  binary: "TD2.Predict"
