# td2 / snakemake / local — 自维护 Snakemake rule
# ---------------------------------------------------------------------------
# source_type: custom —— 规则迁移自 snakemake.smk/flrnaseq.smk/workflow/rules/td2.smk，
# 去掉对 Snakefile 顶部全局变量（SAMPLES / os / directory / config）的依赖：
#   - SAMPLES 的 lambda 输入改为路径模板 long_read/{sample}.fasta
#   - config 的 td2_dir 改为规则内输出路径模板
#   - config 的 params 改为规则内显式默认值（与 flrnaseq config.yaml td2 段一致）
#   - docker/container 分支移除，直接调用本地 TD2 二进制（或 conda env）
# ---------------------------------------------------------------------------

id: td2_snakemake_local
version: "0.1.0"
software: td2
type: snakemake_local
source_type: custom

summary: "Self-maintained Snakemake rules for td2（迁移自 flrnaseq.smk/workflow/rules/td2.smk 的真实规则：LongOrfs + Predict 两步）."

agent_guidance:
  when_to_use: "Snakemake 流程中需要 TD2 做转录本 ORF/CDS 预测时；官方 bio/td2 wrapper 不存在（404），本 rule 为 Snakemake 场景主路径。"
  recommendation_priority: "Medium（Snakemake 流程引擎场景；CLI/Agent 直调请走 native）。"
  enabled: true

# 本实现实际运行的上游二进制版本 + 迁移来源
software_versions:
  td2: "1.0.6"
  source: "自维护 td2.smk（迁移自 flrnaseq.smk/workflow/rules/td2.smk；conda 建议 bioconda::td2=1.0.6）"
  note: "原规则依赖 Snakefile 顶部的 SAMPLES / os / config；迁移后输入用路径模板 long_read/{sample}.fasta，参数内联（longorfs_extra_params: -m 90 -M 90 -G 1 -S --alt-start --all-stopless；predict_extra_params: --psauron-all-frame）。"

inputs:
  fasta:
    type: file
    format: fasta
    required: true
    description: "输入转录本 FASTA（路径模板 long_read/{sample}.fasta）"

outputs:
  longorfs_dir:
    type: directory
    description: "LongOrfs 中间目录（td2/{sample}/longorfs/，含 longest_orfs.pep/cds/gff3）"
  pep:
    type: file
    format: fasta
    description: "预测蛋白序列（td2/{sample}/predict/{sample}.pep）"
  cds:
    type: file
    format: fasta
    description: "预测 CDS 核酸序列"
  gff3:
    type: file
    format: gff3
    description: "CDS 注释"
  bed:
    type: file
    format: bed
    description: "CDS 区间"

execution:
  mode: snakemake_rule
  rule_files:
    - "td2.smk"
  include_hint: |
    # 在 Snakefile 中：
    include: "skills/td2/snakemake/local/td2.smk"
  conda_hint: "规则内 conda 指向 envs/td2.yaml（内容：bioconda::td2=1.0.6）"
