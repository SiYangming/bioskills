# transdecoder native 自包含实现元数据
# ---------------------------------------------------------------------------
# source_type: custom —— 本地全量自维护，不依赖官方 wrapper 源码。
# 二进制：TransDecoder.LongOrfs / TransDecoder.Predict（bioconda::transdecoder=5.7.1）。
# 命令逻辑迁移自 snakemake.smk/flrnaseq.smk/workflow/scripts/transdecoder_longorfs.py
# 与 transdecoder_predict.py（-t <fasta> -O <dir> + --gene_trans_map / retain 参数）。
# ---------------------------------------------------------------------------

id: transdecoder_native
version: "5.7.1-v1.0"
software: transdecoder
type: native
source_type: custom

summary: "Self-contained TransDecoder runner，覆盖 LongOrfs（候选 ORF 提取）与 Predict（CDS 预测）两步，自动注入线程与临时目录优化。"

agent_guidance:
  when_to_use: "AI Agent Function Calling 或独立 Python/Shell CLI 调用时优先使用本实现。"
  recommendation_priority: "High（非流程引擎场景的主执行目标）"

# 本实现实际运行的上游二进制版本 + 构建来源
software_versions:
  transdecoder: "5.7.1"
  binary: "TransDecoder.LongOrfs / TransDecoder.Predict"
  source: "bioconda::transdecoder=5.7.1（micromamba 引导的 /opt/env；environment.yml 已 pin；同 flrnaseq envs/transdecoder.yaml）"
  note: "transdecoder 不在 Debian bookworm apt，容器走 bookworm-slim + micromamba + bioconda 路线；与 nf-core / snakemake-wrappers 的 conda pin 5.7.1 一致。"

# ---- 统一输入接口（JSON Schema 导出依据）-------------------------------- #
inputs:
  subcommand:
    type: string
    required: true
    description: "transdecoder 子命令：longorfs | predict"
  input:
    type: file
    required: true
    cli_arg: "-t"
    description: "输入转录本 FASTA（支持 .gz 时由驱动自动解压到 tmpdir）"
  output_dir:
    type: string
    required: false
    cli_arg: "-O"
    description: "输出目录（默认取输入文件所在目录）"
  gene_trans_map:
    type: file
    required: false
    cli_arg: "--gene_trans_map"
    description: "gene-to-transcript 映射文件（LongOrfs；可选）"
  min_protein_length:
    type: integer
    default: 50
    cli_arg: "-m"
    description: "最小蛋白长度（aa），LongOrfs 过滤用（flrnaseq 默认 -m 50）"
  genetic_code:
    type: string
    default: "Universal"
    cli_arg: "-G"
    description: "遗传密码表（Universal / Candida / Yeast 等，见 TransDecoder 文档）"
  strand_specific:
    type: boolean
    default: false
    cli_arg: "-S"
    description: "仅分析正义链（strand-specific，top strand only）"
  complete_orfs_only:
    type: boolean
    default: false
    cli_arg: "--complete_orfs_only"
    description: "仅保留同时含起始与终止密码子的完整 ORF"
  retain_pfam_hits:
    type: file
    required: false
    cli_arg: "--retain_pfam_hits"
    description: "hmmscan Pfam domain table（Predict 证据保留）"
  retain_blastp_hits:
    type: file
    required: false
    cli_arg: "--retain_blastp_hits"
    description: "blastp -outfmt 6 结果（Predict 证据保留）"
  single_best_only:
    type: boolean
    default: false
    cli_arg: "--single_best_only"
    description: "每个转录本仅保留单一最佳 ORF"
  no_refine_starts:
    type: boolean
    default: false
    cli_arg: "--no_refine_starts"
    description: "禁用起始密码子精修（flrnaseq predict 默认 --no_refine_starts）"
  threads:
    type: integer
    default: 4
    cli_arg: "--cpu"
    description: "线程数（Predict 用 --cpu 注入）"
  extra_args:
    type: string
    required: false
    description: "透传给 TransDecoder 的额外参数（高级用法，慎用）"

outputs:
  pep:
    type: file
    format: fasta
    description: "预测蛋白序列（<prefix>.transdecoder.pep）"
  cds:
    type: file
    format: fasta
    description: "预测 CDS 核酸序列（<prefix>.transdecoder.cds）"
  gff3:
    type: file
    format: gff3
    description: "CDS 注释（<prefix>.transdecoder.gff3）"
  bed:
    type: file
    format: bed
    description: "CDS 区间（<prefix>.transdecoder.bed）"
  transdecoder_dir:
    type: directory
    description: "LongOrfs 中间目录（<prefix>.transdecoder_dir/，含 longest_orfs.pep/cds/gff3）"

# ---- 本地环境配方与性能优化（custom 模块独有）--------------------------- #
environment:
  conda: "environment.yml"
  dockerfile: "Dockerfile"
  apptainer_def: "Apptainer.def"

optimization:
  default_cpus: 4
  default_mem_mb: 8192
  tmpdir: "/tmp"
  env_vars:
    TMPDIR: "{tmpdir}"
    PYTHONUNBUFFERED: "1"
  # 子命令级线程建议（高于用户显式 --threads 时仍以用户为准）
  per_subcommand_threads:
    predict: 8        # Predict 为 CPU 密集（模型训练 + 打分），优先多线程
    longorfs: 4
    default: 4

execution:
  entrypoint: "python main.py"
  test_command: "bash test/run_test.sh"
  binary: "TransDecoder.Predict"
