# gnu_sort / nextflow / nf-core 说明模块
# ---------------------------------------------------------------------------
# source_type: official —— 仅保留说明、接口 Schema 与引用，不重写源码。
# 本目录为说明 + Schema；真正执行需在项目内安装官方 nf-core 子模块。
# ---------------------------------------------------------------------------

id: gnu_sort_nextflow_nfcore
version: "master"
software: gnu_sort
type: nextflow_nfcore
source_type: official

summary: "Official nf-core process family for GNU sort (modules/nf-core/gnu/{sort,split} 子模块清单；本软件对应 gnu/sort)."

agent_guidance:
  when_to_use: "组装 Nextflow DSL2 流程、目标为 HPC/Cloud 时，直接 include GNU_SORT 子模块（gnu/sort）。"
  recommendation_priority: "Medium（Nextflow 流程引擎场景使用；CLI/Agent 直调请走 native）。"

software_versions:
  module_version: "master（2026-08 抓取；nf-core modules install 时写实际 commit）"
  gnu_sort: "9.5"
  coreutils: "9.5"
  source: "conda-forge::coreutils=9.5（modules/nf-core/gnu/sort/environment.yml）"
  note: "nf-core 拆分为 gnu/sort 与 gnu/split 两个子模块；本软件对应 gnu/sort（文本排序）。"

source_reference:
  repository: "https://github.com/nf-core/modules"
  modules_base: "modules/nf-core/gnu"
  submodules:
    - "sort"
    - "split"
  submodules_note: >
    子模块列表以 https://github.com/nf-core/modules/tree/master/modules/nf-core/gnu
    在线目录为准（2026-08 GitHub API 抓取）；本软件对应 gnu/sort（gnu/split 为文件切分，
    另需时单独 install）。若官方未提供所需参数，请降级使用 gnu_sort_nextflow_local。

inputs:
  - name: meta
    type: map
    description: "Groovy 样本元信息，如 [ id:'test', single_end:false ]"
  - name: input
    type: file
    format: [txt, bed, interval, genome, bins]
    description: "待排序文件"

outputs:
  - name: sorted
    type: file
    description: "排序后文件（pattern: *.{txt,bed,interval,genome,bins}）"
  - name: versions
    type: file
    pattern: "versions.yml"
    description: "nf-core 标准版本文件"

execution:
  mode: nextflow_include
  include_statement: "include { GNU_SORT } from './modules/nf-core/gnu/sort'"
  include_pattern: "include { GNU_<SUB> } from './modules/nf-core/gnu/<sub>'"
  container: "community.wave.seqera.io/library/coreutils:9.5（以 nf-core modules install 实际解析的 Wave 容器为准）"
  setup_hint: |
    在项目仓库根执行：
      nf-core modules install gnu/sort
    本目录仅提供 include 参考与统一 Schema，不重写官方源码。
