# lima native Conda 环境配方
# 创建：mamba env create -f environment.yml
# 说明：lima 不在 Debian bookworm apt；本文件是 Conda 兜底（HPC 无 root / 离线场景）。
#      容器默认路线：Dockerfile / Apptainer.def 走 micromamba 引导本环境到 /opt/env。
name: lima-native
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - lima=2.9.0
  - pyyaml>=6.0
  - pip
