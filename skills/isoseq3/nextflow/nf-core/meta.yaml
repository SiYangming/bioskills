# isoseq3 / nextflow / nf-core 说明模块
# ---------------------------------------------------------------------------
# source_type: official —— 仅保留说明、接口 Schema 与引用，不重写源码。
# 本目录为说明 + Schema；真正执行需在项目内安装官方 nf-core 子模块。
# 注意：nf-core 目录名为 modules/nf-core/isoseq/{refine,cluster}（bioconda 包 isoseq，
#       二进制 isoseq3）；本技能聚焦 refine 子模块。
# ---------------------------------------------------------------------------

id: isoseq3_nextflow_nfcore
version: "1.0.0"
software: isoseq3
type: nextflow_nfcore
source_type: official

summary: "Official nf-core process family for isoseq (modules/nf-core/isoseq/{refine,cluster}；本技能对应 refine：去除 polyA 尾与人工连接体)."

agent_guidance:
  when_to_use: "组装 Nextflow DSL2 流程、目标为 HPC/Cloud 时，include 对应的 nf-core isoseq 子模块。"
  recommendation_priority: "Medium（Nextflow 流程引擎场景使用；CLI/Agent 直调请走 native）。"

# 版本对齐：本实现 meta.version 记录 nf-core/modules isoseq 家族版本；
# isoseq 上游二进制版本以子模块 environment.yml 中的 conda pin 为准。
software_versions:
  module_version: "1.0.0"
  isoseq: "4.0.0"
  binary: "isoseq3"
  source: "bioconda::isoseq=4.0.0（modules/nf-core/isoseq/refine/environment.yml）"
  note: "nf-core 目录 modules/nf-core/isoseq/ 含 refine 与 cluster 两个子模块；本技能对应 refine。
         environment.yml pin 为 bioconda::isoseq=4.0.0；container 由 community.wave.seqera.io 按该 env 生成。"

source_reference:
  repository: "https://github.com/nf-core/modules"
  modules_base: "modules/nf-core/isoseq"
  submodules:
    - "cluster"
    - "refine"
  submodules_note: >
    列表以 https://github.com/nf-core/modules/tree/master/modules/nf-core/isoseq 在线目录为准
    （2026-08 抓取到 cluster 与 refine 两个子目录）。
    本技能（isoseq3 refine）对应其中 refine 子模块；cluster 用于下游聚类去冗余。

inputs:
  meta:
    type: map
    description: "Groovy 样本元信息，如 [ id:'sample1' ]"
  bam:
    type: file
    format: bam
    required: true
    description: "BAM file, cleaned ccs generated by lima"
  primers:
    type: file
    format: fasta
    required: true
    description: "fasta file of primers"

outputs:
  bam:
    type: file
    format: bam
    description: "Set of complete reads (with polyA tail), where the polyA has been trimmed"
  pbi:
    type: file
    format: pbi
    description: "Pacbio index file from polyA trimmed reads"
  consensusreadset:
    type: file
    format: xml
    description: "Metadata about read library（*.xml）"
  summary:
    type: file
    format: json
    description: "FL/FLNC/polyA reads 计数（*.json）"
  report:
    type: file
    format: csv
    description: "引物与 polyA 检测元数据（*.csv）"
  versions:
    type: file
    pattern: "versions.yml"
    description: "nf-core 标准版本文件"

execution:
  mode: nextflow_include
  include_statement: "include { ISOSEQ_REFINE } from './modules/nf-core/isoseq/refine/main'"
  include_pattern: "include { ISOSEQ_<SUB> } from './modules/nf-core/isoseq/<sub>/main'"
  container: "community.wave.seqera.io/library/isoseq:4.0.0--h9ee0642_0"
  setup_hint: |
    在项目仓库根执行：
      nf modules install nf-core isoseq/refine
    （需要 cluster 时另装 nf modules install nf-core isoseq/cluster）
    本目录仅提供 include 参考与统一 Schema，不重写官方源码；
    若官方缺失 / 需定制，请使用 ../local/。
