software: salmon
canonical: salmon
category: transcriptome
description: 'Salmon 是基于准映射（quasi-mapping）的快速转录组定量工具：salmon index 为转录本构建
  quasi-mapping 索引，salmon quant 直接从 RNA-seq reads 估计转录本丰度（TPM/NumReads），兼顾精度与速度，
  是转录本水平定量的常用工具。

  '
homepage: https://combine-lab.github.io/salmon/
license: GPL-3.0
software_versions:
- id: salmon_native
  salmon: '1.3.0'
  build_route: official biocontainer（quay.io/biocontainers/salmon / depot.galaxyproject.org）
  source: https://anaconda.org/bioconda/salmon
  note: '官方镜像优先（bioconda→quay.io/biocontainers→depot.galaxyproject.org），本地不再自建容器；salmon=1.3.0
    由官方镜像/conda 提供（quay tag 1.3.0--hf69c8f4_0），宿主机直跑 main.py 时用 conda/mamba 安装，或使用官方预编译二进制（仅 linux-x64）。'
- id: salmon_nextflow_nfcore
  module_version: master（2026-09 抓取）
  salmon: '1.10.3'
  source: bioconda::salmon=1.10.3（modules/nf-core/salmon/{index,quant}/environment.yml）
  note: nf-core 有 salmon/index 与 salmon/quant 两个子模块，均 pin bioconda::salmon=1.10.3；与 native 版 1.3.0 相差多个 minor。
- id: salmon_snakemake_wrappers
  wrapper_tag: v9.17.1（2026-09 抓取 snakemake-wrappers 最新 release）
  salmon: '2.5.1'
  source: salmon=2.5.1 + gzip=1.14 + bzip2=1.0.8（bio/salmon/{decoys,index,quant}/environment.yaml）
  note: 官方有 salmon/decoys、salmon/index、salmon/quant 三个 wrapper，quant 环境 pin salmon=2.5.1。
implementations:
- id: salmon_native
  path: native
  source_type: custom
  type: native
  version: "1.3.0"
  priority: high
  when_to_use: '非流程引擎场景（AI Agent Function Calling / 独立 CLI / Shell 调用）的首选目标。覆盖
    index / quant / quantmerge 链路，自动注入线程。
    '
  container_ref:
    bioconda: https://anaconda.org/bioconda/salmon
    quay_biocontainers: quay.io/biocontainers/salmon
    upstream_prebuilt: https://github.com/COMBINE-lab/salmon/releases/download/v1.3.0/salmon-1.3.0_linux_x86_64.tar.gz
    install_hint: 推荐 mamba create -n <env> -c conda-forge -c bioconda salmon=1.3.0；容器可用 quay.io/biocontainers/salmon:1.3.0--hf69c8f4_0
      镜像（tag 见 README）
    note: 官方 release 提供 linux-x64 预编译二进制包（已核实 v1.3.0 无 macOS 预编译资产）；另有源码编译路线
default_implementation: salmon_native
inputs:
  subcommand:
    type: string
    required: true
    description: 'salmon 子命令：index|quant|quantmerge'
  transcripts:
    type: file
    required: false
    cli_arg: -t
    description: 转录本 FASTA（index 使用）
  index:
    type: string
    required: false
    cli_arg: -i
    description: 索引目录（index 输出 / quant 输入）
  left:
    type: file
    required: false
    cli_arg: -1
    description: 左端 fastq（双端 quant）
  right:
    type: file
    required: false
    cli_arg: -2
    description: 右端 fastq（双端 quant）
  reads:
    type: file
    required: false
    cli_arg: -r
    description: 单端 fastq（quant）
  libtype:
    type: string
    default: A
    cli_arg: -l
    description: 文库类型（默认 A=自动推断）
  kmer:
    type: integer
    default: 31
    cli_arg: -k
    description: index 的 k-mer 长度（默认 31）
  validate_mappings:
    type: boolean
    default: true
    cli_arg: --validateMappings
    description: 开启准映射验证（提高精度）
  quants:
    type: map
    required: false
    cli_arg: --quants
    description: 待合并的定量结果目录列表（quantmerge）
  output:
    type: file
    required: false
    cli_arg: -o
    description: 输出目录 / 合并结果路径
  threads:
    type: integer
    default: 4
    cli_arg: -p
    description: 线程数（自动注入 -p）
  extra_args:
    type: string
    required: false
    description: 透传给 salmon 的额外参数（高级用法，慎用）
outputs:
  index_dir:
    type: file
    format: directory
    description: salmon 索引目录（含 info.json / hash.bin 等）
  quant_dir:
    type: file
    format: directory
    description: quant 输出目录（含 quant.sf / aux_info 等）
  merged_quant:
    type: file
    format: tsv
    description: quantmerge 合并后的表达矩阵
environment:
  container_official: quay.io/biocontainers/salmon（bioconda 官方镜像；tag 以 quay / depot.galaxyproject.org 为准，见 README「容器与 Conda 链接」）
  note: 官方镜像已覆盖，本地不再维护 Dockerfile/Apptainer.def；官方同时提供 linux-x64 预编译二进制包与源码编译两条路线（已核实）；宿主机直跑 main.py 时用 conda/mamba 安装 salmon。
optimization:
  default_cpus: 4
  default_mem_mb: 8192
  tmpdir: /tmp
  env_vars:
    TMPDIR: '{tmpdir}'
    PYTHONUNBUFFERED: '1'
  per_subcommand_threads:
    index: 4
    quant: 8
    default: 4
execution:
  entrypoint: python main.py
  test_command: bash test/run_test.sh
  binary: salmon
