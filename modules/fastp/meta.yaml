software: fastp
canonical: fastp
category: qc
description: 'fastp 是 DNA/RNA 短读段（Illumina）质控与预处理工具，支持接头自动检测与切除、 质量过滤、长度过滤、PolyG/PolyX
  修剪、UMI 处理、重复序列标记与 QC 报告 （HTML + JSON），单/双端 FASTQ(gz) 一步完成清洗。

  '
homepage: https://github.com/OpenGene/fastp
license: MIT
software_versions:
- id: fastp_native
  fastp: 0.24.0
  note: CONDA 路线：fastp 不在 Debian bookworm apt，容器走 debian:bookworm-slim + micromamba
    引导 bioconda env（bioconda::fastp=0.24.0 → /opt/env）；二进制 fastp。
- id: fastp_nextflow_nfcore
  module_version: 'master（2026-09-01 抓取；submodules: fastp）'
  fastp: 1.3.6
  source: bioconda::fastp=1.3.6（modules/nf-core/fastp/environment.yml）
  note: nf-core master 当前 pin fastp=1.3.6（比 native 的 0.24.0 新）；若 nf-core 回落旧 tag 则可能回到
    0.2x。
- id: fastp_snakemake_wrappers
  wrapper_tag: v3.13.0
  fastp: 1.3.6
  source: bioconda fastp=1.3.6（bio/fastp/environment.yaml，无 snakemake-wrapper-utils
    依赖）
  note: 与 nf-core 当前 pin 一致（1.3.6）；若固定 wrapper tag < v3.13，fastp 可能回落 0.2x。
- id: fastp_nextflow_local
  fastp: 未固定（用户按 main.nf 中 conda/container 自行声明）
- id: fastp_snakemake_local
  fastp: 0.24.0（建议；自维护 fastp.smk，conda 建议 bioconda::fastp=0.24.0）
implementations:
- id: fastp_native
  path: native
  source_type: custom
  type: native
  version: 0.24.0-v1.0
  priority: high
  when_to_use: '非流程引擎场景（AI Agent Function Calling / 独立 CLI / Shell 调用）的首选目标； subworkflow/fastp_bwa_samtools
    编排器即调用本实现的 run 子命令。

    '
  container_ref:
    bioconda: https://anaconda.org/bioconda/fastp
    quay_biocontainers: quay.io/biocontainers/fastp
    install_hint: 推荐 mamba create -n <env> -c conda-forge -c bioconda <sw>；容器可用 quay.io/biocontainers
      镜像
- id: fastp_snakemake_wrappers
  path: snakemake
  source_type: official
  type: snakemake_local
  version: v3.13.0
  priority: medium
  when_to_use: 组装 Snakemake 流程、复用中央 wrapper 缓存时（官方 bio/fastp 存在，单 wrapper）。
default_implementation: fastp_native
