software: fastp
canonical: fastp
category: qc
description: 'fastp 是 DNA/RNA 短读段（Illumina）质控与预处理工具，支持接头自动检测与切除、 质量过滤、长度过滤、PolyG/PolyX
  修剪、UMI 处理、重复序列标记与 QC 报告 （HTML + JSON），单/双端 FASTQ(gz) 一步完成清洗。

  '
homepage: https://github.com/OpenGene/fastp
license: MIT
software_versions:
- id: fastp_native
  fastp: 0.24.0
  note: CONDA 路线：fastp 不在 Debian bookworm apt，容器走 debian:bookworm-slim + micromamba
    引导 bioconda env（bioconda::fastp=0.24.0 → /opt/env）；二进制 fastp。
- id: fastp_nextflow_nfcore
  module_version: 'master（2026-09-01 抓取；submodules: fastp）'
  fastp: 1.3.6
  source: bioconda::fastp=1.3.6（modules/nf-core/fastp/environment.yml）
  note: nf-core master 当前 pin fastp=1.3.6（比 native 的 0.24.0 新）；若 nf-core 回落旧 tag 则可能回到
    0.2x。
- id: fastp_snakemake_wrappers
  wrapper_tag: v3.13.0
  fastp: 1.3.6
  source: bioconda fastp=1.3.6（bio/fastp/environment.yaml，无 snakemake-wrapper-utils
    依赖）
  note: 与 nf-core 当前 pin 一致（1.3.6）；若固定 wrapper tag < v3.13，fastp 可能回落 0.2x。
- id: fastp_nextflow_local
  fastp: 未固定（用户按 main.nf 中 conda/container 自行声明）
- id: fastp_snakemake_local
  fastp: 0.24.0（建议；自维护 fastp.smk，conda 建议 bioconda::fastp=0.24.0）
implementations:
- id: fastp_native
  path: native
  source_type: custom
  type: native
  version: 0.24.0-v1.0
  priority: high
  when_to_use: '非流程引擎场景（AI Agent Function Calling / 独立 CLI / Shell 调用）的首选目标； subworkflow/fastp_bwa_samtools
    编排器即调用本实现的 run 子命令。

    '
  container_ref:
    bioconda: https://anaconda.org/bioconda/fastp
    quay_biocontainers: quay.io/biocontainers/fastp
    install_hint: 推荐 mamba create -n <env> -c conda-forge -c bioconda <sw>；容器可用 quay.io/biocontainers
      镜像
- id: fastp_snakemake_wrappers
  path: snakemake
  source_type: official
  type: snakemake_local
  version: v3.13.0
  priority: medium
  when_to_use: 组装 Snakemake 流程、复用中央 wrapper 缓存时（官方 bio/fastp 存在，单 wrapper）。
default_implementation: fastp_native
inputs:
  in1:
    type: file
    format: fastq.gz
    required: true
    cli_arg: -i
    description: 输入 R1 FASTQ(.gz)
  out1:
    type: file
    format: fastq.gz
    required: true
    cli_arg: -o
    description: 输出 R1 清洁 FASTQ(.gz)
  in2:
    type: file
    format: fastq.gz
    required: false
    cli_arg: -I
    description: 输入 R2 FASTQ(.gz)（双端模式）
  out2:
    type: file
    format: fastq.gz
    required: false
    cli_arg: -O
    description: 输出 R2 清洁 FASTQ(.gz)（双端模式）
  html:
    type: file
    format: html
    required: false
    cli_arg: -h
    description: HTML 质控报告路径
  json:
    type: file
    format: json
    required: false
    cli_arg: -j
    description: JSON 质控报告路径
  threads:
    type: integer
    default: 4
    cli_arg: --threads
    description: fastp 线程数（fastp 0.20+ 映射为 -w/--thread，勿用 -t）
  adapter_sequence:
    type: string
    required: false
    cli_arg: --adapter_sequence
    description: R1 3' 端接头序列（IUPAC 碱基；不指定时 fastp 自动检测）
  detect_adapter_for_pe:
    type: boolean
    default: false
    cli_arg: --detect_adapter_for_pe
    description: 双端模式通过 R1/R2 重叠分析检测接头（强烈建议 PE 开启）
  qualified_quality_phred:
    type: integer
    default: 15
    cli_arg: -q
    description: 合格碱基 phred 阈值（fastp 默认 15）
  unqualified_percent_limit:
    type: integer
    default: 40
    cli_arg: -u
    description: read 中不合格碱基比例上限 %（fastp 默认 40）
  length_required:
    type: integer
    default: 15
    cli_arg: -l
    description: 最短 read 长度阈值（fastp 默认 15，低于则丢弃）
  extra_args:
    type: string
    required: false
    description: 透传给 fastp 的额外参数（如 --cut_front --cut_tail --cut_right 1 --trim_poly_g），高级用法慎用
outputs:
  out1:
    type: file
    format: fastq.gz
    description: 清洗后 R1 FASTQ
  out2:
    type: file
    format: fastq.gz
    description: 清洗后 R2 FASTQ（双端模式）
  html:
    type: file
    format: html
    description: HTML 质控报告
  json:
    type: file
    format: json
    description: JSON 质控报告（含过滤统计，可被后续流程消费）
environment:
  conda: environment.yml
  dockerfile: Dockerfile
  apptainer_def: Apptainer.def
optimization:
  default_cpus: 4
  default_mem_mb: 8192
  tmpdir: /tmp
  env_vars:
    TMPDIR: '{tmpdir}'
    PYTHONUNBUFFERED: '1'
execution:
  entrypoint: python main.py
  test_command: bash test/run_test.sh
  binary: fastp
  snakemake_include_hint: '# 在 Snakefile 中：

    include: "modules/fastp/snakemake/fastp.smk"

    # 可选 config（config.yaml）：

    # fastp:

    #   adapter_sequence: "AGATCGGAAGAGCACACGTCTGA"

    #   detect_adapter_for_pe: true

    #   qualified_quality_phred: 15

    #   unqualified_percent_limit: 40

    #   length_required: 15

    #   extra: "--cut_front --cut_tail --cut_right 1"

    '
  snakemake_rules:
  - fastp.smk
