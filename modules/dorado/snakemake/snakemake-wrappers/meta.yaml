# dorado / snakemake / snakemake-wrappers 说明模块
# ---------------------------------------------------------------------------
# source_type: official —— 仅保留说明、桥接脚本与接口 Schema，不重写源码。
# 注意：官方 snakemake-wrappers 目前【没有】bio/dorado wrapper（抓取 404），
#       本目录仅登记桥接层；实际执行请使用 dorado_snakemake_local（dorado.smk）。
# ---------------------------------------------------------------------------

id: dorado_snakemake_wrappers
version: "v3.13.0"
software: dorado
type: snakemake_wrappers
source_type: official

summary: "Official Snakemake Wrappers 登记层 for dorado（官方 bio/dorado 缺失，submodules 为空；实际走 local）。"

agent_guidance:
  when_to_use: "组装 Snakemake 流程时；官方 bio/dorado wrapper 缺失，请直接使用 dorado_snakemake_local。"
  recommendation_priority: "Low（官方 wrapper 不存在；本实现仅说明层，实际路由到 snakemake_local）。"

software_versions:
  wrapper_tag: "v3.13.0"
  dorado: "官方无 wrapper（bio/dorado 404）"
  source: "—（snakemake-wrappers 仓库 bio/dorado 目录不存在）"
  note: "2026-09 抓取 https://api.github.com/repos/snakemake/snakemake-wrappers/contents/bio/dorado 返回 404；
         Snakemake 场景请使用 dorado_snakemake_local（dorado.smk，container 建议 nanoporetech/dorado:latest）。"

source_reference:
  repository: "https://github.com/snakemake/snakemake-wrappers"
  wrapper_base: "bio/dorado"
  tag: "v3.13.0"
  submodules: []
  submodules_note: >
    官方 bio/dorado 目录不存在（2026-09 抓取 404），故 submodules 为空列表。
    若未来官方新增该 wrapper，请以 https://github.com/snakemake/snakemake-wrappers/tree/master/bio/dorado
    在线目录为准刷新；当前 Snakemake 场景请使用 dorado_snakemake_local。

inputs:
  input:
    type: file
    format: [pod5, fast5]
    required: true
    description: "输入 raw 信号目录（basecall）或 FASTQ（demux）"

outputs:
  output:
    type: file
    format: [fastq]
    description: "输出 FASTQ"

params:
  extra:
    type: string
    default: ""
    description: "dorado 子命令额外参数（如 --estimate-poly-a）"

execution:
  mode: snakemake_rule
  wrapper_template: "v3.13.0/bio/dorado/{subcommand}（官方缺失，占位）"
  rule_example: |
    # 官方 wrapper 缺失 —— 直接使用本仓库自维护 rule：
    #   include: "modules/dorado/snakemake/local/dorado.smk"
    rule dorado_basecall:
        input:  "pod5/{sample}.pod5"
        output: "fastq/{sample}.fastq"
        params: model="rna004_130bps_sup@v5.1.0"
        threads: 8
        container: "docker.1ms.run/nanoporetech/dorado:latest"
