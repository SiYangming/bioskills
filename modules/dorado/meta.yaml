software: dorado
canonical: dorado
category: basecalling
description: 'Dorado 是 Oxford Nanopore 官方的高精度 basecalling 工具： dorado basecaller <model>
  <reads> 将 POD5/FAST5 原始信号转为 FASTQ（RNA 用 rna004_130bps_sup 等模型），dorado demux 按 barcode
  拆分 reads， 是 nanoseq 流程的原始数据 basecalling 环节（enable_dorado 开关）。

  '
homepage: https://github.com/nanoporetech/dorado
license: Oxford Nanopore Technologies PLC. Public License Version 1.0（研究用途；NC 部分模型另有限制）
software_versions:
- id: dorado_native
  dorado: 2.1.2
  build_route: 无官方 conda/容器（bioconda 404 已核）→ 自建容器（bookworm-slim + 官方 release 二进制）
    或宿主机直跑官方二进制（native/Dockerfile、Apptainer.def、conda-recipe 均默认 2.1.2）
  source: https://github.com/nanoporetech/dorado/releases/tag/v2.1.2（2026-08-26 发布；
    linux-x64 tar.gz 直链 https://cdn.oxfordnanoportal.com/software/analysis/dorado-2.1.2-linux-x64.tar.gz）
  note: '官方 GitHub API 2026-09-07 核实 latest=v2.1.2（非 prerelease，2026-08-26T14:09Z
    published）；2.0.0（2026-05-20）起新增 v6.0 模型，v5.x 既有模型名（如 nanoseq 默认
    rna004_130bps_sup@v5.1.0）仍受支持、首次运行本地无模型会自动下载；2.x 最低 CUDA 12.8
    （linux-arm64 12.6），纯 CPU 用 --device cpu。接口（basecall/demux 子命令 + 默认模型
    v5.1.0）与 dorado 1.x 时代 nanoseq 依赖保持一致，见 main.py 注释。'
- id: dorado_nextflow_nfcore
  module_version: —
  dorado: 官方无模块（modules/nf-core/dorado 404）
  source: —
  note: 2026-09-07 复核 https://api.github.com/repos/nf-core/modules/contents/modules/nf-core/dorado
    仍返回 404（Not Found）；Nextflow 场景请使用本地规则/流程或降级 native。
- id: dorado_snakemake_wrappers
  dorado: 官方无 wrapper（bio/dorado 404）
  source: —
  note: 2026-09-07 复核 https://api.github.com/repos/snakemake/snakemake-wrappers/contents/bio/dorado
    仍返回 404（Not Found）；Snakemake 场景请使用 dorado_snakemake_local。
- id: dorado_nextflow_local
  dorado: 未固定（用户按 main.nf 中 container 自行声明；建议 nanoporetech/dorado:latest 或 pin 版本 tag）
- id: dorado_snakemake_local
  dorado: 2.1.2
  source: 自维护 dorado_basecall.smk / dorado_demux.smk（提炼自 nanoseq config.yaml dorado 段 + dorado 官方用法）
  note: rule 内 docker 模式默认 docker.1ms.run/nanoporetech/dorado:latest（nanoseq config 默认，
    2026-09-07 核实该加速通道在网、含 latest tag），native 模式走 PATH 二进制、建议与
    dorado_native 同版 2.1.2；dorado 不在 bioconda，无 conda env。
implementations:
- id: dorado_native
  path: native
  source_type: custom
  type: native
  version: "2.1.2"
  priority: high
  when_to_use: '非流程引擎场景（AI Agent Function Calling / 独立 CLI / Shell 调用）的首选目标。 覆盖 basecall
    / demux 子命令，自动注入线程（--device cuda:all 可选）。

    '
  container_ref:
    bioconda: 官方无 dorado 包（anaconda.org/bioconda/dorado 404，2026-09-07 复核）
    quay_biocontainers: quay.io/biocontainers 无 dorado 官方镜像（bioconda 自动构建链不存在）
    bioinfortools: quay.io/bioinfortools/dorado:1.3.0（社区镜像；quay API 2026-09-07 核实 tags
      仅 1.3.0 / 1.3.0-cuda12.2.0-no_model / latest(→no_model)，镜像停更于 1.3.0）
    hcc: https://anaconda.org/channels/HCC/packages/dorado/overview（HCC 第三方频道 dorado=0.7.2，
      仅 linux-64，2024-06 最后更新，版本陈旧；HCC 为内布拉斯加大学机构频道、非个人频道）
    yangmingsi: https://anaconda.org/channels/YangmingSi/packages/dorado/overview（自建频道
      dorado=1.3.0，linux-64 + osx-arm64，2025-11；2.1.2 重建配方归档于
      native/conda-recipe/linux-64/meta.yaml，回填官方 sha 并 anaconda upload 后升级）
    dockerhub: 官方镜像 nanoporetech/dorado（Docker Hub 仓库，tag 以 hub 页为准；国内加速
      docker.1ms.run/nanoporetech/dorado:latest 为 nanoseq config 默认，2026-09-07 核实该
      加速通道在网、latest 可拉）
    install_hint: 宿主机直跑官方二进制（README「二进制包安装」下载 2.1.2 linux-x64 tar.gz）或
      docker run 官方镜像（须 -u $(id -u):$(id -g)）；conda 仅 YangmingSi/HCC 的陈旧版
      （1.3.0 / 0.7.2）；本模块自建容器配方（Dockerfile / Apptainer.def）与 conda-recipe
      见 environment / native/conda-recipe
- id: dorado_snakemake_local
  path: snakemake
  source_type: custom
  type: snakemake_local
  version: "2.1.2"
  priority: medium
  when_to_use: 组装 Snakemake 流程时 include 本模块 snakemake/dorado_{basecall,demux}.smk 本地规则。
  note: 官方 snakemake-wrappers 无 bio/dorado wrapper（2026-09-07 复核 404），本地规则为唯一
    Snakemake 路线（rule 内 docker 默认 nanoporetech/dorado:latest、native 走 PATH 二进制
    2.1.2；dorado 不在 bioconda，无 conda env），详见 software_versions。
default_implementation: dorado_native
inputs:
  subcommand:
    type: string
    required: true
    description: dorado 子命令：basecall|demux
  model:
    type: string
    required: true
    cli_arg: positional
    description: basecall 模型（如 rna004_130bps_sup@v5.1.0 / 本地模型目录）
  reads:
    type: file
    required: true
    cli_arg: positional
    description: 输入 raw 信号目录或文件（POD5/FAST5，basecall）
  output:
    type: file
    required: false
    cli_arg: -o
    description: 输出文件/目录（basecall 用 --output-dir；demux 用 --output-dir）
  emit_fastq:
    type: boolean
    default: true
    cli_arg: --emit-fastq
    description: 输出 FASTQ（basecall；nanoseq 默认开启）
  device:
    type: string
    required: false
    cli_arg: --device
    description: 计算设备（cuda:all / cuda:0 / cpu；默认自动）
  demux_kit:
    type: string
    required: false
    cli_arg: --kit-name
    description: demux 的 barcode 试剂盒名（如 SQK-RNA004-24）
  threads:
    type: integer
    default: 4
    cli_arg: --num-workers
    description: 线程数（自动注入）
  extra_args:
    type: string
    required: false
    description: 透传给 dorado 的额外参数（高级用法，慎用）
outputs:
  fastq:
    type: file
    format: fastq
    description: basecall 输出的 FASTQ 文件
  demuxed_fastq:
    type: file
    format: fastq
    description: demux 输出的拆分 FASTQ（按 barcode）
environment:
  # conda: —（dorado 不在 bioconda；YangmingSi/HCC 频道版本陈旧。容器走 apt 运行时 + 官方二进制，
  #   本地安装用官方二进制/容器，配方见 native/Dockerfile、Apptainer.def、conda-recipe/linux-64）
  dockerfile: Dockerfile
  apptainer_def: Apptainer.def
optimization:
  default_cpus: 4
  default_mem_mb: 16384
  tmpdir: /tmp
  env_vars:
    TMPDIR: '{tmpdir}'
    PYTHONUNBUFFERED: '1'
  per_subcommand_threads:
    basecall: 8
    demux: 4
    default: 4
execution:
  entrypoint: python main.py
  test_command: bash test/run_test.sh
  binary: dorado
  snakemake_include_hint: |-
    # 在 Snakefile 中（每 rule 一单规则文件；dorado 不在 bioconda，无同目录 conda env，
    # docker 模式走 rule container + --use-container，native 走 PATH 二进制）：
    include: "modules/dorado/snakemake/dorado_basecall.smk"
    include: "modules/dorado/snakemake/dorado_demux.smk"
    # config 契约与独立运行示例见各 .smk 头部，例如：
    #   snakemake -s modules/dorado/snakemake/dorado_basecall.smk \
    #       --config dorado_input_pod5=pod5/ dorado_fastq=basecall.fastq --cores 8
    # 顶层键：dorado_input_pod5 / dorado_fastq / dorado_input_reads / dorado_demux_outdir /
    #   threads / exec_mode(native|docker)；
    # 软件段（config.yaml 预设）：dorado.{docker_image,model,kit_name,extra_params}
    # 版本：native PATH 二进制建议 2.1.2；docker 默认 docker.1ms.run/nanoporetech/dorado:latest
    #   （模型 rna004_130bps_sup@v5.1.0 目录名在 dorado 2.x 仍受支持，首次运行自动下载）
  snakemake_rules:
  - dorado_basecall.smk
  - dorado_demux.smk
