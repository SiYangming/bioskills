# gstama 软件级总览元数据
# ---------------------------------------------------------------------------
# 汇总本软件在技能库中的所有可用实现类型与推荐优先级。
# 上层 Agent 通过本文件快速判断：该软件是否已收录、应优先走哪条实现路径。
# 实现路径结构：
#   modules/<software>/
#   ├── native/
#   ├── nextflow/nf-core/    # 官方 nf-core/modules（source_type: official）
#   │       local/            # 自定义 Nextflow 模块（source_type: custom）
#   └── snakemake/snakemake-wrappers/  # 官方 snakemake-wrappers（official）
#           local/              # 自定义 Snakemake 实现（source_type: custom）
# ---------------------------------------------------------------------------

software: gstama
canonical: gstama
category: transcriptome
description: >
  TAMA（Gene-Switch Transcriptome Annotation by Modular Algorithms）是一套长读长
  （Iso-Seq / ONT）转录组注释工具：tama_flnc_polya_cleanup.py 做 polyA 清理，
  tama_collapse.py 做转录本去冗余（collapse），tama_merge.py 合并多来源转录本集合。
  本库以 bioconda 包名 gs-tama 登记，canonical 目录名为 gstama（与 nf-core 一致）。

homepage: https://github.com/sguizard/gs-tama
license: GPL-3.0-or-later

# ---------------------------------------------------------------------------
# 【必填】版本差异声明：native / nf-core / snakemake-wrappers 的上游二进制版本可能不同
# （gs-tama 只有 bioconda 路线，apt 无此包）。
# 此字段让 Agent 在跨引擎迁移时一眼看到风险点。
# ---------------------------------------------------------------------------
software_versions:
  native:
    gstama: "1.0.3"
    build_route: "CONDA（bioconda gs-tama=1.0.3，包提供 tama_flnc_polya_cleanup.py / tama_collapse.py / tama_merge.py）"
    source: "bioconda::gs-tama=1.0.3（Dockerfile/Apptainer 用 micromamba 引导，禁止 miniconda）"
    note: "apt 无 gs-tama 包，故 native 容器走 micromamba + bioconda env 路线；python 驱动 main.py 由 env python 运行。"
  nextflow_nfcore:
    gstama: "1.0.3"
    module_version: "master@68566f0（modules/nf-core/gstama/collapse）"
    source: "bioconda::gs-tama=1.0.3（modules/nf-core/gstama/*/environment.yml）"
    note: "nf-core 拆分为 collapse / merge / polyacleanup 三个子模块；升级 modules 时请同步刷新。"
  nextflow_local:
    gstama: "（继承 native 容器或显式 pin；未启用则写占位）"
  snakemake_wrappers:
    gstama: "（官方 bio/gstama 不存在，404）"
    wrapper_tag: "v3.13.0"
    source: "（无 environment.yaml 可对齐——官方 snakemake-wrappers 仓库无 bio/gstama 目录）"
    note: "bio/gstama 返回 404，本实现为说明性空登记；实际使用请走 native 或 snakemake/local。"
  snakemake_local:
    gstama: "（继承 native 容器或显式 pin；未启用则写占位）"

# 可用实现清单（按推荐优先级排序）
implementations:
  - id: gstama_native
    path: native
    source_type: custom
    type: native
    version: "1.0.3-v1.0"
    priority: high
    when_to_use: >
      非流程引擎场景（AI Agent Function Calling / 独立 CLI / Shell 调用）的首选目标，
      实现 polyacleanup / collapse / filelist / merge 四个子命令。

  - id: gstama_nextflow_nfcore
    path: nextflow/nf-core
    source_type: official
    type: nextflow_nfcore
    version: "master@68566f0"
    priority: medium
    when_to_use: 组装 Nextflow DSL2 流程、目标为 HPC/Cloud 时。

  - id: gstama_nextflow_local
    path: nextflow/local
    source_type: custom
    type: nextflow_local
    version: ""
    priority: low
    when_to_use: nf-core 子模块缺失或需要本地定制的 Nextflow 模块。

  - id: gstama_snakemake_wrappers
    path: snakemake/snakemake-wrappers
    source_type: official
    type: snakemake_wrappers
    version: "v3.13.0"
    priority: medium
    when_to_use: 组装 Snakemake 流程、复用中央 wrapper 缓存时（注意：官方 bio/gstama 不存在，实际需降级 local/native）。

  - id: gstama_snakemake_local
    path: snakemake/local
    source_type: custom
    type: snakemake_local
    version: "1.0.0"
    priority: low
    when_to_use: snakemake-wrappers 缺失（gstama 必缺）或需要本地定制的 Snakemake rule。

# 默认推荐路径（Agent 路由用）
default_implementation: gstama_native
