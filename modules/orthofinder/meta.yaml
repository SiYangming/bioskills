software: orthofinder
canonical: orthofinder
category: comparative_genomics
description: 'OrthoFinder（v2.5.5）是 OrthoMCL 的现代继任者：一条命令完成同源基因聚类全流程——
  推断直系同源群（orthogroups）、orthologues、基因树、有根物种树、基因复制事件
  （orthofinder -f input_proteins -S diamond -t 8），比 OrthoMCL 快 10-100 倍、准确性更高、
  无需 MySQL 数据库，是常用的同源基因聚类工具。输入为每物种一个蛋白 FASTA 的目录。

  '
homepage: https://github.com/davidemms/OrthoFinder
license: GPL-3.0-only
software_versions:
- id: orthofinder_native
  orthofinder: '2.5.5'
  build_route: official biocontainer（quay.io/biocontainers/orthofinder / depot.galaxyproject.org）
  source: https://anaconda.org/bioconda/orthofinder
  note: '官方镜像优先（bioconda→quay.io/biocontainers→depot.galaxyproject.org），本地不再自建容器；
    官方 release（tag 2.5.5）提供两种资产：OrthoFinder.tar.gz（含依赖的 standalone 包）与
    OrthoFinder_source.tar.gz（源码，sha256 43d034a66a13adba8872a0d4a76e32c25305a7fae638754adb61c37a3f957bd9，
    取自 bioconda-recipes orthofinder 2.5.5 配方）；宿主机直跑 main.py 时用 conda/mamba 安装
    orthofinder=2.5.5。'
- id: orthofinder_nextflow_nfcore
  module_version: nf-core master（2026-09）
  orthofinder: '3.1.3'
  source: bioconda::orthofinder=3.1.3（modules/nf-core/orthofinder/environment.yml）
  note: 'nf-core 有单模块 modules/nf-core/orthofinder（无子目录），pin bioconda::orthofinder=3.1.3
    （与 native 登记的 2.5.5 相差 major；正交流程迁移时请核对 -M/-S 等参数兼容性）。'
- id: orthofinder_snakemake_wrappers
  orthofinder: 官方无 wrapper（bio/orthofinder 404）
  source: —
  note: 2026-09 抓取 https://raw.githubusercontent.com/snakemake/snakemake-wrappers/master/bio/orthofinder
    返回 404；Snakemake 场景无官方 wrapper，需自定义。
- id: orthofinder_nextflow_local
  orthofinder: "未启用（需要时在 main.nf 中 shell: 调 native/main.py run）"
- id: orthofinder_snakemake_local
  orthofinder: "未启用（需要时在 .smk 中 shell: 调 native/main.py run）"
implementations:
- id: orthofinder_native
  path: native
  source_type: custom
  type: native
  version: "2.5.5"
  priority: high
  when_to_use: '非流程引擎场景（AI Agent Function Calling / 独立 CLI / Shell 调用）的首选目标。
    覆盖 run（全流程同源聚类）/ resume（从既有结果续跑）/ help 三段，自动注入线程（-t/-a）。
    新项目做同源基因聚类请用本模块替代已停止维护的 orthomcl。
    '
  container_ref:
    bioconda: https://anaconda.org/bioconda/orthofinder
    quay_biocontainers: quay.io/biocontainers/orthofinder
    install_hint: 推荐 mamba create -n <env> -c conda-forge -c bioconda orthofinder=2.5.5；容器可用 quay.io/biocontainers/orthofinder:2.5.5--hdfd78af_2 镜像（tag 见 README）
default_implementation: orthofinder_native
inputs:
  subcommand:
    type: string
    required: true
    description: orthofinder 子命令：run（全流程）| resume（续跑）| help
  proteomes_dir:
    type: file
    required: false
    cli_arg: -f
    description: run：输入目录，每物种一个蛋白 FASTA 文件（文件名即物种名）
  previous_results_dir:
    type: file
    required: false
    cli_arg: -b
    description: resume：包含上次 WorkingDirectory 的结果目录（-b）
  output_dir:
    type: file
    required: false
    cli_arg: -o
    description: run：非默认输出目录（-o）
  name:
    type: string
    required: false
    cli_arg: -n
    description: run：结果目录名后缀（-n）
  search:
    type: string
    default: diamond
    cli_arg: -S
    description: 序列搜索程序（-S；默认 diamond，可选 blast 等）
  method:
    type: string
    required: false
    cli_arg: -M
    description: 基因树推断方法（-M；dendroblast 快速 / msa 多序列比对，默认 dendroblast）
  inflation:
    type: float
    required: false
    cli_arg: -I
    description: MCL inflation 参数（-I；OrthoFinder 默认 1.5）
  msa_program:
    type: string
    required: false
    cli_arg: -A
    description: MSA 程序（-A，需 -M msa；默认 mafft）
  tree_program:
    type: string
    required: false
    cli_arg: -T
    description: 基因树推断程序（-T，需 -M msa；默认 fasttree）
  species_tree:
    type: file
    required: false
    cli_arg: -s
    description: 用户指定的有根物种树（-s，Newick 格式）
  orthoxml:
    type: file
    required: false
    cli_arg: -x
    description: OrthoXML 输出所需信息文件（-x）
  dna:
    type: boolean
    default: false
    cli_arg: -d
    description: 输入为 DNA 序列（-d）
  only:
    type: string
    required: false
    description: 提前停止（-op 仅准备 / -og 仅到 orthogroups / -os 仅序列 / -oa 仅比对 / -ot 仅基因树）
  threads:
    type: integer
    default: 8
    cli_arg: -t
    description: 线程数（同时注入 -t 与 -a）
  extra_args:
    type: string
    required: false
    description: 透传给 orthofinder 的额外参数（高级用法，慎用）
outputs:
  results_dir:
    type: file
    description: 'OrthoFinder 结果目录：Orthogroups/（Orthogroups.tsv / Orthogroups_SingleCopyOrthologues.txt）、
      Gene_Trees/、Species_Tree/、Comparative_Genomics_Statistics/、Single_Copy_Orthologue_Sequences/ 等'
  working_directory:
    type: file
    description: 结果目录内 WorkingDirectory（供 resume 续跑）
environment:
  container_official: quay.io/biocontainers/orthofinder（bioconda 官方镜像；tag 以 quay / depot.galaxyproject.org 为准，见 README「容器与 Conda 链接」）
  note: 官方镜像已覆盖（bioconda → quay.io/biocontainers/orthofinder → depot.galaxyproject.org），本地不再维护 Dockerfile/Apptainer.def；宿主机直跑 main.py 时用 conda/mamba 安装 orthofinder。
optimization:
  default_cpus: 8
  default_mem_mb: 16384
  tmpdir: /tmp
  env_vars:
    TMPDIR: '{tmpdir}'
  per_subcommand_threads:
    run: 8
    resume: 8
    help: 1
    default: 8
execution:
  entrypoint: python main.py
  test_command: bash test/run_test.sh
  binary: orthofinder
