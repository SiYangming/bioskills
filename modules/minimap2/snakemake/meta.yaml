---
id: minimap2_snakemake_local
version: 1.0.0
software: minimap2
type: snakemake_local
source_type: custom
summary: Custom Snakemake rule for minimap2 align（从 isoseq.smk 迁移，自包含无 helper 依赖）。
agent_guidance:
  when_to_use: snakemake-wrappers 缺失、或需要本地定制 minimap2 rule / 资源配置时使用。
  recommendation_priority: Low（snakemake-wrappers / native 优先）。
  enabled: true
software_versions:
  minimap2: 2.28（流程原配）
  source: 从 snakemake.smk/isoseq.smk（quay.io/biocontainers/minimap2:2.28--h577a1d6_4）迁移
  note: rule 未固定 conda/container 时，由执行环境提供 minimap2 + samtools；建议与 native 的 2.24 或流程原配
    2.28 对齐。
inputs:
  reads:
    type: file
    format:
    - fasta
    - fasta.gz
    required: true
    description: 输入 FLNC reads（如 <sample>.chunk<N>_gstama.fa.gz）
  reference:
    type: file
    format:
    - fasta
    required: true
    description: 参考基因组 FASTA
outputs:
  bam:
    type: file
    format: bam
    description: 排序后的比对 BAM
  bai:
    type: file
    format: bai
    description: BAM 索引
  versions:
    type: file
    pattern: versions.yml
    description: minimap2 版本信息
execution:
  mode: snakemake_rule
  rule_files:
  - minimap2_align.smk
  - minimap2.smk
  wrapper_template: ''
  rule_example: 'include: "modules/minimap2/snakemake/minimap2_align.smk"'
