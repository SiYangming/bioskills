# minimap2 / snakemake / snakemake-wrappers 说明模块
# ---------------------------------------------------------------------------
# source_type: official —— 仅保留说明、桥接脚本与接口 Schema，不重写源码。
# 本目录为说明 + Schema；真正执行需 Snakemake 运行时联网或本地缓存解析 wrapper 路径。
# ---------------------------------------------------------------------------

id: minimap2_snakemake_wrappers
version: "v3.13.0"
software: minimap2
type: snakemake_wrappers
source_type: official

summary: "Official Snakemake Wrappers for minimap2 (bio/minimap2/* 全子模块清单 + 使用参考)."

agent_guidance:
  when_to_use: "组装 Snakemake 流程、复用中央 wrapper 缓存时，直接引用 wrapper 路径。"
  recommendation_priority: "Medium（Snakemake 流程引擎场景使用；CLI/Agent 直调请走 native）。"

# 版本对齐：本实现 meta.version 记录 snakemake-wrappers 仓库 tag；
# minimap2 上游二进制版本以各子模块 environment.yaml 中的 conda pin 为准。
software_versions:
  wrapper_tag: "v3.13.0"
  minimap2: "2.31"
  samtools: "1.24"
  wrapper_utils: "0.9.0"
  source: "bioconda minimap2=2.31 + samtools=1.24 + snakemake-wrapper-utils=0.9.0（bio/minimap2/aligner/environment.yaml）"
  note: "bio/minimap2 仅含 aligner / index 两个 wrapper；若引用更旧 wrapper tag，minimap2 可能回落到 2.24–2.28 区间。"

source_reference:
  repository: "https://github.com/snakemake/snakemake-wrappers"
  wrapper_base: "bio/minimap2"
  tag: "v3.13.0"
  submodules:
    - "aligner"
    - "index"
  submodules_note: >
    子模块列表以 https://github.com/snakemake/snakemake-wrappers/tree/master/bio/minimap2
    在线目录为准（2026-08 抓取）；若需要缺失的参数，请降级使用 minimap2_snakemake_local。

inputs:
  reads:
    type: file
    format: [fasta, fastq, fasta.gz, fastq.gz]
    required: true
    description: "输入 reads（aligner wrapper）"
  reference:
    type: file
    format: [fasta]
    required: true
    description: "参考 FASTA（aligner 的 reference / index 的输入）"

outputs:
  output:
    type: file
    format: [bam, sam, paf, mmi]
    description: "输出文件（依 wrapper 而定：aligner 为 bam/sam/paf；index 为 .mmi）"

params:
  extra:
    type: string
    default: ""
    description: "子命令额外参数（wrapper.py 中统一拼接）"

execution:
  mode: snakemake_rule
  wrapper_template: "v3.13.0/bio/minimap2/{subcommand}"
  rule_example: |
    rule minimap2_aligner:
        input:
            reads:  "reads/{sample}.fa"
            reference: "ref/ref.fa"
        output:
            bam:    "aln/{sample}.bam"
        log:       "logs/minimap2/aligner/{sample}.log"
        params:
            extra: "-x splice -uf -k14"
        threads: 8
        wrapper: "v3.13.0/bio/minimap2/aligner"
