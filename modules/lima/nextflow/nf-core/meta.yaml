# lima / nextflow / nf-core 说明模块
# ---------------------------------------------------------------------------
# source_type: official —— 仅保留说明、接口 Schema 与引用，不重写源码。
# 本目录为说明 + Schema；真正执行需在项目内安装官方 nf-core 子模块。
# ---------------------------------------------------------------------------

id: lima_nextflow_nfcore
version: "1.0.0"
software: lima
type: nextflow_nfcore
source_type: official

summary: "Official nf-core process for lima (modules/nf-core/lima 单模块：reads+primers -> 去引物 demux reads)."

agent_guidance:
  when_to_use: "组装 Nextflow DSL2 流程、目标为 HPC/Cloud 时，直接 include 对应子模块。"
  recommendation_priority: "Medium（Nextflow 流程引擎场景使用；CLI/Agent 直调请走 native）。"

# 版本对齐：本实现 meta.version 记录 nf-core/modules lima 家族版本；
# lima 上游二进制版本以子模块 environment.yml 中的 conda pin 为准。
software_versions:
  module_version: "1.0.0"
  lima: "2.9.0"
  source: "bioconda::lima=2.9.0（modules/nf-core/lima/environment.yml）"
  note: "nf-core lima 为单模块（不分子命令），environment.yml pin 为 bioconda::lima=2.9.0；
         container 由 community.wave.seqera.io 按该 env 生成；bump 模块后请同步刷新本文件。"

source_reference:
  repository: "https://github.com/nf-core/modules"
  modules_base: "modules/nf-core/lima"
  submodules:
    - "lima"
  submodules_note: >
    nf-core lima 是单模块（目录下仅 environment.yml / main.nf / meta.yml / tests，无子目录），
    此处保留 1 条 "lima" 作为统一 submodules 字段以兼容扫描/文档。
    列表以 https://github.com/nf-core/modules/tree/master/modules/nf-core/lima 在线目录为准。

inputs:
  meta:
    type: map
    description: "Groovy 样本元信息，如 [ id:'sample1' ]"
  ccs:
    type: file
    format: [bam, fasta, fasta.gz, fastq, fastq.gz]
    required: true
    description: "A BAM or fasta or fasta.gz or fastq or fastq.gz file of subreads or ccs"
  primers:
    type: file
    format: fasta
    required: true
    description: "Fasta file, sequences of primers"

outputs:
  bam:
    type: file
    format: bam
    description: "A bam file of ccs purged of primers"
  pbi:
    type: file
    format: pbi
    description: "Pacbio index file of ccs purged of primers"
  xml:
    type: file
    format: xml
    description: "DataSet xml（*.xml）"
  json:
    type: file
    format: json
    description: "A metadata json file"
  clips:
    type: file
    format: fasta
    description: "A fasta file of clipped primers（*.clips）"
  counts:
    type: file
    format: txt
    description: "A tabulated file of pairs of primers（*.counts）"
  guess:
    type: file
    format: txt
    description: "Second tabulated file of primer pairs（*.guess）"
  report:
    type: file
    format: txt
    description: "Per-ZMW report（*.report）"
  summary:
    type: file
    format: txt
    description: "Filter summary（*.summary）"
  fasta:
    type: file
    format: fasta
    description: "A fasta file of ccs purged of primers（*.fa）"
  fastagz:
    type: file
    format: fasta.gz
    description: "A fasta.gz file of ccs purged of primers"
  fastq:
    type: file
    format: fastq
    description: "A fastq file of ccs purged of primers"
  fastqgz:
    type: file
    format: fastq.gz
    description: "A fastq.gz file of ccs purged of primers"
  versions:
    type: file
    pattern: "versions.yml"
    description: "nf-core 标准版本文件"

execution:
  mode: nextflow_include
  include_statement: "include { LIMA } from './modules/nf-core/lima/main'"
  include_pattern: "include { LIMA } from './modules/nf-core/lima/main'"
  container: "community.wave.seqera.io/library/lima:2.9.0--h9ee0642_0"
  setup_hint: |
    在项目仓库根执行：
      nf modules install nf-core lima
    本目录仅提供 include 参考与统一 Schema，不重写官方源码；
    若官方缺失 / 需定制，请使用 ../local/。
