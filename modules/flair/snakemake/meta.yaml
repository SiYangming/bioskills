# flair / snakemake / local — 自维护 Snakemake rule
# ---------------------------------------------------------------------------
# source_type: custom —— 规则迁移自 snakemake.smk/nanoseq.smk/nanoseq.sh/run_flair_consensus.sh，
# 去掉对脚本内绝对路径/后台运行封装（nohup/PID/LOCK）的依赖，参数内联。
# 适用场景：官方 snakemake-wrappers 无 bio/flair（当前正是如此）。
# ---------------------------------------------------------------------------

id: flair_snakemake_local
version: "0.1.0"
software: flair
type: snakemake_local
source_type: custom

summary: "Self-maintained Snakemake rules for flair (迁移自 nanoseq.sh/run_flair_consensus.sh 三段链路：bam2bed12/annotate/collapse，官方 wrapper 缺失时的执行路径)."

agent_guidance:
  when_to_use: "Snakemake 流程中需要 FLAIR isoform 分析（BAM->Bed12->注释->collapse）时；官方 bio/flair wrapper 不存在，本 rule 为 Snakemake 场景主路径。"
  recommendation_priority: "Medium（Snakemake 流程引擎场景；CLI/Agent 直调请走 native）。"
  enabled: true

software_versions:
  flair: "3.0.0b1"
  source: "自维护 flair.smk（迁移自 snakemake.smk/nanoseq.smk/nanoseq.sh/run_flair_consensus.sh；conda 建议 bioconda::flair=3.0.0b1 + minimap2）"
  note: "原脚本用 nohup 后台运行 + 绝对路径（$HOME/miniconda3/envs/flair）；迁移后由 Snakemake 调度，命令参数内联，flair collapse 保留 --trust_ends/--remove_internal_priming/--stringent/--check_splice/--mm2_args 等 direct RNA-seq 优化参数。"

inputs:
  bam:
    type: file
    format: bam
    required: true
    description: "输入 sorted BAM（路径模板 alignment/{sample}.sorted.bam）"
  genome:
    type: file
    format: fasta
    required: true
    description: "参考基因组 FASTA"
  reads:
    type: file
    format: fastq.gz
    required: true
    description: "原始 reads（collapse 使用）"

outputs:
  bed12:
    type: file
    format: bed12
    description: "bam2bed12 输出（BED12）"
  annotated_bed:
    type: file
    format: bed
    description: "annotate 输出（带基因注释 BED）"
  collapse_fasta:
    type: file
    format: fasta
    description: "flair collapse 输出（一致性转录本 FASTA）"
  counts:
    type: file
    format: txt
    description: "isoform 计数文件"

execution:
  mode: snakemake_rule
  rule_files:
    - "flair.smk"
  include_hint: |
    # 在 Snakefile 中：
    include: "modules/flair/snakemake/flair.smk"
  conda_hint: "rule 内 conda 指向 envs/flair.yaml（内容：bioconda::flair=3.0.0b1 + minimap2）"
