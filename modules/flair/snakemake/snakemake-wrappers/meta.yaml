# flair / snakemake / snakemake-wrappers 说明模块
# ---------------------------------------------------------------------------
# source_type: official —— 仅保留说明、桥接脚本与接口 Schema，不重写源码。
# 注意：官方 snakemake-wrappers 目前【没有】bio/flair wrapper（抓取 404），
#       本目录仅登记桥接层；实际执行请使用 flair_snakemake_local（flair.smk）。
# ---------------------------------------------------------------------------

id: flair_snakemake_wrappers
version: "v3.13.0"
software: flair
type: snakemake_wrappers
source_type: official

summary: "Official Snakemake Wrappers 登记层 for flair（官方 bio/flair 缺失，submodules 为空；实际走 local）。"

agent_guidance:
  when_to_use: "组装 Snakemake 流程时；官方 bio/flair wrapper 缺失，请直接使用 flair_snakemake_local。"
  recommendation_priority: "Low（官方 wrapper 不存在；本实现仅说明层，实际路由到 snakemake_local）。"

software_versions:
  wrapper_tag: "v3.13.0"
  flair: "官方无 wrapper（bio/flair 404）"
  source: "—（snakemake-wrappers 仓库 bio/flair 目录不存在）"
  note: "2026-09 抓取 https://api.github.com/repos/snakemake/snakemake-wrappers/contents/bio/flair 返回 404；
         Snakemake 场景请使用 flair_snakemake_local（flair.smk，pin bioconda::flair=3.0.0b1 + minimap2）。"

source_reference:
  repository: "https://github.com/snakemake/snakemake-wrappers"
  wrapper_base: "bio/flair"
  tag: "v3.13.0"
  submodules: []
  submodules_note: >
    官方 bio/flair 目录不存在（2026-09 抓取 404），故 submodules 为空列表。
    若未来官方新增该 wrapper，请以 https://github.com/snakemake/snakemake-wrappers/tree/master/bio/flair
    在线目录为准刷新；当前 Snakemake 场景请使用 flair_snakemake_local。

inputs:
  input:
    type: file
    format: [bam]
    required: true
    description: "输入 sorted BAM"

outputs:
  output:
    type: file
    format: [fasta]
    description: "输出一致性转录本 FASTA"

params:
  extra:
    type: string
    default: ""
    description: "flair 子命令额外参数（如 --intprimingthreshold 30 --stringent）"

execution:
  mode: snakemake_rule
  wrapper_template: "v3.13.0/bio/flair/{subcommand}（官方缺失，占位）"
  rule_example: |
    # 官方 wrapper 缺失 —— 直接使用本仓库自维护 rule：
    #   include: "modules/flair/snakemake/local/flair.smk"
    rule flair_collapse:
        input:  "annotated/{sample}.annotated.bed", genome="ref/hg38.fa", reads="fastq/{sample}.fastq.gz"
        output: "consensus/{sample}.flair.collapse.fasta"
        params: gtf="ref/gencode.v49.annotation.gtf", min_support=3, end_window=100, intpriming_threshold=30
        threads: 8
        conda: "envs/flair.yaml"   # bioconda::flair=3.0.0b1 + minimap2
