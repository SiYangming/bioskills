software: flair
canonical: flair
category: transcriptome
description: 'FLAIR（Full-Length Alternative Isoform analysis of RNA）是 Nanopore / PacBio
  long-read RNA-seq 的 isoform 分析工具：bam2Bed12 转剪接结构、identify_gene_isoform 做基因注释、flair
  collapse 聚类去冗余生成一致性转录本（含 --trust_ends / --remove_internal_priming / --stringent
  / --check_splice 等 direct RNA-seq 优化参数）， 是 nanoseq 流程的转录本重建核心。

  '
homepage: https://github.com/BrooksLabUCSC/flair
license: GPL-3.0-only
software_versions:
- id: flair_native
  flair: 3.0.0b1
  build_route: official biocontainer（quay.io/biocontainers/flair / depot.galaxyproject.org）
  source: https://anaconda.org/bioconda/flair
  note: 官方镜像优先（bioconda→quay.io/biocontainers→depot.galaxyproject.org），本地不再自建容器；
    flair=3.0.0b1；conda 包提供三个可执行：flair / bam2Bed12 / identify_gene_isoform；flair collapse
    内部依赖 minimap2（宿主机用 conda/mamba 装环境时一并安装）。
- id: flair_nextflow_nfcore
  module_version: —
  flair: 官方无模块（modules/nf-core/flair 404）
  source: —
  note: 2026-09 抓取 https://api.github.com/repos/nf-core/modules/contents/modules/nf-core/flair
    返回 404；Nextflow 场景请使用 flair_nextflow_local 或降级 native。
- id: flair_snakemake_wrappers
  flair: 官方无 wrapper（bio/flair 404）
  source: —
  note: 2026-09 抓取 https://api.github.com/repos/snakemake/snakemake-wrappers/contents/bio/flair
    返回 404；Snakemake 场景请使用 flair_snakemake_local。
- id: flair_nextflow_local
  flair: 未固定（用户按 main.nf 中 conda/container 自行声明）
- id: flair_snakemake_local
  flair: 3.0.0b1
  minimap2: '2.30'
  bedtools: '>=2.31.1'
  source: 自维护 flair_bam2bed12.smk / flair_annotate.smk / flair_collapse.smk（+ 同目录 flair.yaml 与各规则 wrapper .py）
  note: 每 rule 一 .smk、config 驱动（td2 式）；conda 指向同目录 flair.yaml（bioconda::flair=3.0.0b1
    + minimap2==2.30，bedtools 供 bam2bed12 规则的 bedtools bamtobed 路线）；三个 wrapper 规则
    （bam2bed12/annotate/collapse）均经共享 modules/docker_wrapper.py 支持 exec_mode 三模式分派。
implementations:
- id: flair_native
  path: native
  source_type: custom
  type: native
  version: "3.0.0b1"
  priority: high
  when_to_use: '非流程引擎场景（AI Agent Function Calling / 独立 CLI / Shell 调用）的首选目标。 覆盖 bam2bed12
    / annotate / collapse 三段链路，自动注入线程。

    '
  container_ref:
    bioconda: https://anaconda.org/bioconda/flair
    quay_biocontainers: quay.io/biocontainers/flair
    bioinfortools: quay.io/bioinfortools/flair:2.2.0（社区镜像，源自 brookslab/flair 官方 Docker；仅历史 2.2.0 备选，
      模块当前官方线为 bioconda 3.0.0b1，见 README）
    install_hint: 推荐 mamba create -n <env> -c conda-forge -c bioconda <sw>；容器可用 quay.io/biocontainers
      镜像
- id: flair_snakemake_local
  path: snakemake
  source_type: custom
  type: snakemake_local
  version: "3.0.0b1"
  priority: medium
  when_to_use: 组装 Snakemake 流程时 include 本模块 snakemake/flair_{bam2bed12,annotate,collapse}.smk 本地规则。
  note: 官方 snakemake-wrappers 无 bio/flair wrapper（2026-09 抓取 404），本地规则为唯一 Snakemake 路线
    （conda env：flair.yaml，bioconda::flair=3.0.0b1 + minimap2==2.30 + bedtools），详见 software_versions。
default_implementation: flair_native
inputs:
  subcommand:
    type: string
    required: true
    description: flair 子命令：bam2bed12|annotate|collapse
  input:
    type: file
    required: false
    cli_arg: positional
    description: 主输入文件（bam2bed12 的 sorted BAM / annotate 的 bed12 / collapse 的 annotated
      bed）
  output:
    type: file
    required: false
    cli_arg: positional
    description: 输出文件（annotate 的 annotated bed；collapse 的输出前缀 prefix）
  gtf:
    type: file
    required: false
    cli_arg: -f
    description: 参考注释 GTF（annotate/collapse 使用）
  genome:
    type: file
    required: false
    cli_arg: -g
    description: 参考基因组 FASTA（collapse 使用）
  reads:
    type: file
    required: false
    cli_arg: -r
    description: 原始 reads FASTQ/FASTA（collapse 使用）
  prefix:
    type: string
    required: false
    description: collapse 输出前缀（默认 <sample>，生成 <prefix>.flair.collapse.fasta 等）
  min_support:
    type: integer
    default: 3
    cli_arg: -s
    description: 最小 read 支持数（collapse）
  end_window:
    type: integer
    default: 100
    cli_arg: -w
    description: 3'/5' 端窗口大小（collapse）
  intpriming_threshold:
    type: integer
    default: 30
    cli_arg: --intprimingthreshold
    description: 内部加尾修剪阈值（collapse，配合 --remove_internal_priming）
  trust_ends:
    type: boolean
    default: true
    cli_arg: --trust_ends
    description: 信任 read 末端（collapse）
  remove_internal_priming:
    type: boolean
    default: true
    cli_arg: --remove_internal_priming
    description: 去除内部加尾（collapse）
  stringent:
    type: boolean
    default: true
    cli_arg: --stringent
    description: 严格模式（collapse）
  check_splice:
    type: boolean
    default: true
    cli_arg: --check_splice
    description: 检查剪接位点（collapse）
  mm2_args:
    type: string
    default: -I8g,--MD
    cli_arg: --mm2_args
    description: minimap2 参数（collapse，逗号分隔无空格）
  quiet:
    type: boolean
    default: true
    cli_arg: --quiet
    description: 安静模式（collapse）
  threads:
    type: integer
    default: 4
    cli_arg: -t
    description: 线程数（自动注入）
  extra_args:
    type: string
    required: false
    description: 透传给 flair 子命令的额外参数（高级用法，慎用）
outputs:
  bed12:
    type: file
    format: bed12
    description: bam2bed12 产生的 BED12 文件
  annotated_bed:
    type: file
    format: bed
    description: annotate 产生的带基因注释 BED 文件
  collapse_fasta:
    type: file
    format: fasta
    description: collapse 产生的一致性转录本 FASTA（<prefix>.flair.collapse.fasta）
  counts:
    type: file
    format: txt
    description: collapse 产生的 isoform 计数文件
environment:
  container_official: quay.io/biocontainers/flair（bioconda 官方镜像；tag 以 quay / depot.galaxyproject.org 为准，见 README）
  note: 官方镜像已覆盖，本地不再维护 Dockerfile/Apptainer.def；宿主机直跑 main.py 时用 conda/mamba 安装 flair。
optimization:
  default_cpus: 4
  default_mem_mb: 8192
  tmpdir: /tmp
  env_vars:
    TMPDIR: '{tmpdir}'
    PYTHONUNBUFFERED: '1'
  per_subcommand_threads:
    collapse: 8
    bam2bed12: 4
    annotate: 4
    default: 4
execution:
  entrypoint: python main.py
  test_command: bash test/run_test.sh
  binary: flair
  snakemake_include_hint: '# 在 Snakefile 中（flair 三段链 bam2bed12 → annotate → collapse；每 rule
    一 .smk、config 驱动，均有默认，独立运行示例见各 .smk 头注）：

    include: "modules/flair/snakemake/flair_bam2bed12.smk"
    include: "modules/flair/snakemake/flair_annotate.smk"
    include: "modules/flair/snakemake/flair_collapse.smk"

    # config 契约（顶层键用 --config 覆盖，flair.* 在 config/config.yaml 预设）：
    #   exec_mode: conda(默认)|docker|native；flair.docker_image / flair.bedtools_bin /
    #     flair.flair_bin / flair.identify_gene_isoform_bin
    #   flair_bam2bed12_input → 输出 flair_bam2bed12_output（默认 <输入>.bed12）
    #   flair_annotate_input_bed12 + flair_annotate_gtf → flair_annotate_output（默认 .annotated.bed）
    #   flair_collapse_annotated_bed + flair_collapse_genome + flair_collapse_reads
    #     [+ flair_collapse_gtf] → flair_collapse_output（默认 .flair.collapse.fasta）
    #   链式衔接：令 annotate/collapse 输入键 == 上游输出键即自动建立依赖。

    '
  snakemake_rules:
  - flair_bam2bed12.smk
  - flair_annotate.smk
  - flair_collapse.smk
