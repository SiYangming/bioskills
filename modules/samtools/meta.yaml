software: samtools
canonical: samtools
category: alignment_utils
description: 'samtools 是操作 SAM/BAM/CRAM 的高通量测序数据工具集，提供排序、索引、 统计、提取、转换、拼接、pileup 等核心能力，是绝大多数
  NGS 流程的底座。

  '
homepage: http://www.htslib.org/
license: MIT
software_versions:
- id: samtools_native
  samtools: '1.21'
  note: apt 打包 / Debian bookworm 默认可稳定取得；Dockerfile 与 Apptainer.def 已对应切到 apt 最小化安装。
- id: samtools_nextflow_nfcore
  module_version: 2.2.0
  samtools: '1.24'
  source: bioconda::samtools=1.24（modules/nf-core/samtools/*/environment.yml）
  note: nf-core master 在 2026-07 起多数子模块已 bump 到 samtools=1.24；HPC/Cloud 使用 Wave 容器时请以对应子模块
    meta 为准。
- id: samtools_snakemake_wrappers
  wrapper_tag: v3.13.0
  samtools: '1.24'
  source: bioconda samtools=1.24 + snakemake-wrapper-utils=0.9.0（bio/samtools/*/environment.yaml）
  note: 与 nf-core 当前版本一致；若固定 wrapper tag < v3.13，samtools 可能回落 1.21–1.23。
- id: samtools_nextflow_local
  samtools: 未固定（用户按 main.nf 中 conda/container 自行声明）
- id: samtools_snakemake_local
  samtools: 未固定（用户按 rules/ 中 conda/container 自行声明）
implementations:
- id: samtools_native
  path: native
  source_type: custom
  type: native
  version: 1.21-v1.0
  priority: high
  when_to_use: '非流程引擎场景（AI Agent Function Calling / 独立 CLI / Shell 调用）的首选目标。

    '
  container_ref:
    bioconda: https://anaconda.org/bioconda/samtools
    quay_biocontainers: quay.io/biocontainers/samtools
    install_hint: 推荐 mamba create -n <env> -c conda-forge -c bioconda <sw>；容器可用 quay.io/biocontainers
      镜像
- id: samtools_snakemake_wrappers
  path: snakemake
  source_type: official
  type: snakemake_local
  version: v3.13.0
  priority: medium
  when_to_use: 组装 Snakemake 流程、复用中央 wrapper 缓存时。
default_implementation: samtools_native
inputs:
  subcommand:
    type: string
    required: true
    description: samtools 子命令：view|sort|index|flagstat|idxstats|stats|depth|mpileup|faidx|merge|quickcheck
  input:
    type: file
    required: true
    cli_arg: positional
    description: 输入文件（SAM/BAM/CRAM/FASTA）
  output:
    type: file
    required: false
    cli_arg: -o
    description: 输出文件路径
  bam:
    type: file
    required: false
    cli_arg: positional
    description: 主输入 BAM（index/flagstat/idxstats/stats/depth 等）
  bam_list:
    type: string
    required: false
    cli_arg: -b
    description: merge 时的 BAM 列表文件
  region:
    type: string
    required: false
    cli_arg: positional
    description: 区域字符串（如 chr1:1000-2000），view/stats/depth 等可用
  fasta:
    type: file
    required: false
    cli_arg: -f
    description: faidx 目标 FASTA / mpileup 参考序列
  threads:
    type: integer
    default: 4
    cli_arg: -@
    description: 线程数（自动注入）
  output_format:
    type: string
    required: false
    cli_arg: -O
    description: 输出格式：SAM/BAM/CRAM/JSON
  filter_flags:
    type: string
    required: false
    cli_arg: -F
    description: 过滤 FLAG（如 4=未比对，1796=常规质控）
  require_flags:
    type: string
    required: false
    cli_arg: -f
    description: 要求 FLAG
  min_mapq:
    type: integer
    required: false
    cli_arg: -q
    description: 最小 MAPQ
  sort_by_name:
    type: boolean
    default: false
    cli_arg: -n
    description: sort 时按 read name 排序
  index_format:
    type: string
    required: false
    cli_arg: -c
    description: index 时的索引格式（bai/csi）
  extra_args:
    type: string
    required: false
    description: 透传给 samtools 子命令的额外参数（高级用法，慎用）
outputs:
  result_file:
    type: file
    description: 主输出文件（BAM/索引/报告等，依子命令而定）
  stats_report:
    type: file
    format: txt
    description: stats 子命令产生的统计报告
environment:
  conda: environment.yml
  dockerfile: Dockerfile
  apptainer_def: Apptainer.def
optimization:
  default_cpus: 4
  default_mem_mb: 8192
  env_vars:
    TMPDIR: '{tmpdir}'
    HTS_LOG_TRACE: 'off'
  per_subcommand_threads:
    sort: 8
    view: 4
    mpileup: 4
    default: 4
execution:
  entrypoint: python main.py
  test_command: bash test/run_test.sh
  binary: samtools
  snakemake_rules:
  - samtools.smk
