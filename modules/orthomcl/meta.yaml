software: orthomcl
canonical: orthomcl
category: comparative_genomics
description: 'OrthoMCL v2.0.9（Orthologous Groups via MCL）是经典的直系同源基因聚类流程：
  orthomclAdjustFasta 规范蛋白序列 → orthomclFilterFasta 过滤低质量序列 → BLAST/DIAMOND
  all-vs-all → orthomclBlastParser 解析比对 → orthomclLoadBlast 导入 MySQL →
  orthomclPairs 找 ortholog/in-paralog 对 → orthomclDumpPairsFiles 导出 mclInput →
  mcl 聚类（OCG）→ orthomclMclToGroups 编号。**已停止维护（deprecated，2026-09 登记）**：
  官方推荐 OrthoFinder 替代，且流程依赖 MySQL 数据库，安装与运行较繁琐。本模块只做
  「录入」：native 为「说明型 + 命令构造」驱动，按官方流程构造 8 个 OrthoMCL 命令，
  不推荐新项目使用。

  '
homepage: http://orthomcl.org/orthomcl/
license: 'EuPathDB Bioinformatics Resource Center（bioconda orthomcl 配方 license 字段；
  官方许可文件见 tarball 内 doc/OrthoMCLEngine/Main/SoftwareLicense.txt）'
deprecated: true
deprecated_note: '上游停止维护（官方推荐 OrthoFinder 替代）。技术原因：依赖 MySQL
  数据库（orthomclInstallSchema/orthomclLoadBlast/orthomclPairs 均需 DB 连接），流程步骤多、
  安装繁琐；同一任务的现代替代 OrthoFinder 速度更快、准确性更高、无需数据库。2026-09 保留
  渠道：bioconda orthomcl=2.0.9（历史包，quay.io/biocontainers 自动镜像）与官方 tarball
  orthomclSoftware-v2.0.9.tar.gz（orthomcl.org 仍可达，200）。deprecated → 不产出自建
  Dockerfile/Apptainer.def。'
software_versions:
- id: orthomcl_native
  orthomcl: '2.0.9（OrthoMCL v2.0.9；官方 tarball orthomclSoftware-v2.0.9.tar.gz，md5
    2e0202ed4e36a753752c3567edb9bba9，取自 bioconda-recipes orthomcl 配方）'
  subcommands: 'adjust_fasta · filter_fasta · blast_parser · load_blast · pairs · dump_pairs
    · mcl_to_groups · install_schema（共 8 个，说明型命令构造）'
  build_route: '历史遗留渠道：bioconda orthomcl=2.0.9（noarch）→ quay.io/biocontainers/
    orthomcl:2.0.9--hdfd78af_5 / depot.galaxyproject.org sif（自动构建历史镜像，复现用）；
    软件 deprecated → 不产出自建 Dockerfile/Apptainer.def'
  source: http://orthomcl.org/common/downloads/software/v2.0/orthomclSoftware-v2.0.9.tar.gz
  note: '依赖 MySQL（mysqlclient / perl-dbd-mysql）。MCL 聚类在流程末步单独调用 mcl
    （见 modules/mcl/），OrthoMCL 自身不含聚类内核。'
- id: orthomcl_nextflow_nfcore
  orthomcl: 官方无模块（modules/nf-core/orthomcl 404）
  source: —
  note: 2026-09 抓取 https://raw.githubusercontent.com/nf-core/modules/master/modules/nf-core/orthomcl
    返回 404；Nextflow 场景无官方子模块。
- id: orthomcl_snakemake_wrappers
  orthomcl: 官方无 wrapper（bio/orthomcl 404）
  source: —
  note: 2026-09 抓取 https://raw.githubusercontent.com/snakemake/snakemake-wrappers/master/bio/orthomcl
    返回 404；Snakemake 场景无官方 wrapper。
- id: orthomcl_nextflow_local
  orthomcl: "未启用（deprecated 模块不建 nextflow/；需要时在 main.nf 中 shell: 调 native/main.py）"
- id: orthomcl_snakemake_local
  orthomcl: "未启用（deprecated 模块不建 snakemake/；需要时在 .smk 中 shell: 调 native/main.py）"
implementations:
- id: orthomcl_native
  path: native
  source_type: custom
  type: native
  version: "2.0.9"
  priority: high
  when_to_use: '非流程引擎场景（AI Agent Function Calling / 独立 CLI / Shell 调用）。本实现为
    「说明型 + 命令构造」：按官方 OrthoMCL 流程构造 8 个子命令的 OrthoMCL 命令行，
    不实际运行（软件 deprecated、依赖 MySQL、无新用场景），主要供历史复现与文档化调用。
    新项目请改用 orthofinder（modules/orthofinder/）。'
  container_ref:
    bioconda: https://anaconda.org/bioconda/orthomcl（orthomcl=2.0.9，noarch 历史包）
    quay: quay.io/biocontainers/orthomcl:2.0.9--hdfd78af_5（bioconda 自动构建历史镜像）
    galaxyproject: https://depot.galaxyproject.org/singularity/orthomcl%3A2.0.9--hdfd78af_5
    install_hint: 宿主机 conda 路线 mamba create -n orthomcl-native -c conda-forge -c bioconda
      orthomcl=2.0.9（另需 MySQL 服务）；或取官方 tarball orthomclSoftware-v2.0.9.tar.gz
      解压到 ~/software（见 README「环境安装」）
default_implementation: orthomcl_native
inputs:
  subcommand:
    type: string
    required: true
    description: 'orthomcl 子命令：adjust_fasta | filter_fasta | blast_parser | load_blast
      | pairs | dump_pairs | mcl_to_groups | install_schema'
  species:
    type: string
    required: false
    cli_arg: positional
    description: 'adjust_fasta：物种缩写（命名规则 属名前2字母+种名前3字母，如 ncra）'
  fasta:
    type: file
    required: false
    cli_arg: positional
    description: 'adjust_fasta：输入蛋白 FASTA；序列头统一改写为 >物种|基因ID'
  id_length:
    type: integer
    required: false
    cli_arg: positional
    description: 'adjust_fasta：基因 ID 截取长度（如 10）'
  input_dir:
    type: string
    required: false
    cli_arg: positional
    description: 'filter_fasta：compliantFasta 目录（放各物种已规范化的 FASTA）'
  min_len:
    type: integer
    default: 10
    cli_arg: positional
    description: 'filter_fasta：允许的最短蛋白长度（默认 10；教程常用 30）'
  max_percent_stop:
    type: integer
    default: 20
    cli_arg: positional
    description: 'filter_fasta：终止密码子最大比例（%，默认 20）'
  blast_output:
    type: file
    required: false
    cli_arg: positional
    description: 'blast_parser：BLAST/DIAMOND 输出（outfmt 6 表格）；结果写 stdout（通常 >> similarSequences.txt）'
  compliant_dir:
    type: string
    required: false
    cli_arg: positional
    description: 'blast_parser：compliantFasta 目录（用于解析物种/基因 ID）'
  config:
    type: file
    required: false
    cli_arg: positional
    description: 'install_schema/load_blast/pairs/dump_pairs：orthomcl.config（MySQL 连接与 schema 配置）'
  similar_sequences:
    type: file
    required: false
    cli_arg: positional
    description: 'load_blast：similarSequences.txt（blast_parser 产物）'
  log:
    type: file
    required: false
    cli_arg: positional
    description: 'install_schema/pairs：日志文件路径'
  cleanup:
    type: string
    required: false
    cli_arg: positional
    description: 'pairs：结束后是否清理中间数据（yes|no，如 yes）'
  prefix:
    type: string
    required: false
    cli_arg: positional
    description: 'mcl_to_groups：OCG 前缀（如 OCG）'
  start:
    type: integer
    required: false
    cli_arg: positional
    description: 'mcl_to_groups：起始编号（如 1）'
  threads:
    type: integer
    required: false
    default: 1
    description: '线程数占位（OrthoMCL 各子命令无多线程选项，--threads 被接受但不注入；MCL 聚类步单独用 modules/mcl/）'
  tmpdir:
    type: string
    required: false
    description: 覆盖默认临时目录（仅进程环境注入，OrthoMCL 无自身 tmp 选项）
outputs:
  compliant_fasta:
    type: file
    description: 'adjust_fasta/filter_fasta 产物：规范化/过滤后的 FASTA（adjust_fasta 写入当前目录
      <species>.fasta；filter_fasta 产出 goodProteins.fasta）'
  similar_sequences_txt:
    type: file
    format: txt
    description: 'blast_parser stdout 内容（8 列相似序列对；通常重定向到 similarSequences.txt）'
  mcl_input:
    type: file
    description: 'dump_pairs 产物：mclInput（ABC 格式，供 mcl 聚类）与 pairs/ 目录下各类比对对文件'
  groups_txt:
    type: file
    format: txt
    description: 'mcl_to_groups stdout 内容（编号后的 OCG 分组，通常重定向到 groups.txt）'
environment:
  container_official: quay.io/biocontainers/orthomcl（bioconda 历史镜像；tag 以 quay / depot.galaxyproject.org 为准，见 README「容器与 Conda 链接」）
  note: '⚠️ deprecated：不产出自建容器配方（不提供 Dockerfile/Apptainer.def）。历史渠道：
    bioconda orthomcl=2.0.9（noarch）→ quay.io/biocontainers/orthomcl:2.0.9--hdfd78af_5 与
    depot.galaxyproject.org sif（自动构建历史镜像，仅复现用）；宿主机安装登记在 README
    「环境安装」：conda（orthomcl=2.0.9，另需 MySQL）/ Docker / Apptainer / 官方 tarball。'
optimization:
  default_cpus: 1
  default_mem_mb: 4096
  tmpdir: /tmp
  env_vars:
    TMPDIR: '{tmpdir}'
  per_subcommand_threads:
    default: 1
execution:
  entrypoint: python main.py
  test_command: bash test/run_test.sh
  binary: orthomclAdjustFasta
  nextflow_note: 本模块未建 nextflow/ 与 snakemake/ 目录；nf-core / snakemake-wrappers 均无
    orthomcl 官方子模块（2026-09 核实 404），且软件 deprecated → 不登记官方说明层，
    历史复现一律以 native 驱动为兜底。
