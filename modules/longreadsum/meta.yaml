software: longreadsum
canonical: longreadsum
category: qc
description: 'LongReadSum（WGLab）是长读测序（ONT / PacBio）快速 QC 汇总工具：按文件类型子命令
  （bam / rrms / pod5 / f5s / f5 / seqtxt / fq / fa）生成 HTML 报告 + JSON summary（v1.6.0 起为
  MultiQC 兼容的 JSON 输出）；支持 WGS BAM、RNA-seq TIN（转录本完整性）、碱基修饰（MM/ML）、
  RRMS 接受/拒绝拆分、ONT POD5/FAST5 信号统计、sequencing_summary.txt、FASTQ/FASTA。

  '
homepage: https://github.com/WGLab/LongReadSum
license: MIT
software_versions:
  native:
    longreadsum: 1.6.0
    build_route: 自建容器（debian:bookworm-slim + apt 构建依赖 + SWIG 源码编译；1.6.0 在官方渠道
      bioconda → quay.io/biocontainers → depot.galaxyproject.org 均缺失 → 自建兜底）
    source: 'git tag v1.6.0（commit 4221fece；无 release 二进制资产，tarball: https://github.com/WGLab/LongReadSum/archive/refs/tags/v1.6.0.tar.gz）'
    note: '官方 conda/镜像仅到 1.3.1（bioconda longreadsum=1.3.1，quay.io/biocontainers/longreadsum:1.3.1--py*）；1.6.0
      可用渠道：GitHub tag 源码、wglab conda 频道（-c wglab longreadsum=1.6.0）、社区镜像 quay.io/bioinfortools/longreadsum:1.6.0。C++/SWIG
      工程：make swig_build + python3 setup.py build_ext（链接 htslib + HDF5）；运行期 Python 依赖
      numpy / plotly / pyarrow / pod5（PyPI pod5=0.3.47）。'
  nextflow_nfcore:
    longreadsum: 官方无模块
    module_version: ''
    source: （占位）
    note: 2026-09 抓取 https://api.github.com/repos/nf-core/modules/contents/modules/nf-core/longreadsum
      返回 404；Nextflow 场景需自定义或降级 native。
  nextflow_local:
    longreadsum: （未启用占位）
  snakemake_wrappers:
    longreadsum: 官方无 wrapper
    wrapper_tag: v3.13.0
    source: （占位）
    note: 2026-09 抓取 https://api.github.com/repos/snakemake/snakemake-wrappers/contents/bio/longreadsum
      返回 404；Snakemake 场景需自定义或降级 native。
  snakemake_local:
    longreadsum: （未启用占位）
implementations:
- id: longreadsum_native
  path: native
  source_type: custom
  type: native
  version: "1.6.0"
  priority: high
  when_to_use: 非流程引擎场景（AI Agent Function Calling / 独立 CLI / Shell 调用）的首选目标，覆盖
    bam / rrms / pod5 / f5s / f5 / seqtxt / fq / fa 八类长读数据 QC 子命令。
  container_ref:
    bioconda: https://anaconda.org/bioconda/longreadsum（官方仅到 1.3.1）
    wglab_conda: https://anaconda.org/wglab/longreadsum（1.6.0，作者频道）
    quay_biocontainers: quay.io/biocontainers/longreadsum:1.3.1--py312h4a3f6ec_3（官方仅到 1.3.1）
    quay_bioinfortools: quay.io/bioinfortools/longreadsum:1.6.0（社区镜像，1.6.0）
    dockerhub_official: docker.io/genomicslab/longreadsum（官方 Docker Hub，旧 miniconda 配方 pin 1.5.0）
    install_hint: '1.6.0 无官方渠道：conda 走 wglab 频道（-c wglab -c conda-forge -c jannessp -c bioconda
      longreadsum=1.6.0）或源码编译（native/Dockerfile / install.sh --method source）；官方镜像仅 1.3.1（quay.io/biocontainers）。'
default_implementation: longreadsum_native
inputs:
  subcommand:
    type: string
    required: true
    description: 'longreadsum 文件类型子命令：bam|rrms|pod5|f5s|f5|seqtxt|fq|fa（v1.6.0 CLI：
      longreadsum <FILETYPE> -i <input> -o <outdir>）'
  input:
    type: file
    required: false
    cli_arg: -i
    description: 单个输入文件（FASTA/FASTQ/BAM/FAST5/POD5/sequencing_summary.txt）
  inputs:
    type: string
    required: false
    cli_arg: -I
    description: 多个逗号分隔的输入文件路径
  pattern:
    type: string
    required: false
    cli_arg: -P
    description: 通配符模式（*）匹配多个输入文件（用引号包裹，如 "dir/*.fast5"）
  output:
    type: string
    required: false
    cli_arg: -o
    description: 输出目录（默认官方 output_LongReadSum）
  prefix:
    type: string
    required: false
    cli_arg: -Q
    description: 输出文件名前缀（默认 QC_）
  sample:
    type: string
    required: false
    cli_arg: -s
    description: 样本名（默认 Sample）
  log:
    type: string
    required: false
    cli_arg: -g
    description: 日志文件路径（默认 log_output.log）
  log_level:
    type: integer
    required: false
    cli_arg: -G
    description: 日志级别 1:DEBUG 2:INFO 3:WARNING 4:ERROR 5:CRITICAL（默认 2）
  threads:
    type: integer
    default: 4
    cli_arg: -t
    description: 线程数（自动注入）
  csv:
    type: file
    required: false
    cli_arg: -c
    format:
    - csv
    description: 'rrms 子命令：含 read_id / decision 列的 CSV（accepted=stop_receiving，rejected=unblock）'
  basecalls:
    type: file
    required: false
    cli_arg: -b
    format:
    - bam
    description: pod5 子命令：用于信号提取的 basecalled BAM（需带 move 表，dorado --emit-moves）
  read_ids:
    type: string
    required: false
    cli_arg: -r
    description: 'pod5 / f5s 子命令：逗号分隔的待提取 read ID 列表'
  read_count:
    type: integer
    required: false
    cli_arg: -R
    description: pod5 / f5s 子命令：随机抽样的 read 数（默认 3）
  mod:
    type: boolean
    required: false
    cli_arg: --mod
    description: bam 子命令：运行碱基修饰（MM/ML tag）分析（默认 False）
  modprob:
    type: float
    required: false
    cli_arg: --modprob
    description: bam 子命令：碱基修饰过滤阈值（默认 0.5）
  ref:
    type: file
    required: false
    cli_arg: --ref
    format:
    - fasta
    description: bam 子命令 --mod 时：参考基因组 FASTA（识别 CpG 位点）
  genebed:
    type: file
    required: false
    cli_arg: --genebed
    format:
    - bed
    description: 'bam 子命令：RNA-seq BAM 计算 TIN 分数所需的 Gene BED12 文件'
  sample_size:
    type: integer
    required: false
    cli_arg: --sample-size
    description: bam 子命令 TIN 抽样数（默认 100）
  min_coverage:
    type: integer
    required: false
    cli_arg: --min-coverage
    description: bam 子命令 TIN 最小覆盖度（默认 10）
  udqual:
    type: integer
    required: false
    cli_arg: -u
    description: fq 子命令：FASTQ 质量值偏移（默认 33）
  extra_args:
    type: string
    required: false
    description: 透传给 longreadsum 的附加参数（高级用法，慎用）
outputs:
  html_report:
    type: file
    format: html
    description: 主 QC 报告（<prefix>*.html，v1.6.0 起含 JSON summary，MultiQC 兼容）
  summary_json:
    type: file
    format: json
    description: v1.6.0 起输出的 JSON 汇总（供 MultiQC --module longreadsum 聚合）
  tin_tsv:
    type: file
    format: tsv
    description: bam 子命令 TIN 模式输出的每转录本 TIN 分数 TSV（含 summary TSV）
environment:
  conda: environment.yml
  dockerfile: Dockerfile
  apptainer_def: Apptainer.def
  note: 1.6.0 无官方镜像（bioconda/quay biocontainers/depot 仅 1.3.1）→ 自建 apt 最小化 + SWIG 源码编译配方；
    conda 备选走 wglab 频道（native/environment.yml 供离线 / 非容器场景）。
optimization:
  default_cpus: 4
  default_mem_mb: 8192
  env_vars:
    TMPDIR: '{tmpdir}'
  per_subcommand_threads:
    bam: 4
    default: 4
execution:
  entrypoint: python main.py
  test_command: bash test/run_test.sh
  binary: longreadsum
