# longreadsum native Conda 环境配方（native/environment.yml）
# 用途：本地宿主机离线 / 非容器场景备选：mamba env create -f environment.yml
# 版本对齐：modules/longreadsum/meta.yaml software_versions.native longreadsum=1.6.0。
# 渠道说明：bioconda 官方仅到 1.3.1；1.6.0 需 wglab（作者）频道（2026-09-07 核实含 1.6.0），
#           pod5 依赖 jannessp 频道（LongReadSum 官方 README 推荐顺序）。
# 容器说明：native/Dockerfile、Apptainer.def 走 apt + 源码编译（禁 miniconda），不使用本文件。
# main.py 运行依赖：pyyaml（SkillBase）。
name: longreadsum-native
channels:
  - wglab
  - conda-forge
  - jannessp
  - bioconda
dependencies:
  - python=3.9
  - longreadsum=1.6.0
  - pyyaml>=6.0
