software: ultra
canonical: ultra
category: alignment_utils
description: 'uLTRA 是长读长转录组 reads（PacBio Iso-Seq / ONT）的剪接比对工具， 基于 minimap2 预过滤 +
  NAM（maximal exact matches）外显子连接搜索， 提供 index（GTF 转录组索引）与 align（reads → SAM/BAM）两大核心能力，
  依赖 minimap2 / namfinder / samtools。

  '
homepage: https://github.com/ksahlin/uLTRA
license: GPL-3.0
implementations:
- id: ultra_native
  path: native
  source_type: custom
  type: native
  version: 0.1-v1.0
  priority: high
  when_to_use: 非流程引擎场景（AI Agent Function Calling / 独立 CLI）首选。自动注入线程与依赖路径。
  container_ref:
    bioconda: https://anaconda.org/bioconda/ultra
    quay_biocontainers: quay.io/biocontainers/ultra
    install_hint: 推荐 mamba create -n <env> -c conda-forge -c bioconda <sw>；容器可用 quay.io/biocontainers
      镜像
- id: ultra_snakemake_wrappers
  path: snakemake
  source_type: official
  type: snakemake_local
  version: v3.13.0
  priority: medium
  when_to_use: Snakemake 流程、复用中央 wrapper 缓存时（注意：官方暂缺 ultra wrapper，见下方说明）。
default_implementation: ultra_native
software_versions:
  native:
    ultra: '0.1'
    ultra_bioinformatics: '0.1'
    build_route: CONDA：micromamba/conda 引导 bioconda ultra_bioinformatics=0.1（apt 无
      ultra 包）
    deps: minimap2 + namfinder + samtools（同一 conda env，uLTRA 运行时按 PATH 查找）
    source: bioconda::ultra_bioinformatics=0.1
    note: binary 名为 uLTRA；Debian bookworm apt 无此包，因此容器走 apt 运行时 + micromamba 引导，禁止
      miniconda。
  nextflow_nfcore:
    ultra: '0.1'
    samtools: '1.17'
    module_version: master（2026-08 抓取；install 时由 nf-core tools 写实际 commit）
    source: bioconda::ultra_bioinformatics=0.1 + bioconda::samtools=1.17 + gffutils=0.11.1
      + python=3.10.12（modules/nf-core/ultra/{index,align}/environment.yml）
    note: nf-core 拆分为 ultra/align、ultra/index、ultra/pipeline 三个子模块；isoseq 类流程使用 align
      + index。
  nextflow_local:
    ultra: （继承 native 容器或显式 pin；未启用则写占位）
  snakemake_wrappers:
    ultra: 无官方 wrapper
    wrapper_tag: v3.13.0
    source: https://api.github.com/repos/snakemake/snakemake-wrappers/contents/bio/ultra
      → 404
    note: snakemake-wrappers 官方 bio/ 目录无 ultra（2026-08 核对）；必须降级使用 ultra_snakemake_local。
  snakemake_local:
    ultra: 0.1（规则从 snakemake.smk/isoseq.smk/workflow/modules/ultra/snakemake/ultra.smk
      迁移，值内联）
inputs:
  subcommand:
    type: string
    required: true
    description: ultra 子命令：gunzip|index|align|sort
  fasta:
    type: file
    required: false
    cli_arg: positional
    description: 参考基因组 FASTA（index 用；支持 .fa/.fasta，.gz 时自动先解压）
  gtf:
    type: file
    required: false
    cli_arg: positional
    description: 参考注释 GTF（index 用；须先排序）
  genome:
    type: file
    required: false
    cli_arg: positional
    description: 参考基因组 FASTA（align 用；.gz 时自动先解压）
  reads:
    type: file
    required: false
    cli_arg: positional
    description: 输入 reads（align 用，fasta/fastq；.gz 时自动先解压）
  index_dir:
    type: string
    required: false
    cli_arg: positional
    description: uLTRA index 输出目录（align 用，含 *.pickle 与 *.db）
  input:
    type: file
    required: false
    cli_arg: positional
    description: gunzip/sort 的输入文件（.gz 或 GTF）
  outdir:
    type: string
    required: false
    cli_arg: --outdir
    description: 输出目录（index/align/sort）
  output:
    type: file
    required: false
    cli_arg: -o
    description: gunzip 输出文件路径（默认去掉 .gz 后缀）
  prefix:
    type: string
    required: false
    cli_arg: --prefix
    description: 输出前缀（align 的 BAM 名 / sort 的 .sorted.gtf 名）
  args:
    type: string
    required: false
    cli_arg: --args
    description: 透传附加参数（index 默认 --disable_infer；align 透传 uLTRA align；sort 透传 sort）
  args2:
    type: string
    required: false
    cli_arg: --args2
    description: align 时透传给 samtools sort 的附加参数
  threads:
    type: integer
    default: 4
    cli_arg: --threads
    description: 线程数（align 注入 --t 与 samtools sort --threads）
outputs:
  pickle_db:
    type: file
    format:
    - pickle
    - db
    description: index 产物（*.pickle 与 *.db）
  bam:
    type: file
    format: bam
    description: align 产物（samtools sort 后的 BAM）
  sorted_gtf:
    type: file
    format: gtf
    description: sort 产物（<prefix>.sorted.gtf）
  versions:
    type: file
    pattern: versions.yml
    description: 与 nf-core 对齐的版本文件
environment:
  conda: environment.yml
  dockerfile: Dockerfile
  apptainer_def: Apptainer.def
optimization:
  default_cpus: 4
  default_mem_mb: 8192
  env_vars:
    TMPDIR: '{tmpdir}'
  per_subcommand_threads:
    index: 8
    align: 8
    default: 4
execution:
  entrypoint: python main.py
  test_command: bash test/run_test.sh
  binary: uLTRA
  snakemake_rules:
  - ultra.smk
