# ultra / nextflow / nf-core 说明模块
# ---------------------------------------------------------------------------
# source_type: official —— 仅保留说明、接口 Schema 与引用，不重写源码。
# 本目录为说明 + Schema；真正执行需在项目内安装官方 nf-core 子模块。
# ---------------------------------------------------------------------------

id: ultra_nextflow_nfcore
version: "master"
software: ultra
type: nextflow_nfcore
source_type: official

summary: "Official nf-core process family for uLTRA (modules/nf-core/ultra/{align,index,pipeline} 全子模块清单 + 使用参考)."

agent_guidance:
  when_to_use: "组装 Nextflow DSL2 流程、目标为 HPC/Cloud 时，直接 include 对应子模块（ultra/align + ultra/index）。"
  recommendation_priority: "Medium（Nextflow 流程引擎场景使用；CLI/Agent 直调请走 native）。"

# 版本对齐：本实现 meta.version 记录 nf-core/modules ultra 家族（master 分支）；
# ultra 上游二进制版本以各子模块 environment.yml 中的 conda pin 为准。
software_versions:
  module_version: "master（2026-08 抓取；nf-core modules install 时写实际 commit）"
  ultra: "0.1"
  samtools: "1.17"
  gffutils: "0.11.1"
  source: "bioconda::ultra_bioinformatics=0.1 + bioconda::samtools=1.17 + bioconda::gffutils=0.11.1 + python=3.10.12（modules/nf-core/ultra/index/environment.yml）"
  note: "ultra/align 与 ultra/index 均以 ultra_bioinformatics=0.1 为锚点；index 子模块额外 pin samtools=1.17/gffutils=0.11.1。
         若固定到更早的模块 commit，版本可能回落。isoseq 类流程使用 align + index（pipeline 为端到端演示）。"

source_reference:
  repository: "https://github.com/nf-core/modules"
  modules_base: "modules/nf-core/ultra"
  submodules:
    - "align"
    - "index"
    - "pipeline"
  submodules_note: >
    子模块列表以 https://github.com/nf-core/modules/tree/master/modules/nf-core/ultra
    在线目录为准（2026-08 GitHub API 抓取）；若 nf-core 官方未提供某个子命令，
    请降级使用 ultra_nextflow_local。

inputs:
  - name: fasta
    type: file
    format: [fasta, fa]
    description: "参考基因组 FASTA（ultra/index 用）"
  - name: gtf
    type: file
    format: gtf
    description: "参考注释 GTF（ultra/index 用；须先排序）"
  - name: reads
    type: file
    format: [fa, fasta, fastq]
    description: "输入 reads（ultra/align 用）"
  - name: genome
    type: file
    format: [fa, fasta]
    description: "参考基因组 FASTA（ultra/align 用）"
  - name: pickle
    type: file
    format: pickle
    description: "uLTRA index 产物（ultra/align 用）"
  - name: db
    type: file
    format: db
    description: "uLTRA index 产物（ultra/align 用）"

outputs:
  - name: pickle
    type: file
    format: pickle
    description: "index 产物（*.pickle）"
  - name: db
    type: file
    format: db
    description: "index 产物（*.db）"
  - name: bam
    type: file
    format: bam
    description: "align 产物（*.bam）"
  - name: versions
    type: file
    pattern: "versions.yml"
    description: "nf-core 标准版本文件"

execution:
  mode: nextflow_include
  include_statement: "include { ULTRA_INDEX } from './modules/nf-core/ultra/index'"
  include_pattern: "include { ULTRA_<SUB> } from './modules/nf-core/ultra/<sub>'"
  container: "community.wave.seqera.io/library/ultra_bioinformatics:0.1（以 nf-core modules install 实际解析的 Wave 容器为准）"
  setup_hint: |
    在项目仓库根执行：
      nf-core modules install ultra/index
      nf-core modules install ultra/align
    本目录仅提供 include 参考与统一 Schema，不重写官方源码。
