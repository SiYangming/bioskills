# gunzip / nextflow / nf-core 说明模块
# ---------------------------------------------------------------------------
# source_type: official —— 仅保留说明、接口 Schema 与引用，不重写源码。
# 本目录为说明 + Schema；真正执行需在项目内安装官方 nf-core 子模块。
# ---------------------------------------------------------------------------

id: gunzip_nextflow_nfcore
version: "master"
software: gunzip
type: nextflow_nfcore
source_type: official

summary: "Official nf-core module for gunzip (modules/nf-core/gunzip 单模块：.gz -> 原始文件 + versions.yml)."

agent_guidance:
  when_to_use: "组装 Nextflow DSL2 流程、目标为 HPC/Cloud 时，直接 include GUNZIP 模块。"
  recommendation_priority: "Medium（Nextflow 流程引擎场景使用；CLI/Agent 直调请走 native）。"

software_versions:
  module_version: "master（2026-08 抓取；nf-core modules install 时写实际 commit）"
  gunzip: "1.13"
  source: "conda-forge::gzip=1.13（modules/nf-core/gunzip/environment.yml；环境另含 coreutils=9.5/grep=3.11/sed=4.8/tar=1.34/lbzip2=2.5）"
  note: "nf-core gunzip 为单模块（无子模块拆分），bin 为 gzip -cd；与 native（apt gzip=1.12）解压语义兼容。"

source_reference:
  repository: "https://github.com/nf-core/modules"
  modules_base: "modules/nf-core/gunzip"
  submodules: []
  submodules_note: >
    https://api.github.com/repos/nf-core/modules/contents/modules/nf-core/gunzip
    仅含 environment.yml / main.nf / meta.yml / tests（无子目录拆分）；
    gunzip 是单模块，install 命令为 `nf-core modules install gunzip`。
    tests 目录为官方测试夹具，非可安装子模块。

inputs:
  - name: meta
    type: map
    description: "Groovy 样本元信息，如 [ id:'sample1', single_end:false ]（可选）"
  - name: archive
    type: file
    description: "待解压的 .gz 文件（pattern: *.*）"

outputs:
  - name: gunzip
    type: file
    description: "解压后的文件（pattern: *.*）"
  - name: versions
    type: file
    pattern: "versions.yml"
    description: "nf-core 标准版本文件"

execution:
  mode: nextflow_include
  include_statement: "include { GUNZIP } from './modules/nf-core/gunzip'"
  include_pattern: "include { GUNZIP } from './modules/nf-core/gunzip'"
  container: "community.wave.seqera.io/library/gzip:1.13（以 nf-core modules install 实际解析的 Wave 容器为准）"
  setup_hint: |
    在项目仓库根执行：
      nf-core modules install gunzip
    本目录仅提供 include 参考与统一 Schema，不重写官方源码。
