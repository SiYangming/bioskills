# gunzip / snakemake / local 自维护规则元数据
# ---------------------------------------------------------------------------
# source_type: custom —— 规则从 snakemake.smk/isoseq.smk/workflow/modules/gunzip/snakemake/local/gunzip.smk 迁移，
# 已去掉对 workflow/lib/helpers.py 的全局依赖（值内联 / config 驱动）。
# ---------------------------------------------------------------------------

id: gunzip_snakemake_local
version: "1.12-v1.0"
software: gunzip
type: snakemake_local
source_type: custom

summary: "Custom gunzip Snakemake rule（gzip -cd <in.gz> > <out>，自 isoseq.smk 迁移）。"

agent_guidance:
  when_to_use: "snakemake-wrappers 官方缺失（bio/gunzip 404）时，Snakemake 流程直接使用本目录 gunzip.smk。"
  recommendation_priority: "Medium（Snakemake 流程引擎场景的主执行目标）。"

software_versions:
  gunzip: "1.12"
  source: "规则迁移自 snakemake.smk/isoseq.smk/workflow/modules/gunzip/snakemake/local/gunzip.smk（gzip -cd 语义）"
  note: "与 native（apt gzip=1.12）版本对齐；容器/conda 由调用方在 rule 上声明。"

inputs:
  input:
    type: file
    format: [gz]
    description: "待解压的 .gz 文件（通配 {filepath}.gz）"

outputs:
  output:
    type: file
    description: "解压后的文件（通配 {filepath}）"

execution:
  mode: snakemake_rule
  rule_files: ["gunzip.smk"]
  entrypoint: "include: gunzip.smk（或用 use rule gunzip from rule_gunzip）"
  binary: "gzip"
