# isoseq3 / snakemake / local — 自维护 Snakemake rule
# ---------------------------------------------------------------------------
# source_type: custom —— 规则迁移自 snakemake.smk/isoseq.smk/workflow/modules/isoseq3/snakemake/local/isoseq3.smk，
# 去掉对 workflow/lib/helpers.py 的全局依赖，参数内联。
# 适用场景：官方 snakemake-wrappers 无 bio/isoseq3（当前正是如此）。
# ---------------------------------------------------------------------------

id: isoseq3_snakemake_local
version: "0.1.0"
software: isoseq3
type: snakemake_local
source_type: custom

summary: "Self-maintained Snakemake rule for isoseq3 refine（迁移自 isoseq.smk/workflow/modules/isoseq3/snakemake/local/isoseq3.smk，官方 wrapper 缺失时的执行路径）。"

agent_guidance:
  when_to_use: "Snakemake 流程中需要 isoseq3 refine 精炼 reads 时；官方 bio/isoseq3 wrapper 不存在，本 rule 为 Snakemake 场景主路径。"
  recommendation_priority: "Medium（Snakemake 流程引擎场景；CLI/Agent 直调请走 native）。"
  enabled: true

# 本实现实际运行的上游二进制版本 + 迁移来源
software_versions:
  isoseq: "4.0.0"
  binary: "isoseq3"
  source: "自维护 isoseq3.smk（迁移自 snakemake.smk/isoseq.smk/workflow/modules/isoseq3/snakemake/local/isoseq3.smk；conda 建议 bioconda::isoseq=4.0.0）"
  note: "原 rule 依赖 workflow/lib/helpers.py 的 get_isoseq_input_bam / docker_run / ISOSEQ_DIR / LOG_DIR；迁移后输入用路径模板 lima/{sample}/{sample}.chunk{n}.bam，docker 分支移除，直接调用 isoseq3 二进制；extra_args 默认 --require-polya。"

inputs:
  bam:
    type: file
    format: bam
    required: true
    description: "输入 BAM（lima 清理后；路径模板 lima/{sample}/{sample}.chunk{n}.bam）"
  primers:
    type: file
    format: fasta
    required: true
    description: "引物 FASTA 文件（primers.fasta）"

outputs:
  bam:
    type: file
    format: bam
    description: "精炼后的 reads BAM（polyA 已修剪）"
  pbi:
    type: file
    format: pbi
    description: "输出 BAM 的 PacBio 索引"
  consensus:
    type: file
    format: xml
    description: "read 库元数据（*.consensusreadset.xml）"
  summary:
    type: file
    format: json
    description: "FL/FLNC/polyA 计数（*.filter_summary.report.json）"
  report:
    type: file
    format: csv
    description: "引物与 polyA 检测元数据（*.report.csv）"

execution:
  mode: snakemake_rule
  rule_files:
    - "isoseq3.smk"
  include_hint: |
    # 在 Snakefile 中：
    include: "modules/isoseq3/snakemake/local/isoseq3.smk"
  conda_hint: "rule 内 conda 指向 envs/isoseq3.yaml（内容：bioconda::isoseq=4.0.0，binary isoseq3）"
