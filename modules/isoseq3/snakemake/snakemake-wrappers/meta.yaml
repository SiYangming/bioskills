# isoseq3 / snakemake / snakemake-wrappers 说明模块
# ---------------------------------------------------------------------------
# source_type: official —— 仅保留说明、桥接脚本与接口 Schema，不重写源码。
# 注意：官方 snakemake-wrappers 目前【没有】bio/isoseq3 wrapper（抓取 404），
#       本目录仅登记桥接层；实际执行请使用 isoseq3_snakemake_local（isoseq3.smk）。
# ---------------------------------------------------------------------------

id: isoseq3_snakemake_wrappers
version: "v3.13.0"
software: isoseq3
type: snakemake_wrappers
source_type: official

summary: "Official Snakemake Wrappers 登记层 for isoseq3（官方 bio/isoseq3 缺失，submodules 为空；实际走 local）。"

agent_guidance:
  when_to_use: "组装 Snakemake 流程时；官方 bio/isoseq3 wrapper 缺失，请直接使用 isoseq3_snakemake_local。"
  recommendation_priority: "Low（官方 wrapper 不存在；本实现仅说明层，实际路由到 snakemake_local）。"

# 版本对齐：官方 bio/isoseq3 不存在，无法从 environment.yaml 取 conda pin。
software_versions:
  wrapper_tag: "v3.13.0"
  isoseq: "官方无 wrapper（bio/isoseq3 404）"
  source: "—（snakemake-wrappers 仓库 bio/isoseq3 目录不存在）"
  note: "2026-08 抓取 https://api.github.com/repos/snakemake/snakemake-wrappers/contents/bio/isoseq3 返回 404；
         Snakemake 场景请使用 isoseq3_snakemake_local（isoseq3.smk，pin bioconda::isoseq=4.0.0，binary isoseq3）。"

source_reference:
  repository: "https://github.com/snakemake/snakemake-wrappers"
  wrapper_base: "bio/isoseq3"
  tag: "v3.13.0"
  submodules: []
  submodules_note: >
    官方 bio/isoseq3 目录不存在（2026-08 抓取 404），故 submodules 为空列表。
    若未来官方新增该 wrapper，请以 https://github.com/snakemake/snakemake-wrappers/tree/master/bio/isoseq3
    在线目录为准刷新；当前 Snakemake 场景请使用 isoseq3_snakemake_local。

inputs:
  input:
    type: file
    format: [bam]
    required: true
    description: "输入 BAM（lima 清理后的 ccs BAM）"
  primers:
    type: file
    format: fasta
    required: true
    description: "引物 FASTA 文件"

outputs:
  output:
    type: file
    format: [bam]
    description: "精炼后的 reads BAM"

params:
  extra:
    type: string
    default: "--require-polya"
    description: "isoseq3 refine 额外参数"

execution:
  mode: snakemake_rule
  wrapper_template: "v3.13.0/bio/isoseq3/{subcommand}（官方缺失，占位）"
  rule_example: |
    # 官方 wrapper 缺失 —— 直接使用本仓库自维护 rule：
    #   include: "modules/isoseq3/snakemake/local/isoseq3.smk"
    rule isoseq3_refine:
        input:  bam="lima/{sample}.chunk{n}.bam", primers="primers.fasta"
        output: "isoseq3/{sample}.chunk{n}.bam"
        params: extra="--require-polya"
        threads: 8
        conda: "envs/isoseq3.yaml"   # bioconda::isoseq=4.0.0
