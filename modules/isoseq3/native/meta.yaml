# isoseq3 native 自包含实现元数据
# ---------------------------------------------------------------------------
# source_type: custom —— 本地全量自维护，不依赖官方 wrapper 源码。
# 注意：bioconda 包名为 isoseq（PacBio IsoSeq 套件），可执行二进制为 isoseq3；
#       本技能聚焦 `isoseq3 refine` 子命令。
# 对外暴露统一的 inputs/outputs/optimization Schema，供 Agent 与 CLI 复用。
# ---------------------------------------------------------------------------

id: isoseq3_native
version: "4.0.0-v1.0"
software: isoseq3
type: native
source_type: custom

summary: "Self-contained isoseq3 refine runner（conda 包 isoseq=4.0.0，binary isoseq3）：去除 polyA 尾与人工连接体，Iso-Seq 第三步。"

agent_guidance:
  when_to_use: "AI Agent Function Calling 或独立 Python/Shell CLI 调用时优先使用本实现。"
  recommendation_priority: "High（非流程引擎场景的主执行目标）"

# 本实现实际运行的上游二进制版本 + 构建来源
software_versions:
  isoseq: "4.0.0"
  binary: "isoseq3"
  source: "bioconda::isoseq=4.0.0（micromamba 引导的 /opt/env；environment.yml 已 pin；binary 为 isoseq3）"
  note: "canonical 目录名 isoseq3，但 bioconda 包名 / 二进制名为 isoseq（isoseq3 为套件内子命令入口）；
         isoseq 不在 Debian bookworm apt，容器走 bookworm-slim + micromamba + bioconda 路线；与 nf-core 模块 bioconda::isoseq=4.0.0 版本一致。"

# ---- 统一输入接口（JSON Schema 导出依据）-------------------------------- #
inputs:
  subcommand:
    type: string
    required: true
    description: "isoseq3 子命令：refine（唯一核心命令）"
  bam:
    type: file
    required: true
    cli_arg: positional
    description: "输入 BAM（lima 清理后的 ccs BAM）"
  primers:
    type: file
    required: true
    cli_arg: positional
    description: "引物 FASTA 文件（*.fasta）"
  output:
    type: file
    required: false
    cli_arg: positional
    description: "输出 BAM 路径（默认 <outdir>/<prefix>.bam）"
  outdir:
    type: string
    required: false
    cli_arg: "-d"
    description: "输出目录（缺省为输入文件所在目录）"
  prefix:
    type: string
    required: false
    description: "输出前缀（默认从 bam 文件名推断）"
  require_polya:
    type: boolean
    default: true
    cli_arg: "--require-polya"
    description: "仅保留检测到 polyA 尾的 reads（默认开启；传 false 则去掉该旗标）"
  min_polya_length:
    type: integer
    required: false
    cli_arg: "--min-polya-length"
    description: "polyA 尾最小长度"
  threads:
    type: integer
    default: 4
    cli_arg: "-j"
    description: "线程数（自动注入；与 --num-threads 等价）"
  extra_args:
    type: string
    required: false
    description: "透传给 isoseq3 refine 的额外参数（高级用法，慎用）"

outputs:
  bam:
    type: file
    format: bam
    description: "精炼后的完整 reads（polyA 已修剪）"
  pbi:
    type: file
    format: pbi
    description: "输出 BAM 的 PacBio 索引"
  consensusreadset:
    type: file
    format: xml
    description: "read 库元数据（*.consensusreadset.xml）"
  summary:
    type: file
    format: json
    description: "全长相/非嵌合/polyA reads 计数（*.filter_summary.report.json）"
  report:
    type: file
    format: csv
    description: "引物与 polyA 检测元数据（*.report.csv）"

# ---- 本地环境配方与性能优化（custom 模块独有）--------------------------- #
environment:
  conda: "environment.yml"
  dockerfile: "Dockerfile"
  apptainer_def: "Apptainer.def"

optimization:
  default_cpus: 4
  default_mem_mb: 8192
  tmpdir: "/tmp"
  env_vars:
    TMPDIR: "{tmpdir}"
    PYTHONUNBUFFERED: "1"
  # 子命令级线程建议（高于用户显式 --threads 时仍以用户为准）
  per_subcommand_threads:
    refine: 8      # refine 为 CPU 密集，优先多线程
    default: 4

execution:
  entrypoint: "python main.py"
  test_command: "bash test/run_test.sh"
  binary: "isoseq3"
