# bwa native Conda 环境配方（离线 / 非容器兜底备选）
# 在线推荐直接：mamba create -n bwa -c conda-forge -c bioconda bwa=0.7.19
# 说明：官方镜像（quay.io/biocontainers/bwa）即由 bioconda 本环境构建；
#       main.py 直接调用 PATH 上的 bwa 可执行（conda env 激活后即生效），
#       本地不再自建 Dockerfile/Apptainer.def（见模块 README「环境安装」）。
name: bwa-native
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - bwa=0.7.19
  - pyyaml>=6.0
