# fastqc / snakemake-wrappers 官方实现说明 + 本地 Schema 副本
# ---------------------------------------------------------------------------
# source_type: official —— 仅保留说明、wrapper 骨架与统一 Schema；不重写源码。
# 真正执行仍需 Snakemake 运行时解析 wrapper 句柄并联网/本地缓存获取 wrapper.py。
# ---------------------------------------------------------------------------

id: fastqc_snakemake_wrappers
version: "v3.13.0"
software: fastqc
type: snakemake_wrappers
source_type: official

summary: "snakemake-wrappers 官方 bio/fastqc wrapper 说明 + 本地引用（单 wrapper：FASTQ → html/zip）."

agent_guidance:
  when_to_use: "Snakemake 流程中优先选用官方 wrapper；缺失参数（-k/-c 等）时降级 fastqc_snakemake_local / fastqc_native。"
  recommendation_priority: "Medium（Snakemake 流程引擎场景使用；CLI/Agent 直调请走 native）。"
  setup: |
    在 Snakefile 中通过 wrapper: "v3.13.0/bio/fastqc" 引用。
    本目录仅存 wrapper 骨架拷贝与本地使用示例，不做官方源码再分发。

# 版本对齐：本实现 meta.version 记录 snakemake-wrappers 仓库 tag；
# fastqc 上游二进制版本以 wrapper 内部 environment.yaml 的 conda pin 为准。
software_versions:
  wrapper_tag: "v3.13.0"
  fastqc: "0.12.1"
  source: "bioconda fastqc=0.12.1 + snakemake-wrapper-utils=0.9.0（bio/fastqc/environment.yaml）"
  note: "snakemake-wrappers 与 nf-core 当前都 fastqc=0.12.1；若 wrapper tag < v3.13，可能仍是 0.11.9 / 0.12.0。"

source_reference:
  repository: "https://github.com/snakemake/snakemake-wrappers"
  wrapper_url: "https://snakemake-wrappers.readthedocs.io/en/stable/wrappers/fastqc.html"
  wrapper_repo: "snakemake/snakemake-wrappers"
  wrapper_path: "bio/fastqc"
  wrapper_base: "bio/fastqc"
  tag: "v3.13.0"
  submodules:
    # fastqc 是单 wrapper；此处保留 1 条作为统一字段。
    - "fastqc"
  submodules_note: >
    参考目录 https://github.com/snakemake/snakemake-wrappers/tree/master/bio/fastqc。
    bio/fastqc 是单 wrapper，不分子命令。若 snakemake-wrappers 未来拆出 bio/fastqc/<cmd>，
    请以官方在线目录为准刷新本列表。

inputs:
  - name: reads
    type: file/list(file)
    required: true
    format: [fastq, fastq.gz]
    description: "FASTQ / FASTQ.gz（支持单/双端）"

outputs:
  - name: html
    type: file
    pattern: "qc/{sample}_fastqc.html"
    description: "FastQC HTML report"
  - name: zip
    type: file
    pattern: "qc/{sample}_fastqc.zip"
    description: "FastQC zip archive（内含原始模块数据与汇总 txt）"

params:
  extra:
    type: string
    default: ""
    description: "透传 fastqc 额外参数（如 -k/-c/-a/--nogroup 等）"
  log_dir:
    type: string
    default: "logs/"

execution:
  mode: snakemake_rule
  wrapper_template: "v3.13.0/bio/fastqc"
  entrypoint: "snakemake_rule"
  rule_example: |
    rule fastqc:
        input:  "raw/{sample}.fq.gz"
        output:
            html="qc/{sample}_fastqc.html",
            zip="qc/{sample}_fastqc.zip"
        log:    "logs/fastqc/{sample}.log"
        params: extra=""
        threads: 4
        wrapper: "v3.13.0/bio/fastqc"
  include_ref: |
    rule fastqc:
        input:  "raw/{sample}.fq.gz"
        output:
            html="qc/{sample}_fastqc.html",
            zip="qc/{sample}_fastqc.zip"
        log:    "logs/fastqc/{sample}.log"
        params: extra=""
        threads: 4
        wrapper: "v3.13.0/bio/fastqc"

optimization:
  default_cpus: 4
  default_mem_mb: 8192
