# fastqc snakemake local 占位元数据

id: fastqc_snakemake_local
version: "0.0.0-placeholder"
software: fastqc
type: snakemake_local
source_type: custom

summary: "自定义 Snakemake FastQC rule 占位。按 README 启用。"
agent_guidance:
  when_to_use: "snakemake-wrappers 官方 wrapper 参数不足时启用。"
  enabled: false  # 占位：未补 rule_*.smk / inputs/outputs 前，Agent 不得路由到此实现。
  recommendation_priority: "Low（snakemake-wrappers 优先）。"

software_versions:
  status: placeholder
  note: "本地 Snakemake 自维护 FastQC rule 尚未填充版本信息；实际启用时需按具体 rule 执行来源补 fastqc 版本、JDK 版本与构建路线。"

inputs:
  reads: { required: true }
outputs:
  html: { pattern: "qc/{sample}_fastqc.html" }
  zip:  { pattern: "qc/{sample}_fastqc.zip"  }

execution:
  entrypoint: "snakemake_rule"
  status: placeholder
