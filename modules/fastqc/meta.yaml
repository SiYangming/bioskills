software: fastqc
canonical: fastqc
category: qc
description: 'FastQC 是高通量测序原始 reads 的质量控制工具，输出 HTML 报告与 zip 结果包， 覆盖碱基质量、GC 含量、接头污染、重复序列、N
  含量、kmer 过载等常见质控维度。

  '
homepage: https://www.bioinformatics.babraham.ac.uk/projects/fastqc/
license: GPL-3.0-or-later
implementations:
- id: fastqc_native
  path: native
  source_type: custom
  type: native
  version: 0.12.1-v1.0
  priority: high
  when_to_use: 非流程引擎场景（AI Agent Function Calling / 独立 CLI）首选。自动注入 JVM 内存与线程优化。
  container_ref:
    bioconda: https://anaconda.org/bioconda/fastqc
    quay_biocontainers: quay.io/biocontainers/fastqc
    install_hint: 推荐 mamba create -n <env> -c conda-forge -c bioconda <sw>；容器可用 quay.io/biocontainers
      镜像
- id: fastqc_nextflow_nfcore
  path: nextflow
  source_type: official
  type: nextflow_local
  version: 2.1.0
  priority: medium
  when_to_use: 组装 Nextflow DSL2 流程、目标 HPC/Cloud 时。
- id: fastqc_snakemake_wrappers
  path: snakemake
  source_type: official
  type: snakemake_local
  version: v3.13.0
  priority: medium
  when_to_use: 组装 Snakemake 流程、复用中央 wrapper 缓存时。
default_implementation: fastqc_native
software_versions:
  native:
    fastqc: 0.12.1
    java: openjdk-17-jre-headless (apt bookworm)
    source: https://www.bioinformatics.babraham.ac.uk/projects/fastqc/fastqc_v0.12.1.zip
    note: bookworm apt 不提供 fastqc 二进制，故走官方 zip + apt JVM。版本与官方 Conda 对齐。
  nextflow_nfcore:
    fastqc: 0.12.1
    module_version: 2.1.0
    source: bioconda::fastqc=0.12.1（modules/nf-core/fastqc/environment.yml）
    note: 'Container: community.wave.seqera.io/library/fastqc:0.12.1--… 可能也为 0.12.1；升级
      modules 时请同步刷新。'
  nextflow_local:
    fastqc: （继承容器镜像，未固定；建议跟随 native 的 bookworm + Babraham zip）
  snakemake_wrappers:
    fastqc: 0.12.1
    wrapper_tag: v3.13.0
    wrapper_utils: 0.9.0
    source: bioconda fastqc=0.12.1 + snakemake-wrapper-utils=0.9.0（bio/fastqc/environment.yaml）
    note: 历史 tag < v3.13 的 environment.yaml 曾停留在 0.11.9 / 0.12.0；切 tag 后务必核对。
  snakemake_local:
    fastqc: （继承容器镜像，未固定；建议跟随 native）
inputs:
  reads:
    type: file
    required: true
    cli_arg: positional
    description: 输入 FASTQ（支持 .fastq / .fq / .fastq.gz / .fq.gz，多个文件可用多入参）
  outdir:
    type: string
    required: false
    cli_arg: -o
    description: 输出目录（默认 ./fastqc_results）
  threads:
    type: integer
    default: 4
    cli_arg: -t
    description: 线程数（自动注入）
  extract:
    type: boolean
    default: true
    cli_arg: --extract
    description: 自动解压结果 zip
  noextract:
    type: boolean
    default: false
    cli_arg: --noextract
    description: 不自动解压 zip
  nogroup:
    type: boolean
    default: false
    cli_arg: --nogroup
    description: 禁用按碱基位置分组（更慢但更精确）
  format:
    type: string
    required: false
    cli_arg: -f
    description: 强制输入格式（bam/sam/bam_mapped/sam_mapped/fastq/fastq_bismark）
  contaminants:
    type: file
    required: false
    cli_arg: -c
    description: 自定义污染序列列表
  adapters:
    type: file
    required: false
    cli_arg: -a
    description: 自定义接头序列列表
  kmers:
    type: integer
    required: false
    cli_arg: -k
    description: k-mer 长度（2-10，默认 7）
  java_mem_mb:
    type: integer
    default: 8192
    description: JVM 最大堆内存（MB，通过 JAVA_OPTS 注入）
outputs:
  html_report:
    type: file
    format: html
    path_pattern: '{outdir}/{basename}_fastqc.html'
    description: FastQC HTML 报告
  zip_result:
    type: file
    format: zip
    path_pattern: '{outdir}/{basename}_fastqc.zip'
    description: FastQC 结果 zip 包（含每个模块的原始数据）
environment:
  conda: environment.yml
  dockerfile: Dockerfile
  apptainer_def: Apptainer.def
optimization:
  default_cpus: 4
  default_mem_mb: 8192
  env_vars:
    JAVA_OPTS: -Xmx{mem_mb}m -Djava.io.tmpdir={tmpdir}
    TMPDIR: '{tmpdir}'
  per_subcommand_threads:
    default: 4
execution:
  entrypoint: python main.py
  test_command: bash test/run_test.sh
  binary: fastqc
  nextflow_note: 本地 Nextflow 实现见 nextflow/（官方 nf-core 信息见 README）
