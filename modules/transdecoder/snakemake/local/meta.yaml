# transdecoder / snakemake / local — 自维护 Snakemake rule
# ---------------------------------------------------------------------------
# source_type: custom —— 规则迁移自 snakemake.smk/flrnaseq.smk/workflow/rules/transdecoder.smk，
# 去掉对 Snakefile 顶部全局变量（SAMPLES / os / directory / config）的依赖：
#   - SAMPLES 的 lambda 输入改为路径模板 long_read/{sample}.fasta
#   - config 的 transdecoder_dir 改为规则内输出路径模板
#   - config 的 params 改为规则内显式默认值（与 flrnaseq config.yaml transdecoder 段一致）
#   - docker/container 分支移除，直接调用本地 TransDecoder 二进制（或 conda env）
# ---------------------------------------------------------------------------

id: transdecoder_snakemake_local
version: "0.1.0"
software: transdecoder
type: snakemake_local
source_type: custom

summary: "Self-maintained Snakemake rules for transdecoder（迁移自 flrnaseq.smk/workflow/rules/transdecoder.smk 的真实规则：LongOrfs + Predict 两步）."

agent_guidance:
  when_to_use: "Snakemake 流程中需要 TransDecoder 做转录本 ORF/CDS 预测时；官方 wrapper 缺失或需定制时本 rule 为 Snakemake 场景主路径。"
  recommendation_priority: "Medium（Snakemake 流程引擎场景；CLI/Agent 直调请走 native）。"
  enabled: true

# 本实现实际运行的上游二进制版本 + 迁移来源
software_versions:
  transdecoder: "5.7.1"
  source: "自维护 transdecoder.smk（迁移自 flrnaseq.smk/workflow/rules/transdecoder.smk；conda 建议 bioconda::transdecoder=5.7.1 + perl + parallel）"
  note: "原规则依赖 Snakefile 顶部的 SAMPLES / os / config；迁移后输入用路径模板 long_read/{sample}.fasta，参数内联（longorfs_extra_params: -m 50 -G Universal -S --complete_orfs_only；predict_extra_params: --no_refine_starts）。"

inputs:
  fasta:
    type: file
    format: fasta
    required: true
    description: "输入转录本 FASTA（路径模板 long_read/{sample}.fasta）"

outputs:
  longorfs_dir:
    type: directory
    description: "LongOrfs 中间目录（transdecoder/{sample}/longorfs/）"
  pep:
    type: file
    format: fasta
    description: "预测蛋白序列（transdecoder/{sample}/predict/{sample}.pep）"
  cds:
    type: file
    format: fasta
    description: "预测 CDS 核酸序列"
  gff3:
    type: file
    format: gff3
    description: "CDS 注释"
  bed:
    type: file
    format: bed
    description: "CDS 区间"

execution:
  mode: snakemake_rule
  rule_files:
    - "transdecoder.smk"
  include_hint: |
    # 在 Snakefile 中：
    include: "modules/transdecoder/snakemake/local/transdecoder.smk"
  conda_hint: "规则内 conda 指向 envs/transdecoder.yaml（内容：bioconda::transdecoder=5.7.1 + perl + parallel）"
