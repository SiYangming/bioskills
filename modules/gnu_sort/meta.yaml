software: gnu_sort
canonical: gnu_sort
category: utility
description: 'GNU coreutils 的 sort 程序：对文本行进行排序（支持 -k 键、-n 数值、-S 缓冲区、 --parallel 等），是
  isoseq.smk 等流程中 GTF 按染色体+起始位点排序的基础工具 （sort -k1,1 -k4,4n）。

  '
homepage: https://www.gnu.org/software/coreutils/
license: GPL-3.0-or-later
implementations:
- id: gnu_sort_native
  path: native
  source_type: custom
  type: native
  version: 9.1-v1.0
  priority: high
  when_to_use: 非流程引擎场景（AI Agent Function Calling / 独立 CLI）首选。直接调用 GNU/系统 sort 二进制。
  container_ref:
    bioconda: https://anaconda.org/bioconda/gnu_sort
    quay_biocontainers: quay.io/biocontainers/gnu_sort
    install_hint: 推荐 mamba create -n <env> -c conda-forge -c bioconda <sw>；容器可用 quay.io/biocontainers
      镜像
- id: gnu_sort_snakemake_wrappers
  path: snakemake
  source_type: official
  type: snakemake_local
  version: v3.13.0
  priority: medium
  when_to_use: Snakemake 流程、复用中央 wrapper 缓存时（注意：官方暂缺 gnu sort wrapper，见下方说明）。
default_implementation: gnu_sort_native
software_versions:
  native:
    gnu_sort: '9.1'
    coreutils: '9.1'
    build_route: 'APT：Debian bookworm coreutils=9.1（binary: sort）'
    source: apt coreutils=9.1-1（Debian bookworm stable）
    note: sort -k1,1 -k4,4n 等核心选项 GNU/BSD 均支持；--parallel 仅 GNU 提供（main.py 自动检测）。
  nextflow_nfcore:
    gnu_sort: '9.5'
    coreutils: '9.5'
    module_version: master（2026-08 抓取；install 时由 nf-core tools 写实际 commit）
    source: conda-forge::coreutils=9.5（modules/nf-core/gnu/sort/environment.yml）
    note: nf-core 拆分为 gnu/sort 与 gnu/split 两个子模块；本软件对应 gnu/sort（排序）。
  nextflow_local:
    gnu_sort: （继承 native 容器或显式 pin；未启用则写占位）
  snakemake_wrappers:
    gnu_sort: 无官方 wrapper
    wrapper_tag: v3.13.0
    source: https://api.github.com/repos/snakemake/snakemake-wrappers/contents/bio/gnu
      → 404
    note: snakemake-wrappers 官方 bio/ 目录无 gnu/sort（2026-08 核对）；必须降级使用 gnu_sort_snakemake_local。
  snakemake_local:
    gnu_sort: 9.1（规则从 snakemake.smk/isoseq.smk/workflow/modules/gnu_sort/snakemake/gnu_sort.smk
      迁移，sort <args> <in> > <out>.sorted）
