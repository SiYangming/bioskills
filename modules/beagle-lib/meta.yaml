software: beagle-lib
canonical: beagle-lib
category: phylogenetics
description: 'BEAGLE（Broad-platform Evolutionary Analysis General Likelihood Evaluator）3.1.2 是
  高性能的系统发育似然计算库（C/C++，支持 CPU/SSE/AVX），为 BEAST/BEAST2/MrBayes 等提供加速；
  本身是库（libhmsbeagle）而非可执行程序，通过 pkg-config（hmsbeagle-1）与 PKG_CONFIG_PATH /
  LD_LIBRARY_PATH / C_INCLUDE_PATH 供上层工具链接，是分子钟分析中 BEAGLE 加速库环节的组件。

  '
homepage: https://github.com/beagle-dev/beagle-lib
license: LGPL-3.0
software_versions:
- id: beagle_lib_native
  beagle-lib: '3.1.2'
  build_route: official biocontainer（quay.io/biocontainers/beagle-lib / depot.galaxyproject.org）
  source: https://anaconda.org/bioconda/beagle-lib；官方源码 https://github.com/beagle-dev/beagle-lib/archive/v3.1.2.tar.gz（2026-09
    核实 200，sha256 dd872b48…）
  note: 官方渠道覆盖 3.1.2（bioconda beagle-lib 3.1.2；quay/depot tag 3.1.2--h503566f_5）；native
    以官方源码 3.1.2 编译为准（./autogen.sh + ./configure + make install），conda 兜底装 beagle-lib=3.1.2。
- id: beagle_lib_nextflow_nfcore
  beagle-lib: 官方无模块（modules/nf-core/beagle-lib 404）
  source: —（2026-09 抓取 nf-core/modules modules/nf-core/beagle-lib/meta.yml 返回 404）
  note: 本模块未建 nextflow/ 目录；流程引擎场景请以 native/main.py 兜底。
- id: beagle_lib_snakemake_wrappers
  beagle-lib: 官方无 wrapper（bio/beagle-lib 404）
  source: —（2026-09 抓取 snakemake-wrappers bio/beagle-lib/environment.yaml 返回 404）
  note: 本模块未建 snakemake/ 目录；Snakemake 场景请以 native/main.py 兜底。
- id: beagle_lib_nextflow_local
  beagle-lib: 未启用（未建 nextflow/ 目录；需要时以 native/main.py 兜底）
- id: beagle_lib_snakemake_local
  beagle-lib: 未启用（未建 snakemake/ 目录；需要时以 native/main.py 兜底）
implementations:
- id: beagle_lib_native
  path: native
  source_type: custom
  type: native
  version: '3.1.2'
  priority: high
  when_to_use: '非流程引擎场景（AI Agent Function Calling / 独立 CLI / Shell）安装/校验 BEAGLE 库；
    install 子命令源码编译安装到 --prefix，verify/flags 子命令用 pkg-config 校验与取链接参数。'
  container_ref:
    bioconda: https://anaconda.org/bioconda/beagle-lib
    quay_biocontainers: quay.io/biocontainers/beagle-lib
    galaxyproject_depot: https://depot.galaxyproject.org/singularity/beagle-lib%3A3.1.2--h503566f_5
    install_hint: 推荐 mamba create -n <env> -c conda-forge -c bioconda beagle-lib=3.1.2；容器可用
      quay.io/biocontainers/beagle-lib:3.1.2--h503566f_5；官方源码 3.1.2 用 native/install.sh --method source
      编译
default_implementation: beagle_lib_native
inputs:
  subcommand:
    type: string
    required: true
    description: 'beagle-lib 子命令：install（源码编译安装到 --prefix）| verify（pkg-config 校验）|
      flags（打印 cflags/libs）'
  prefix:
    type: string
    default: ~/software/beagle-lib-3.1.2
    description: BEAGLE 库安装前缀（install 目标；verify/flags 据此设置 PKG_CONFIG_PATH）
  source_dir:
    type: string
    required: false
    description: install：源码目录（默认当前目录，需含 autogen.sh / configure.ac）
  extra_args:
    type: string
    required: false
    description: install：透传给 ./configure 的额外参数（如 --enable-sse / --enable-avx）
  threads:
    type: integer
    default: 4
    description: 线程数（install 注入 make -j N）
outputs:
  library:
    type: file
    description: BEAGLE 共享库（<prefix>/lib/libhmsbeagle.so*）与头文件（<prefix>/include/libhmsbeagle-1/）
  pkgconfig:
    type: file
    description: pkg-config 元数据（<prefix>/lib/pkgconfig/hmsbeagle-1.pc）
environment:
  container_official: quay.io/biocontainers/beagle-lib（bioconda 官方镜像；tag 以 quay / depot.galaxyproject.org
    为准，见 README「容器与 Conda 链接」）
  note: 官方镜像已覆盖（bioconda/quay/depot），本地不再维护 Dockerfile/Apptainer.def；宿主机直跑
    main.py 时用 conda/mamba 安装 beagle-lib，或用 native/install.sh 源码编译官方 3.1.2。
optimization:
  default_cpus: 4
  default_mem_mb: 8192
  tmpdir: /tmp
  env_vars:
    TMPDIR: '{tmpdir}'
    PYTHONUNBUFFERED: '1'
  per_subcommand_threads:
    install: 8
    default: 4
execution:
  entrypoint: python main.py
  test_command: bash test/run_test.sh
  binary: pkg-config
