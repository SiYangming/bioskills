software: bamtools
canonical: bamtools
category: alignment_utils
description: 'BamTools 是操作 BAM 文件的高通量测序工具集，提供格式转换（convert）、 统计（stats/count）、过滤（filter）、索引（index）、排序（sort）等核心能力。
  Iso-Seq 流程中常用于把 refine 后的 BAM 转换为 FASTA/FASTQ，供下游 TAMA 等使用。

  '
homepage: https://github.com/pezmaster31/bamtools
license: MIT
software_versions:
  native:
    bamtools: 2.5.2
    build_route: apt（debian:bookworm-slim，bamtools=2.5.2+dfsg-4）
    source: https://packages.debian.org/bookworm/bamtools
    note: bookworm 官方 apt 提供 2.5.2+dfsg-4；bioconda 侧最新已到 2.5.3（见 snakemake-wrappers），2.5.x
      内部 API 兼容。
  nextflow_nfcore:
    bamtools: 2.5.2
    module_version: master@ad1de30（modules/nf-core/bamtools/convert）
    source: bioconda::bamtools=2.5.2（modules/nf-core/bamtools/*/environment.yml）
    note: nf-core 将 bamtools 拆为 convert / split / stats 三个子模块；升级 modules 时请同步刷新。
  nextflow_local:
    bamtools: （继承 native 容器或显式 pin；未启用则写占位）
  snakemake_wrappers:
    bamtools: 2.5.3
    wrapper_tag: v3.13.0
    source: bioconda bamtools=2.5.3（bio/bamtools/*/environment.yaml）
    note: bio/bamtools 仅有 filter / filter_json / split / stats 四个 wrapper，无 convert；convert
      请走 native 或 nf-core。
  snakemake_local:
    bamtools: （继承 native 容器或显式 pin；未启用则写占位）
implementations:
- id: bamtools_native
  path: native
  source_type: custom
  type: native
  version: 2.5.2-v1.0
  priority: high
  when_to_use: '非流程引擎场景（AI Agent Function Calling / 独立 CLI / Shell 调用）的首选目标， 覆盖 convert/count/stats/header/index/sort
    子命令。

    '
  container_ref:
    bioconda: https://anaconda.org/bioconda/bamtools
    quay_biocontainers: quay.io/biocontainers/bamtools
    install_hint: 推荐 mamba create -n <env> -c conda-forge -c bioconda <sw>；容器可用 quay.io/biocontainers
      镜像
- id: bamtools_snakemake_wrappers
  path: snakemake
  source_type: official
  type: snakemake_local
  version: v3.13.0
  priority: medium
  when_to_use: 组装 Snakemake 流程、复用中央 wrapper 缓存时。
default_implementation: bamtools_native
