# sra-tools native 自包含实现元数据
# ---------------------------------------------------------------------------
# source_type: custom —— 本地全量自维护，不依赖官方 wrapper 源码。
# bioconda sra-tools 包提供三个可执行：prefetch（下载 SRA）/ fasterq-dump（SRA->FASTQ，
# 多线程快速版）/ fastq-dump（SRA->FASTQ，兼容旧版），本实现把 nanoseq 的
# batch_prefetch.sh + batch_sra_to_fastq*.sh 三段链路拆为三个子命令。
# ---------------------------------------------------------------------------

id: sra-tools_native
version: "3.4.1-v1.0"
software: sra-tools
type: native
source_type: custom

summary: "Self-contained SRA Toolkit runner，覆盖 prefetch（下载 SRA）/ fasterq-dump（快速转 FASTQ）/ fastq-dump（兼容转 FASTQ），自动注入线程与临时目录。"
software_versions:
  sra_tools: "latest（示例 pin 3.4.1；bioconda 当前最新）"
  source: "bioconda::sra-tools=3.4.1（micromamba 引导的 /opt/env；environment.yml 已 pin）"
  note: "sra-tools 不在 Debian bookworm apt，容器走 bookworm-slim + micromamba + bioconda 路线；
         包内三个可执行 prefetch / fasterq-dump / fastq-dump 均可用。与 snakemake-wrappers 锚点 sra-tools=3.4.1 一致；nf-core 锚点为 3.2.1。"

agent_guidance:
  when_to_use: "AI Agent Function Calling 或独立 Python/Shell CLI 调用时优先使用本实现。"
  recommendation_priority: "High（非流程引擎场景的主执行目标）"

# ---- 统一输入接口（JSON Schema 导出依据）-------------------------------- #
inputs:
  subcommand:
    type: string
    required: true
    description: "sra-tools 子命令：prefetch|fasterq-dump|fastq-dump"
  srr_id:
    type: string
    required: false
    cli_arg: positional
    description: "SRA accession（如 SRR12345678；prefetch/fasterq-dump 使用）"
  sra_file:
    type: file
    required: false
    cli_arg: positional
    description: "本地 .sra 文件（fastq-dump 使用；fasterq-dump 也可用）"
  output_dir:
    type: string
    required: false
    cli_arg: "-O"
    description: "输出目录（prefetch 的下载目录 / dump 的 FASTQ 输出目录）"
  output:
    type: string
    required: false
    cli_arg: "-o"
    description: "输出文件名/前缀（fasterq-dump 使用）"
  split_3:
    type: boolean
    default: true
    cli_arg: "--split-3"
    description: "双端数据拆分为 *_1/*_2 + 未配对（nanoseq 脚本默认）"
  gzip:
    type: boolean
    default: true
    cli_arg: "--gzip"
    description: "输出 .fastq.gz（fastq-dump 原生支持；fasterq-dump 3.x 亦支持）"
  prefetch_options:
    type: string
    default: "-f yes -t http"
    cli_arg: "positional"
    description: "prefetch 附加选项（nanoseq 默认 -f yes -t http：强制重下 + HTTP 协议）"
  threads:
    type: integer
    default: 4
    cli_arg: "-e"
    description: "线程数（fasterq-dump 自动注入 -e）"
  extra_args:
    type: string
    required: false
    description: "透传给 sra-tools 子命令的额外参数（高级用法，慎用）"

outputs:
  sra:
    type: file
    format: sra
    description: "prefetch 下载的 SRA 文件（<outdir>/<srr_id>/<srr_id>.sra）"
  fastq:
    type: file
    format: fastq
    description: "fasterq-dump / fastq-dump 输出的 FASTQ（--gzip 时为 .fastq.gz）"

# ---- 本地环境配方与性能优化（custom 模块独有）--------------------------- #
environment:
  conda: "environment.yml"
  dockerfile: "Dockerfile"
  apptainer_def: "Apptainer.def"

optimization:
  default_cpus: 4
  default_mem_mb: 8192
  tmpdir: "/tmp"
  env_vars:
    TMPDIR: "{tmpdir}"
    PYTHONUNBUFFERED: "1"
  # 子命令级线程建议（高于用户显式 --threads 时仍以用户为准）
  per_subcommand_threads:
    fasterq-dump: 8      # 快速转 FASTQ 为 IO/CPU 密集，优先多线程
    fastq-dump: 4
    prefetch: 2
    default: 4

execution:
  entrypoint: "python main.py"
  test_command: "bash test/run_test.sh"
  binary: "prefetch"
