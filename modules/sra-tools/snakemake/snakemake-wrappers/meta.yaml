# sra-tools / snakemake / snakemake-wrappers 说明模块
# ---------------------------------------------------------------------------
# source_type: official —— 仅保留说明、桥接脚本与接口 Schema，不重写源码。
# 官方 bio/sra-tools 目前只有 fasterq-dump 一个 wrapper（2026-09 抓取）；
# prefetch / fastq-dump 缺失，请使用 sra-tools_snakemake_local（sra_tools.smk）。
# ---------------------------------------------------------------------------

id: sra-tools_snakemake_wrappers
version: "v3.13.0"
software: sra-tools
type: snakemake_wrappers
source_type: official

summary: "Official Snakemake Wrappers for sra-tools (bio/sra-tools/fasterq-dump：SRA->FASTQ 快速转换；prefetch/fastq-dump 缺失走 local)."

agent_guidance:
  when_to_use: "组装 Snakemake 流程、复用中央 wrapper 缓存时；bio/sra-tools 目前仅 fasterq-dump 可用。"
  recommendation_priority: "Medium（Snakemake 流程引擎场景使用；CLI/Agent 直调请走 native）。"

software_versions:
  wrapper_tag: "v3.13.0"
  sra_tools: "3.4.1"
  source: "bioconda sra-tools=3.4.1 + pigz=2.8 + pbzip2=1.1.13 + snakemake-wrapper-utils=0.9.0（bio/sra-tools/fasterq-dump/environment.yaml）"
  note: "官方 bio/sra-tools 仅 fasterq-dump 一个 wrapper（2026-09 抓取）；prefetch / fastq-dump 场景请使用 sra-tools_snakemake_local。"

source_reference:
  repository: "https://github.com/snakemake/snakemake-wrappers"
  wrapper_base: "bio/sra-tools"
  tag: "v3.13.0"
  submodules:
    - "fasterq-dump"
  submodules_note: >
    2026-09 抓取 https://api.github.com/repos/snakemake/snakemake-wrappers/contents/bio/sra-tools
    仅返回 fasterq-dump 一个子目录；prefetch / fastq-dump 官方未收录。
    列表以 https://github.com/snakemake/snakemake-wrappers/tree/master/bio/sra-tools 在线目录为准。

inputs:
  sra:
    type: file
    format: sra
    required: true
    description: "输入 .sra 文件（fasterq-dump）"

outputs:
  fastq:
    type: file
    format: [fastq, fastq.gz]
    description: "输出 FASTQ（--split-3 时为 *_1/_2）"

params:
  extra:
    type: string
    default: ""
    description: "sra-tools 子命令额外参数（如 --split-3 --gzip）"

execution:
  mode: snakemake_rule
  wrapper_template: "v3.13.0/bio/sra-tools/{subcommand}"
  rule_example: |
    rule sra_fasterq_dump:
        input:  "sra/{sample}.sra"
        output: "fastq/{sample}.fastq"
        log:    "logs/sra-tools/fasterq-dump/{sample}.log"
        params: extra="--split-3"
        threads: 8
        wrapper: "v3.13.0/bio/sra-tools/fasterq-dump"
