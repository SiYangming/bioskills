# sra-tools 软件级总览元数据
# ---------------------------------------------------------------------------
# 汇总本软件在技能库中的所有可用实现类型与推荐优先级。
# 上层 Agent 通过本文件快速判断：该软件是否已收录、应优先走哪条实现路径。
# 实现路径结构：
#   modules/<software>/
#   ├── native/
#   ├── nextflow/nf-core/    # 官方 nf-core/modules（source_type: official）
#   │       local/            # 自定义 Nextflow 模块（source_type: custom）
#   └── snakemake/snakemake-wrappers/  # 官方 snakemake-wrappers（official）
#           local/              # 自定义 Snakemake 实现（source_type: custom）
# ---------------------------------------------------------------------------

software: sra-tools
canonical: sra-tools
category: data_acquisition
description: >
  NCBI SRA Toolkit（sra-tools）是 SRA 数据库数据的标准存取工具集：
  prefetch 下载 SRA 文件、fasterq-dump / fastq-dump 将 SRA 转为 FASTQ，
  是 nanoseq 流程的原始数据获取环节（batch_prefetch.sh + batch_sra_to_fastq*.sh）。

homepage: https://github.com/ncbi/sra-tools
license: Public Domain

# 各实现支持/可获得性说明：sra-tools 不在 Debian bookworm apt 源，只能走 bioconda（micromamba 引导）。
software_versions:
  - id: sra-tools_native
    sra_tools: "latest（示例 pin 3.4.1，bioconda 当前最新）"
    source: "bioconda::sra-tools=3.4.1（environment.yml 已 pin；容器走 bookworm-slim + micromamba 引导 /opt/env）"
    note: "bioconda sra-tools 包提供三个可执行：prefetch / fasterq-dump / fastq-dump；native 子命令一一对应。"
  - id: sra-tools_nextflow_nfcore
    module_version: "nf-core master（2026-09 抓取）"
    sra_tools: "3.2.1"
    source: "bioconda::sra-tools=3.2.1 + pigz=2.8（modules/nf-core/sratools/{fasterqdump,prefetch}/environment.yml）"
    note: "nf-core 模块目录名为 sratools（无连字符，与 canonical sra-tools 不同）；子模块 fasterqdump + prefetch。"
  - id: sra-tools_snakemake_wrappers
    wrapper_tag: "v3.13.0"
    sra_tools: "3.4.1"
    source: "bioconda sra-tools=3.4.1 + pigz=2.8 + snakemake-wrapper-utils=0.9.0（bio/sra-tools/fasterq-dump/environment.yaml）"
    note: "官方 bio/sra-tools 目前只有 fasterq-dump 一个 wrapper；prefetch 场景请使用 sra-tools_snakemake_local。"
  - id: sra-tools_nextflow_local
    sra_tools: "未固定（用户按 main.nf 中 conda/container 自行声明）"
  - id: sra-tools_snakemake_local
    sra_tools: "latest"
    source: "自维护 sra_tools.smk（迁移自 snakemake.smk/nanoseq.smk/nanoseq.sh/batch_prefetch.sh + batch_sra_to_fastq*.sh）"
    note: "rule 内 conda 指向 bioconda::sra-tools（prefetch / fasterq-dump / fastq-dump）。"

# 可用实现清单（按推荐优先级排序）
implementations:
  - id: sra-tools_native
    path: native
    source_type: custom
    type: native
    version: "3.4.1-v1.0"
    priority: high
    when_to_use: >
      非流程引擎场景（AI Agent Function Calling / 独立 CLI / Shell 调用）的首选目标。
      覆盖 prefetch / fasterq-dump / fastq-dump 三段链路，自动注入线程。

  - id: sra-tools_nextflow_nfcore
    path: nextflow/nf-core
    source_type: official
    type: nextflow_nfcore
    version: "master"
    priority: medium
    when_to_use: 组装 Nextflow DSL2 流程、目标为 HPC/Cloud 时。
    note: "nf-core 模块目录名为 sratools（fasterqdump + prefetch），安装命令 nf modules install nf-core sratools/<sub>。"

  - id: sra-tools_nextflow_local
    path: nextflow/local
    source_type: custom
    type: nextflow_local
    version: ""
    priority: low
    when_to_use: nf-core 子模块缺失（如需要 fastq-dump）或需要本地定制的 Nextflow 模块。

  - id: sra-tools_snakemake_wrappers
    path: snakemake/snakemake-wrappers
    source_type: official
    type: snakemake_wrappers
    version: "v3.13.0"
    priority: medium
    when_to_use: 组装 Snakemake 流程、复用中央 wrapper 缓存时。
    note: "官方 bio/sra-tools 目前只有 fasterq-dump 一个 wrapper；prefetch/fastq-dump 请走 sra-tools_snakemake_local。"

  - id: sra-tools_snakemake_local
    path: snakemake/local
    source_type: custom
    type: snakemake_local
    version: "0.1.0"
    priority: low
    when_to_use: snakemake-wrappers 缺失子模块（prefetch / fastq-dump 正是如此），使用自维护 sra_tools.smk。

# 默认推荐路径（Agent 路由用）
default_implementation: sra-tools_native
