software: sra-tools
canonical: sra-tools
category: data_acquisition
description: 'NCBI SRA Toolkit（sra-tools）是 SRA 数据库数据的标准存取工具集： prefetch 下载 SRA 文件、fasterq-dump
  / fastq-dump 将 SRA 转为 FASTQ， 是 nanoseq 流程的原始数据获取环节（batch_prefetch.sh + batch_sra_to_fastq*.sh）。

  '
homepage: https://github.com/ncbi/sra-tools
license: Public Domain
software_versions:
- id: sra-tools_native
  sra_tools: latest（示例 pin 3.4.1，bioconda 当前最新）
  source: bioconda::sra-tools=3.4.1（environment.yml 已 pin；容器走 bookworm-slim + micromamba
    引导 /opt/env）
  note: bioconda sra-tools 包提供三个可执行：prefetch / fasterq-dump / fastq-dump；native 子命令一一对应。
- id: sra-tools_nextflow_nfcore
  module_version: nf-core master（2026-09 抓取）
  sra_tools: 3.2.1
  source: bioconda::sra-tools=3.2.1 + pigz=2.8（modules/nf-core/sratools/{fasterqdump,prefetch}/environment.yml）
  note: nf-core 模块目录名为 sratools（无连字符，与 canonical sra-tools 不同）；子模块 fasterqdump + prefetch。
- id: sra-tools_snakemake_wrappers
  wrapper_tag: v3.13.0
  sra_tools: 3.4.1
  source: bioconda sra-tools=3.4.1 + pigz=2.8 + snakemake-wrapper-utils=0.9.0（bio/sra-tools/fasterq-dump/environment.yaml）
  note: 官方 bio/sra-tools 目前只有 fasterq-dump 一个 wrapper；prefetch 场景请使用 sra-tools_snakemake_local。
- id: sra-tools_nextflow_local
  sra_tools: 未固定（用户按 main.nf 中 conda/container 自行声明）
- id: sra-tools_snakemake_local
  sra_tools: latest
  source: 自维护 sra_tools.smk（迁移自 snakemake.smk/nanoseq.smk/nanoseq.sh/batch_prefetch.sh
    + batch_sra_to_fastq*.sh）
  note: rule 内 conda 指向 bioconda::sra-tools（prefetch / fasterq-dump / fastq-dump）。
implementations:
- id: sra-tools_native
  path: native
  source_type: custom
  type: native
  version: 3.4.1-v1.0
  priority: high
  when_to_use: '非流程引擎场景（AI Agent Function Calling / 独立 CLI / Shell 调用）的首选目标。 覆盖 prefetch
    / fasterq-dump / fastq-dump 三段链路，自动注入线程。

    '
  container_ref:
    bioconda: https://anaconda.org/bioconda/sra-tools
    quay_biocontainers: quay.io/biocontainers/sra-tools
    install_hint: 推荐 mamba create -n <env> -c conda-forge -c bioconda <sw>；容器可用 quay.io/biocontainers
      镜像
- id: sra-tools_snakemake_wrappers
  path: snakemake
  source_type: official
  type: snakemake_local
  version: v3.13.0
  priority: medium
  when_to_use: 组装 Snakemake 流程、复用中央 wrapper 缓存时。
  note: 官方 bio/sra-tools 目前只有 fasterq-dump 一个 wrapper；prefetch/fastq-dump 请走 sra-tools_snakemake_local。
default_implementation: sra-tools_native
inputs:
  subcommand:
    type: string
    required: true
    description: sra-tools 子命令：prefetch|fasterq-dump|fastq-dump
  srr_id:
    type: string
    required: false
    cli_arg: positional
    description: SRA accession（如 SRR12345678；prefetch/fasterq-dump 使用）
  sra_file:
    type: file
    required: false
    cli_arg: positional
    description: 本地 .sra 文件（fastq-dump 使用；fasterq-dump 也可用）
  output_dir:
    type: string
    required: false
    cli_arg: -O
    description: 输出目录（prefetch 的下载目录 / dump 的 FASTQ 输出目录）
  output:
    type: string
    required: false
    cli_arg: -o
    description: 输出文件名/前缀（fasterq-dump 使用）
  split_3:
    type: boolean
    default: true
    cli_arg: --split-3
    description: 双端数据拆分为 *_1/*_2 + 未配对（nanoseq 脚本默认）
  gzip:
    type: boolean
    default: true
    cli_arg: --gzip
    description: 输出 .fastq.gz（fastq-dump 原生支持；fasterq-dump 3.x 亦支持）
  prefetch_options:
    type: string
    default: -f yes -t http
    cli_arg: positional
    description: prefetch 附加选项（nanoseq 默认 -f yes -t http：强制重下 + HTTP 协议）
  threads:
    type: integer
    default: 4
    cli_arg: -e
    description: 线程数（fasterq-dump 自动注入 -e）
  extra_args:
    type: string
    required: false
    description: 透传给 sra-tools 子命令的额外参数（高级用法，慎用）
outputs:
  sra:
    type: file
    format: sra
    description: prefetch 下载的 SRA 文件（<outdir>/<srr_id>/<srr_id>.sra）
  fastq:
    type: file
    format: fastq
    description: fasterq-dump / fastq-dump 输出的 FASTQ（--gzip 时为 .fastq.gz）
environment:
  conda: environment.yml
  dockerfile: Dockerfile
  apptainer_def: Apptainer.def
optimization:
  default_cpus: 4
  default_mem_mb: 8192
  tmpdir: /tmp
  env_vars:
    TMPDIR: '{tmpdir}'
    PYTHONUNBUFFERED: '1'
  per_subcommand_threads:
    fasterq-dump: 8
    fastq-dump: 4
    prefetch: 2
    default: 4
execution:
  entrypoint: python main.py
  test_command: bash test/run_test.sh
  binary: prefetch
  snakemake_include_hint: '# 在 Snakefile 中：

    include: "modules/sra-tools/snakemake/sra_tools.smk"

    '
  snakemake_rules:
  - sra_tools.smk
