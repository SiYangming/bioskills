software: td2
canonical: td2
category: orf_prediction
description: 'TD2 是 TransDecoder 的继任者（语法兼容），基于预训练蛋白模型（PSAURON 打分 + ORF 长度 极值分析）从转录本中识别编码区：TD2.LongOrfs
  提取候选最长 ORF， TD2.Predict 输出最终 CDS（pep/cds/gff3/bed），支持 MMseqs2 / BlastP / HMMER 证据保留。

  '
homepage: https://github.com/Markusjsommer/TD2
license: MIT
software_versions:
- id: td2_native
  td2: 1.0.6
  note: CONDA 路线：debian:bookworm-slim + apt 运行时 + micromamba 引导 bioconda env（bioconda::td2=1.0.6）；二进制
    TD2.LongOrfs / TD2.Predict。
- id: td2_nextflow_nfcore
  module_version: 'master（2026-09-01 抓取；submodules: longorfs / predict）'
  td2: 1.1.0
  source: bioconda::td2=1.1.0（modules/nf-core/td2/{longorfs,predict}/environment.yml）
  note: nf-core master 当前 pin td2=1.1.0（比 native 的 1.0.6 新）；若 nf-core 回落旧 tag 则可能回到
    1.0.x。
- id: td2_snakemake_wrappers
  wrapper_tag: v3.13.0
  td2: 官方无 wrapper（bio/td2 404）
  source: —（snakemake-wrappers 仓库 bio/td2 目录不存在）
  note: 2026-09-01 抓取 https://api.github.com/repos/snakemake/snakemake-wrappers/contents/bio/td2
    返回 404；Snakemake 场景请使用 td2_snakemake_local。
- id: td2_nextflow_local
  td2: 未固定（用户按 main.nf 中 conda/container 自行声明）
- id: td2_snakemake_local
  td2: 1.0.6（建议；规则迁移自 flrnaseq.smk/workflow/rules/td2.smk，conda 指向 bioconda::td2=1.0.6）
implementations:
- id: td2_native
  path: native
  source_type: custom
  type: native
  version: 1.0.6-v1.0
  priority: high
  when_to_use: '非流程引擎场景（AI Agent Function Calling / 独立 CLI / Shell 调用）的首选目标。

    '
  container_ref:
    bioconda: https://anaconda.org/bioconda/td2
    quay_biocontainers: quay.io/biocontainers/td2
    install_hint: 推荐 mamba create -n <env> -c conda-forge -c bioconda <sw>；容器可用 quay.io/biocontainers
      镜像
- id: td2_snakemake_wrappers
  path: snakemake
  source_type: official
  type: snakemake_local
  version: v3.13.0
  priority: medium
  when_to_use: 组装 Snakemake 流程、复用中央 wrapper 缓存时。
  note: 官方 snakemake-wrappers 暂无 bio/td2 wrapper（2026-09-01 抓取 404），本实现仅登记桥接层，实际请降级
    td2_snakemake_local。
default_implementation: td2_native
inputs:
  subcommand:
    type: string
    required: true
    description: td2 子命令：longorfs | predict
  input:
    type: file
    required: true
    cli_arg: -t
    description: 输入转录本 FASTA（支持 .gz 时由驱动自动解压到 tmpdir）
  output_dir:
    type: string
    required: false
    cli_arg: -O
    description: 输出目录（longorfs：TD2 直接写该目录；predict：指向 LongOrfs 产物目录）
  gene_trans_map:
    type: file
    required: false
    cli_arg: --gene-trans-map
    description: gene-to-transcript 映射文件（LongOrfs；可选）
  min_length:
    type: integer
    default: 90
    cli_arg: -m
    description: 长转录本最小蛋白长度 aa（flrnaseq 默认 -m 90）
  abs_min_length:
    type: integer
    default: 90
    cli_arg: -M
    description: 短转录本最小蛋白长度 aa（flrnaseq 默认 -M 90）
  genetic_code:
    type: integer
    default: 1
    cli_arg: -G
    description: 遗传密码（NCBI 整数代码，默认 1=universal）
  strand_specific:
    type: boolean
    default: false
    cli_arg: -S
    description: 仅分析正义链（strand-specific）
  alt_start:
    type: boolean
    default: false
    cli_arg: --alt-start
    description: 包含替代起始密码子
  all_stopless:
    type: boolean
    default: false
    cli_arg: --all-stopless
    description: 报告无终止密码子序列（不要求起始密码子）
  complete_orfs_only:
    type: boolean
    default: false
    cli_arg: --complete-orfs-only
    description: 丢弃不含终止与起始密码子的 ORF
  retain_mmseqs_hits:
    type: file
    required: false
    cli_arg: --retain-mmseqs-hits
    description: mmseqs 输出（.m8 格式）证据保留
  retain_blastp_hits:
    type: file
    required: false
    cli_arg: --retain-blastp-hits
    description: blastp -outfmt 6 结果证据保留
  retain_hmmer_hits:
    type: file
    required: false
    cli_arg: --retain-hmmer-hits
    description: hmmscan Pfam domain table 证据保留
  psauron_all_frame:
    type: boolean
    default: false
    cli_arg: --psauron-all-frame
    description: 要求 ORF 在跨读框中 PSAURON 得分最高（flrnaseq predict 默认开启）
  all_good:
    type: boolean
    default: false
    cli_arg: --all-good
    description: 报告所有通过 PSAURON 与/或长度过滤的 ORF
  threads:
    type: integer
    default: 4
    cli_arg: --threads
    description: 线程数（自动注入）
  extra_args:
    type: string
    required: false
    description: 透传给 TD2 的额外参数（高级用法，慎用）
outputs:
  pep:
    type: file
    format: fasta
    description: 预测蛋白序列（<prefix>.TD2.pep）
  cds:
    type: file
    format: fasta
    description: 预测 CDS 核酸序列（<prefix>.TD2.cds）
  gff3:
    type: file
    format: gff3
    description: CDS 注释（<prefix>.TD2.gff3）
  bed:
    type: file
    format: bed
    description: CDS 区间（<prefix>.TD2.bed）
  longest_orfs:
    type: file
    format: fasta
    description: LongOrfs 候选（<outdir>/longest_orfs.pep/cds/gff3）
environment:
  conda: environment.yml
  dockerfile: Dockerfile
  apptainer_def: Apptainer.def
optimization:
  default_cpus: 4
  default_mem_mb: 8192
  tmpdir: /tmp
  env_vars:
    TMPDIR: '{tmpdir}'
    PYTHONUNBUFFERED: '1'
  per_subcommand_threads:
    longorfs: 8
    predict: 8
    default: 4
execution:
  entrypoint: python main.py
  test_command: bash test/run_test.sh
  binary: TD2.Predict
  snakemake_include_hint: '# 在 Snakefile 中：

    include: "modules/td2/snakemake/td2.smk"

    '
