software: orffinder
canonical: orffinder
category: orf_prediction
description: 'ORFfinder 是 NCBI 的开放阅读框（ORF）查找工具（本地版），在核酸序列中搜索所有 开放阅读框并给出蛋白翻译；支持遗传密码表（-g
  1-31）、起始密码子策略（-s 0/1/2）、 最小 ORF 长度（-ml）与链方向（-strand），输出 FASTA / CDS / Text ASN.1
  / Feature table。

  '
homepage: https://www.ncbi.nlm.nih.gov/orffinder/
license: Public Domain（NCBI / U.S. Government Work；二进制来自 NCBI FTP）
software_versions:
- id: orffinder_native
  orffinder: 0.4.3
  note: CONDA 路线：debian:bookworm-slim + apt 运行时 + micromamba 引导 bioconda env（orffinder=0.4.3，quay.io/preskaa/orffinder:0.4.3
    同版本）；二进制 ORFfinder 来自 NCBI。
- id: orffinder_nextflow_nfcore
  module_version: 官方无模块（modules/nf-core/orffinder 404）
  orffinder: —
  source: —（nf-core/modules 仓库 modules/nf-core/orffinder 目录不存在）
  note: 2026-09-01 抓取 https://api.github.com/repos/nf-core/modules/contents/modules/nf-core/orffinder
    返回 404；Nextflow 场景请使用 orffinder_nextflow_local。
- id: orffinder_snakemake_wrappers
  orffinder: 官方无 wrapper（bio/orffinder 404）
  source: —（snakemake-wrappers 仓库 bio/orffinder 目录不存在）
  note: 2026-09-01 抓取 https://api.github.com/repos/snakemake/snakemake-wrappers/contents/bio/orffinder
    返回 404；Snakemake 场景请使用 orffinder_snakemake_local。
- id: orffinder_nextflow_local
  orffinder: 未固定（用户按 main.nf 中 conda/container 自行声明）
- id: orffinder_snakemake_local
  orffinder: 0.4.3（建议；自维护规则，conda 指向 orffinder=0.4.3）
implementations:
- id: orffinder_native
  path: native
  source_type: custom
  type: native
  version: "0.4.3"
  priority: high
  when_to_use: '非流程引擎场景（AI Agent Function Calling / 独立 CLI / Shell 调用）的首选目标。

    '
  container_ref:
    bioconda: https://anaconda.org/bioconda/orffinder
    quay_biocontainers: 官方 biocontainers 无 ORFfinder（quay.io/biocontainers/orffinder 不存在，2026-09 核实 401/404）
    preskaa_orffinder: quay.io/preskaa/orffinder:0.4.3（作者组织官方镜像，tag 0.4.3，2026-09 核实存在）
    yangmingsi: https://anaconda.org/channels/YangmingSi/packages/orffinder/overview（自建频道：conda install -c
      YangmingSi orffinder=0.4.3；recipe 归档于 native/conda-recipe/meta.yaml，重建后 anaconda upload 发布）
    install_hint: 宿主机 mamba create -n <env> -c conda-forge -c bioconda <sw>；容器直接 docker pull
      quay.io/preskaa/orffinder:0.4.3（README 环境安装 §2）；自建 recipe（native/Dockerfile+Apptainer.def）供 main.py 驱动
      备选
- id: orffinder_snakemake_local
  path: snakemake
  source_type: custom
  type: snakemake_local
  version: "0.4.3"
  priority: medium
  when_to_use: 组装 Snakemake 流程时 include 本模块 snakemake/orffinder.smk 本地规则。
  note: 官方 snakemake-wrappers 无 bio/orffinder wrapper（2026-09-01 抓取 404），本地规则为唯一 Snakemake 路线
    （conda env：orffinder.yaml，orffinder=0.4.3），详见 software_versions。
default_implementation: orffinder_native
inputs:
  subcommand:
    type: string
    required: true
    description: orffinder 子命令：run（唯一核心命令）
  input:
    type: file
    required: true
    cli_arg: -in
    description: 输入核酸 FASTA（支持 .gz 时由驱动自动解压到 tmpdir）
  output:
    type: file
    required: false
    cli_arg: -out
    description: 输出文件（默认 <input_stem><suffix>，suffix 依 outfmt 而定）
  outfmt:
    type: integer
    default: 2
    cli_arg: -outfmt
    description: 输出格式：0=ORFs FASTA, 1=CDS FASTA, 2=Text ASN.1, 3=Feature table（默认
      2）
  genetic_code:
    type: integer
    required: false
    cli_arg: -g
    description: 遗传密码（1-31，NCBI 代码编号）
  start_codon:
    type: integer
    required: false
    cli_arg: -s
    description: 起始密码子策略：0=仅 ATG, 1=ATG 与替代起始, 2=任意有义密码子（默认 -s 2）
  min_length:
    type: integer
    required: false
    cli_arg: -ml
    description: 最小 ORF 长度（nt；默认 -ml 30）
  strand:
    type: string
    required: false
    cli_arg: -strand
    description: 链方向：both | plus | minus
  ignore_nested:
    type: boolean
    default: false
    cli_arg: -n
    description: 忽略完全嵌套在更大 ORF 内的 ORF（true/false）
  extra_args:
    type: string
    required: false
    description: 透传给 ORFfinder 的额外参数（高级用法，慎用）
outputs:
  result:
    type: file
    format:
    - fa
    - asn1
    - ft
    description: ORF 预测结果（后缀依 outfmt：0=_orf.fa, 1=_cds.fa, 2=.asn1, 3=.ft）
environment:
  conda: environment.yml
  dockerfile: Dockerfile
  apptainer_def: Apptainer.def
optimization:
  default_cpus: 4
  default_mem_mb: 4096
  tmpdir: /tmp
  env_vars:
    TMPDIR: '{tmpdir}'
    PYTHONUNBUFFERED: '1'
  per_subcommand_threads:
    run: 4
    default: 4
execution:
  entrypoint: python main.py
  test_command: bash test/run_test.sh
  binary: ORFfinder
  snakemake_include_hint: |-
    # 在 Snakefile 中（config 驱动单规则；环境 snakemake/orffinder.yaml、wrapper orffinder.py 均同目录）：
    include: "modules/orffinder/snakemake/orffinder.smk"
    # config 契约与独立运行示例见 orffinder.smk 头部，例如：
    #   snakemake -s modules/orffinder/snakemake/orffinder.smk \
    #       --config orffinder_input_fasta=transcripts.fa orffinder_outdir=orffinder_out \
    #       --cores 4 --use-conda
  snakemake_rules:
  - orffinder.smk
