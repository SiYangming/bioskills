# orffinder conda-build recipe（YangmingSi 个人频道 / 仅 linux-64）
# ---------------------------------------------------------------------------
# 用途：把 NCBI ORFfinder 官方二进制（ftp ORFfinder.gz，仅官方分发 linux-i64）打包为 conda 包
#       （orffinder=0.4.3，含 libuv/libnghttp2 运行依赖），发布到个人频道 YangmingSi。
# 平台：仅 linux-64 —— NCBI 无 macOS/其他平台 ORFfinder 二进制（source 为 .../linux-i64/ORFfinder.gz，
#       build.skip # [not linux64]），故与 riboss 同型只保留 linux-64 平台目录。
# 重建：conda build conda-recipe/linux-64  → 上传：anaconda upload ...（发布至 YangmingSi 频道）
# 安装：conda install -c YangmingSi orffinder=0.4.3
# 页面：https://anaconda.org/channels/YangmingSi/packages/orffinder/overview
# 说明：本配方为「自建频道兜底」——官方已有 quay.io/preskaa/orffinder:0.4.3 与
#       bioconda orffinder=0.4.3（后者含 python 包装）；此配方仅打包裸 ORFfinder 二进制。
# ---------------------------------------------------------------------------
{% set name = "orffinder" %}
{% set version = "0.4.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

# 关键新增：指定依赖查找频道，解决生物信息学包找不到的问题
channels:
  - conda-forge
  - default

source:
  url: https://ftp.ncbi.nlm.nih.gov/genomes/TOOLS/ORFfinder/linux-i64/ORFfinder.gz
  sha256: f30a0806b984931a967d8024066a53dbb811035ca14564f36f7f7045a6a509f2

build:
  number: 1
  skip: true  # [not linux64]
  script: |
    gunzip -fc $SRC_DIR/ORFfinder.gz > $SRC_DIR/ORFfinder
    if [ ! -f $SRC_DIR/ORFfinder ]; then
      echo "ERROR: ORFfinder解压失败！"
      exit 1
    fi
    mkdir -p $PREFIX/bin
    cp $SRC_DIR/ORFfinder $PREFIX/bin/
    chmod +x $PREFIX/bin/ORFfinder

requirements:
  build: []  # 无编译依赖
  run:
    - libgcc  # 基础glibc依赖
    - libuv   # 新增：ORFfinder必需的libuv.so.1依赖
    - libnghttp2

test:
  commands:
    - ORFfinder -h > /dev/null 2>&1  # 验证运行无报错
    - ORFfinder -dryrun > /dev/null 2>&1 # Dry run the application: do nothing, only test all preconditions

about:
  home: https://www.ncbi.nlm.nih.gov/orffinder/
  license: Public Domain (NCBI)
  summary: "NCBI ORFfinder: Finds open reading frames (ORFs) in nucleotide sequences"
