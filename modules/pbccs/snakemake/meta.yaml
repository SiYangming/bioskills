# pbccs / snakemake / local — 自维护 Snakemake rule
# ---------------------------------------------------------------------------
# source_type: custom —— 规则迁移自 snakemake.smk/isoseq.smk/workflow/modules/pbccs/snakemake/pbccs.smk，
# 去掉对 workflow/lib/helpers.py 的全局依赖，参数内联。
# 适用场景：官方 snakemake-wrappers 无 bio/pbccs（当前正是如此）。
# ---------------------------------------------------------------------------

id: pbccs_snakemake_local
version: "0.1.0"
software: pbccs
type: snakemake_local
source_type: custom

summary: "Self-maintained Snakemake rule for pbccs/ccs (迁移自 isoseq.smk/workflow/modules/pbccs/snakemake/pbccs.smk，官方 wrapper 缺失时的执行路径)."

agent_guidance:
  when_to_use: "Snakemake 流程中需要 ccs 生成 HiFi reads 时；官方 bio/pbccs wrapper 不存在，本 rule 为 Snakemake 场景主路径。"
  recommendation_priority: "Medium（Snakemake 流程引擎场景；CLI/Agent 直调请走 native）。"
  enabled: true

# 本实现实际运行的上游二进制版本 + 迁移来源
software_versions:
  pbccs: "6.4.0"
  binary: "ccs"
  source: "自维护 pbccs.smk（迁移自 snakemake.smk/isoseq.smk/workflow/modules/pbccs/snakemake/pbccs.smk；conda 建议 bioconda::pbccs=6.4.0）"
  note: "原 rule 依赖 workflow/lib/helpers.py 的 sample_to_bam / docker_run / LOG_DIR；迁移后输入用路径模板 subreads/{sample}.subreads.bam，docker 分支移除，直接调用 ccs 二进制。"

inputs:
  bam:
    type: file
    format: bam
    required: true
    description: "输入 subreads BAM（路径模板 subreads/{sample}.subreads.bam）"

outputs:
  bam:
    type: file
    format: bam
    description: "HiFi/CCS BAM"
  pbi:
    type: file
    format: pbi
    description: "CCS BAM 的 PacBio 索引"
  report:
    type: file
    format: txt
    description: "ccs 汇总报告（txt）"
  report_json:
    type: file
    format: json
    description: "ccs 汇总报告（json）"
  metrics:
    type: file
    format: json.gz
    description: "ZMW 级指标"

execution:
  mode: snakemake_rule
  rule_files:
    - "pbccs.smk"
  include_hint: |
    # 在 Snakefile 中：
    include: "modules/pbccs/snakemake/pbccs.smk"
  conda_hint: "rule 内 conda 指向 envs/pbccs.yaml（内容：bioconda::pbccs=6.4.0）"
