software: orfanage
canonical: orfanage
category: orf_annotation
description: 'ORFanage 用于在参考转录本模板上合并/注释来自不同预测工具的 ORF（GFF3）， 支持跨物种直系同源 ORF 保留、CDS 校验与统计输出。

  '
homepage: https://github.com/BrendelGroup/ORFanage
license: MIT
implementations:
- id: orfanage_native
  path: native
  source_type: custom
  type: native
  version: 1.2.0
  priority: high
  when_to_use: 非流程引擎场景（AI Agent Function Calling / 独立 CLI）首选。
  container_ref:
    bioconda: https://anaconda.org/bioconda/orfanage
    quay_biocontainers: quay.io/biocontainers/orfanage:1.2.0--heaafb18_2（2026-09 核实存在；depot.galaxyproject.org 同 tag 预构建 sif：https://depot.galaxyproject.org/singularity/orfanage%3A1.2.0--heaafb18_2）
    install_hint: 宿主机 mamba create -n <env> -c conda-forge -c bioconda <sw>；容器直接 docker pull
      quay.io/biocontainers/orfanage:1.2.0--heaafb18_2（README「容器」节）；自建 recipe（native/Dockerfile+Apptainer.def）供 main.py 驱动备选
- id: orfanage_snakemake_local
  path: snakemake
  source_type: custom
  type: snakemake_local
  version: "1.2.0"
  priority: medium
  when_to_use: snakemake-wrappers 官方无 orfanage wrapper，此路径为占位说明。
default_implementation: orfanage_native
software_versions:
  native:
    orfanage: 1.2.0
    build_route: bioconda（Debian apt 无 orfanage）
    source: bioconda::orfanage=1.2.0
    note: native 容器走 micromamba 引导 bioconda env。
  nextflow_nfcore:
    orfanage: 官方无 nf-core 模块
    module_version: ''
    source: （占位）
    note: 缺失时用 nextflow/local 或降级 native。
  nextflow_local:
    orfanage: （未启用占位）
  snakemake_wrappers:
    orfanage: 官方无 wrapper
    wrapper_tag: v3.13.0
    source: （占位）
    note: 缺失时用 snakemake/local。
  snakemake_local:
    orfanage: 1.2.0
    source: 自维护 orfanage.smk
    note: 规则参数与 native 对齐。
inputs:
  query:
    type: file
    format:
    - gff3
    required: true
    cli_arg: --query
    description: 预测的 GFF3（如 TransDecoder 输出的 *.transdecoder.gff3）
  output:
    type: file
    required: false
    cli_arg: --output
    description: 输出 GTF（默认 orfanage.gtf）
  reference:
    type: file
    format:
    - fasta
    required: false
    cli_arg: --reference
    description: 参考序列 FASTA
  templates:
    type: string
    required: true
    cli_arg: positional
    description: 一个或多个模板 FASTA（参考转录本/直系同源序列），空格分隔
  lpi:
    type: integer
    required: false
    cli_arg: --lpi
    description: 长蛋白长度阈值（-1 表示禁用）
  ilpi:
    type: integer
    required: false
    cli_arg: --ilpi
  mlpi:
    type: integer
    required: false
    cli_arg: --mlpi
  minlen:
    type: integer
    required: false
    cli_arg: --minlen
    description: 最小 ORF 长度
  mode:
    type: string
    required: false
    cli_arg: --mode
  stats:
    type: string
    required: false
    cli_arg: --stats
  overhang:
    type: integer
    required: false
    cli_arg: --overhang
  cleanq:
    type: boolean
    default: false
    cli_arg: --cleanq
  cleant:
    type: boolean
    default: false
    cli_arg: --cleant
  rescue:
    type: boolean
    default: false
    cli_arg: --rescue
  use_id:
    type: boolean
    default: false
    cli_arg: --use-id
  non_aug:
    type: boolean
    default: false
    cli_arg: --non-aug
  keep_all_cds:
    type: boolean
    default: false
    cli_arg: --keep-all-cds
  keep_cds_if_not_found:
    type: boolean
    default: false
    cli_arg: --keep-cds-if-not-found
  spliced_overhang:
    type: boolean
    default: false
    cli_arg: --spliced-overhang
  threads:
    type: integer
    default: 4
    cli_arg: --threads
    description: 线程数（自动注入）
  extra_args:
    type: string
    required: false
    description: 透传 orfanage 额外参数（高级用法，慎用）
outputs:
  orfanage_gtf:
    type: file
    format: gtf
    path_pattern: '{output}'
    description: ORFanage 合并/注释后的 GTF
environment:
  conda: environment.yml
  dockerfile: Dockerfile
  apptainer_def: Apptainer.def
optimization:
  default_cpus: 4
  default_mem_mb: 8192
  env_vars:
    TMPDIR: '{tmpdir}'
execution:
  entrypoint: python main.py
  test_command: bash test/run_test.sh
  binary: orfanage
  snakemake_include_hint: |-
    # 在 Snakefile 中（config 驱动单规则；环境 snakemake/orfanage.yaml、wrapper orfanage.py 均同目录）：
    include: "modules/orfanage/snakemake/orfanage.smk"
    # config 契约与独立运行示例见 orfanage.smk 头部，例如：
    #   snakemake -s modules/orfanage/snakemake/orfanage.smk \
    #       --config orfanage_input_query_dir=predict orfanage_templates=tpl.fa orfanage_outdir=orfanage_out \
    #       --cores 4 --use-conda
  snakemake_rules:
  - orfanage.smk
