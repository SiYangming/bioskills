# custom / nanoseq 复合流程元数据
# ---------------------------------------------------------------------------
# 流程：Nanopore RNA-seq（可选 SRA 下载 -> 可选 dorado 碱基识别 -> minimap2 比对
#       -> samtools sort/index/QC -> FLAIR consensus -> StringTie 组装
#       -> TransDecoder/TD2 ORF 预测）
# 迁移来源：snakemake.smk/nanoseq.smk（原以 nanoseq.sh/ shell 脚本为实际实现，
#       README 声明的 workflow/ 未随恢复保留，本编排按脚本逻辑重建）
# 本流程为**编排层**：默认调用 modules/ 下各原子模块的 default_implementation（native）。
# ---------------------------------------------------------------------------

id: custom_nanoseq
version: "0.1.0"
category: custom
type: custom_workflow
source_type: custom

summary: "Nanopore RNA-seq 流程编排：SRA(dorado) -> minimap2 -> samtools -> FLAIR -> StringTie -> TransDecoder/TD2 ORF"

description: |
  将 /snakemake.smk/nanoseq.smk 流程按「原子模块软件」拆分后重新编排：
  1) minimap2/samtools 复用已有技能，flair/stringtie/dorado/sra-tools/transdecoder/td2 为独立技能；
  2) 原 nanoseq.sh/*.sh 作为各模块 native/legacy/ 留存；
  3) 本目录只负责流程编排（stages + Python 编排器 + Snakemake 骨架）。

agent_guidance:
  when_to_use: "需要跑 Nanopore RNA-seq 全流程（比对->consensus->组装->ORF）时使用；单工具调用走各软件 native。"
  recommendation_priority: "Medium（复合流程编排层；单工具调用请走各软件 native）。"

stages:
  - id: sra_prep
    software: sra-tools
    implementation: sratools_native
    purpose: "可选：SRA 数据准备（prefetch + fasterq-dump，--with-prep 开关）"
  - id: dorado_basecall
    software: dorado
    implementation: dorado_native
    purpose: "可选：fast5 -> fastq 碱基识别（--with-dorado 开关，model 默认 rna004_130bps_sup@v5.1.0）"
  - id: minimap2_align
    software: minimap2
    implementation: minimap2_native
    purpose: "minimap2 比对（-x splice -uf -k14）| samtools sort 出 BAM"
  - id: samtools_qc
    software: samtools
    implementation: samtools_native
    purpose: "BAM 排序索引 + flagstat 比对统计"
  - id: flair_consensus
    software: flair
    implementation: flair_native
    purpose: "FLAIR consensus：bam2Bed12 -> identify_gene_isoform -> flair collapse"
  - id: stringtie_assembly
    software: stringtie
    implementation: stringtie_native
    purpose: "StringTie 组装（--conservative -L -R）+ 坐标修复 + --merge 合并"
  - id: orf_prediction
    software: transdecoder
    implementation: transdecoder_native
    purpose: "ORF 预测：TransDecoder/TD2（可选 orffinder）"

inputs:
  samplesheet:
    type: file
    required: true
    description: "样本表 CSV：sample,input_file（fastq 文件或目录，可含 barcode）,fasta,gtf"
  reference:
    type: file
    required: true
    description: "参考基因组 FASTA"
  gtf:
    type: file
    required: true
    description: "参考注释 GTF"
  outdir:
    type: string
    default: results
    description: "输出根目录"
  with_prep:
    type: boolean
    default: false
    description: "是否先做 SRA 下载与转 fastq（需 sra-tools）"
  with_dorado:
    type: boolean
    default: false
    description: "是否先做 dorado 碱基识别（fast5 输入时）"
  threads:
    type: integer
    default: 8

outputs:
  aligned_bam:
    path_pattern: "{outdir}/01_MINIMAP2_ALIGN/sorted_bam/{sample}.sorted.bam"
  flagstat:
    path_pattern: "{outdir}/01_MINIMAP2_ALIGN/FLAGSTAT/{sample}.flagstat.txt"
  consensus_fasta:
    path_pattern: "{outdir}/02_FLAIR_CONSENSUS/CONSENSUS_FASTA/{sample}.flair.collapse.fasta"
  stringtie_gtf:
    path_pattern: "{outdir}/03_STRINGTIE/ASSEMBLED_GTF/{sample}.stringtie.fixed.gtf"
  merged_gtf:
    path_pattern: "{outdir}/03_STRINGTIE/MERGED_GTF/stringtie_merged_nonredundant.gtf"
  transdecoder_pep:
    path_pattern: "{outdir}/04_1_TRANSDECODER_ORF_PREDICTION/MERGED_RESULTS/{sample}.pep"
  td2_gff3:
    path_pattern: "{outdir}/04_2_TD2_ORF_PREDICTION/{sample}.gff3"

execution:
  entrypoint: "python nanoseq.py"
  test_command: "python nanoseq.py --list-stages"
  dependencies_in_skills:
    - minimap2/native
    - samtools/native
    - flair/native
    - stringtie/native
    - transdecoder/native
    - td2/native
    - dorado/native
    - sra-tools/native
  workflow_skeleton:
    snakemake: "workflow_skeleton/Snakefile.template"
    nextflow: "workflow_skeleton/main.nf.template"
  fallback_note: "dorado/sra-tools 为可选前置；ORF 预测可用 transdecoder 或 td2 任一。"

optimization:
  default_cpus: 8
  default_mem_mb: 16384
