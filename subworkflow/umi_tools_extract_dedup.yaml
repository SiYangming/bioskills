# custom / umi_tools_extract_dedup 复合流程元数据

# 流程：umi_tools extract（SE/PE）->（中间比对由调用流程提供）-> umi_tools dedup
# 本组合为「UMI 阶段编排」：不内置比对器，dedup 输入 = 调用方产出的含 UMI 比对 BAM，
# 适配 riboseq（bbmap rRNA/tRNA/PC 或 bowtie2/STAR）等多种比对路线。
# 默认委托 modules/umi_tools 的 native 实现（modules/umi_tools/native/main.py）。

id: custom_umi_tools_extract_dedup
version: "0.1.0"
category: custom
type: custom_workflow
source_type: custom

summary: "可复用 UMI 处理阶段：umi_tools extract（SE/PE）-> [流程比对] -> umi_tools dedup（对已比对 BAM 去 PCR 重复）"

description: |
  登记型 UMI 组合（无 native/、无聚合 .smk）：
  1) 本 yaml 声明 stages / inputs / outputs；
  2) 执行走 modules/umi_tools/native/main.py（extract / dedup）；
  3) Snakemake 在项目内直接 include modules/umi_tools/snakemake 三规则（见 md）。
  中间比对不在此组合内：调用流程自行比对后再把 BAM 交给 dedup。

agent_guidance:
  when_to_use: "流程含 UMI 建库（Ribo-seq/Totals RNA-seq 等）需要 extract + dedup 阶段、且不想重复实现 umi_tools 调用时。"
  recommendation_priority: "Medium（UMI 阶段与比对器解耦，比对由调用流程决定）"

stages:
  - id: umi_extract
    software: umi_tools
    implementation: umi_tools_native
    purpose: "从 reads（SE/PE）提取 UMI 写入 read name（--bc-pattern / regex），输出带 UMI 的 FASTQ"
  - id: umi_dedup
    software: umi_tools
    implementation: umi_tools_native
    purpose: "对含 UMI 的已比对 BAM 按 UMI+坐标去 PCR 重复（--method/--paired/--output-stats）"

inputs:
  sample_id:
    type: string
    required: true
    description: "样本 ID（用于输出命名）"
  reads_r1:
    type: file
    required: true
    description: "extract 输入 R1（SE/PE）"
  reads_r2:
    type: file
    required: false
    description: "extract 输入 R2（PE 时提供）"
  bc_pattern:
    type: string
    required: true
    description: "UMI 条形码模式（N/C/X；regex 模式用于 Ribo-seq，如 ^(?P<umi_1>.{4}).+(?P<umi_2>.{4})$）"
  aligned_bam:
    type: file
    required: true
    description: "dedup 输入：比对后含 UMI 的 BAM（由调用流程的比对器产出）"
  outdir:
    type: string
    default: umi_out
  threads:
    type: integer
    default: 8

outputs:
  umi_fastq:
    path_pattern: "{outdir}/extract/{sample_id}[_R1|_R2].umi.fastq.gz（SE 无 _R 标号）"
  dedup_bam:
    path_pattern: "{outdir}/dedup/{sample_id}.dedup.bam"
  dedup_stats:
    path_pattern: "{outdir}/stats/{sample_id}_*（--stats 时生成）"

execution:
  entrypoint: "见 umi_tools_extract_dedup.md：modules/umi_tools extract →（外部比对）→ dedup；Snakemake 直接 include modules/umi_tools/snakemake/*.smk"
  dependencies_in_skills:
    - umi_tools/native
  fallback_note: "无编排 main.py；中间比对由调用方提供"
  test_command: "test -f subworkflow/umi_tools_extract_dedup.yaml"
  snakemake_include_hint: |
    include: "modules/umi_tools/snakemake/umi_tools_extract_se.smk"
    include: "modules/umi_tools/snakemake/umi_tools_extract_pe.smk"
    include: "modules/umi_tools/snakemake/umi_tools_dedup.smk"

optimization:
  default_cpus: 8
  default_mem_mb: 8192
