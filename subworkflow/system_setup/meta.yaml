# custom / system_setup 复合流程元数据
#
# 来源：chenlianfu training_pipelines/01.CentOS_System_Configuration
#   - modify_system_config_files.sh
#   - system_software_installation.sh
#
# 定位：教学 / 分析机 **宿主机环境引导**（OS 基线、中间件、语言运行时目录），
# 不是生信分析流程。与 AGENT.md §7「官方镜像优先」互补：容器跑工具，本组合
# 负责宿主机前置（httpd / MariaDB / ulimit / 软件根目录等）。

id: custom_system_setup
version: "0.1.0"
category: custom
type: custom_workflow
source_type: custom

summary: "宿主机系统引导：仓库源 → 基线包 → SSH/防火墙/ulimit → 用户环境 → httpd/MariaDB → 软件根目录 →（可选）系统运行时"

description: |
  将教学章 01.CentOS_System_Configuration 两份 shell 脚本按 bioskills subworkflow
  形态归档为可复用组合（canonical 名 **system_setup**，非 system_configuration）：
  1) meta 声明 stages / inputs / outputs（本文件）；
  2) native/main.py 编排（--list-stages / --dry-run 默认 / --real）；
  3) 硬编码路径一律参数化（train_user / train_home / bio_soft_root / sys_soft_root /
     mysql_datadir / http_ports），禁止复刻 /home/train、/opt/biosoft 写死路径；
  4) --real 需 root；危险步骤另需 --confirm-root；默认 dry-run 只打印将执行的命令。

agent_guidance:
  when_to_use: >
    用户要在 CentOS/RHEL 类宿主机上完成生信教学环境前置（开端口、MariaDB、httpd
    结果目录、软件安装根、ulimit），或迁移 chenlianfu 第 01 章脚本时。
    容器内分析工具安装仍走 modules/*/native（官方镜像优先），不要用本组合装生信软件本体。
  recommendation_priority: "Medium（环境前置；与各 workflow「前置环境」交叉引用）"
  warnings:
    - "多数 stage 需要 root；生产机勿直接 --real，先 --dry-run 审阅"
    - "源脚本含默认弱口令示例（MariaDB）；部署时必须改口令"
    - "SELinux disabled / 开放 3306 等仅适用于隔离教学机"
    - "GCC/Python/R 预编译包解压为教学遗留路径；现代路线优先 conda/mamba（见 AGENT.md §7）"

stages:
  - id: configure_repos
    purpose: "配置 dnf/yum 本地介质或镜像源（可选；缺 ISO/repo 文件则跳过并提示）"
  - id: install_base_packages
    purpose: "安装基线系统包（mariadb-server、httpd、lftp、开发库等；包列表可覆盖）"
  - id: harden_ssh
    purpose: "加固 sshd（Protocol 2、禁 root 密码登录策略、UseDNS no 等）并 reload"
  - id: configure_firewall
    purpose: "开放 http/http-alt/mysql 等端口并永久生效（端口列表可配置）"
  - id: configure_selinux_limits
    purpose: "SELinux 策略调整（教学默认 disabled）+ /etc/security/limits.conf ulimit"
  - id: configure_user_env
    purpose: "目标用户 .bashrc / .bash_profile（PS1、库路径、别名）；路径全部参数化"
  - id: setup_httpd
    purpose: "httpd：用户家目录 Alias、脚本纯文本展示、cgi；供生信网页结果浏览"
  - id: setup_mariadb
    purpose: "MariaDB 数据目录迁移、root/业务账号；供 PASA/MAKER/OrthoMCL/Blast2GO"
  - id: prepare_soft_dirs
    purpose: "创建 bio_soft_root / sys_soft_root（默认参数化，不再写死 /opt/biosoft）"
  - id: install_sysoft_runtimes
    purpose: "可选：解压教学预编译 GCC/Python/R/Perl/Java 到 sys_soft_root（遗留路径，默认跳过）"

inputs:
  train_user:
    type: string
    default: train
    description: "教学/分析用户名（原脚本写死 train）"
  train_home:
    type: string
    default: ""
    description: "用户家目录；空则用 /home/<train_user>"
  bio_soft_root:
    type: string
    default: /opt/biosoft
    description: "生信软件安装根（原 /opt/biosoft；可改）"
  sys_soft_root:
    type: string
    default: /opt/sysoft
    description: "系统运行时安装根（原 /opt/sysoft）"
  mysql_datadir:
    type: string
    default: ""
    description: "MariaDB datadir；空则用 <train_home 父目录>/.mysql 风格路径，见文档"
  software_cache:
    type: string
    default: ""
    description: "预编译包/ISO/repo 缓存目录；空则 <train_home>/software"
  http_ports:
    type: string
    default: "80,8080,3306"
    description: "防火墙开放端口（逗号分隔）"
  base_packages:
    type: string
    default: "httpd mariadb mariadb-server mariadb-devel lftp ftp gd gd-devel cmake gsl gsl-devel gnuplot gmp-devel libffi-devel"
    description: "install_base_packages 默认包列表（空格分隔）"
  enable_sysoft_runtimes:
    type: boolean
    default: false
    description: "是否执行 install_sysoft_runtimes（教学预编译包；默认 false）"
  confirm_root:
    type: boolean
    default: false
    description: "--real 时必须为 true，否则拒绝执行写系统文件的 stage"
  stages:
    type: string
    default: all
    description: "要跑的 stage id 列表（逗号分隔）或 all"

outputs:
  soft_dirs:
    path_pattern: "{bio_soft_root}/ ; {sys_soft_root}/"
  httpd_conf_snippet:
    path_pattern: "/etc/httpd/conf/httpd.conf（Alias /{train_user}）"
  mariadb_ready:
    path_pattern: "systemctl is-active mariadb（部署后）"
  dry_run_log:
    path_pattern: "stdout（--dry-run 打印的命令清单）"

execution:
  entrypoint: >
    python3 subworkflow/system_setup/native/main.py
    --list-stages | --dry-run（默认）| --real --confirm-root
  requires_root_for_real: true
  source_chapter: "01.CentOS_System_Configuration"
